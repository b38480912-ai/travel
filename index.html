function setExpenseTab(tab, filterType, filterVal) {
  state.expenseModalTab = tab;
  if (filterType==='date') toggleFilter('date', filterVal);
  else if (filterType==='pm') toggleFilter('pm', filterVal);
  else if (filterType==='cur') toggleFilter('cur', filterVal);
  else renderExpenseModal();
}
function toggleFilter(type, val) {
  if (type==='date') {
    if (state.filterDates.includes(val)) state.filterDates = state.filterDates.filter(x=>x!==val);
    else state.filterDates.push(val);
  } else if (type==='pm') {
    if (state.filterPaymentMethods.includes(val)) state.filterPaymentMethods = state.filterPaymentMethods.filter(x=>x!==val);
    else state.filterPaymentMethods.push(val);
  } else if (type==='cur') {
    if (state.filterCurrencies.includes(val)) state.filterCurrencies = state.filterCurrencies.filter(x=>x!==val);
    else state.filterCurrencies.push(val);
  }
  const overlay = document.getElementById('modal-overlay');
  if (!overlay.classList.contains('hidden')) {
    if (state.incomeModalTab!==undefined && document.querySelector('[onclick*="setIncomeTab"]')) renderIncomeModal();
    else renderExpenseModal();
  } else renderTab();
}

function openMemberModal() { renderMemberModal(); }
function renderMemberModal() {
  const t = state.currentTrip;
  let html = `<div class="modal-header"><span class="modal-title">成員管理</span><button class="close-btn" onclick="closeModal()">✕</button></div>
    <div style="display:flex;gap:10px;margin-bottom:16px">
      <input type="text" id="new-member-inp" placeholder="輸入新成員名字" style="flex:1">
      <button class="btn btn-primary" style="width:auto;padding:12px 16px" onclick="addMember()">新增</button>
    </div>`;
  t.members.forEach((m,i)=>{
    html += `<div class="member-row">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="member-avatar">${m.charAt(0)}</div>
        <span style="font-size:16px">${m}</span>
      </div>
      <div style="display:flex; gap:4px;">
        <button class="btn-icon" style="color:var(--blue)" onclick="editMember(${i})">✏️</button>
        <button class="btn-icon" style="color:var(--red)" onclick="removeMember(${i})">🗑️</button>
      </div>
    </div>`;
  });
  html += `<button class="btn btn-secondary" style="margin-top:16px;width:100%" onclick="closeModal()">關閉</button>`;
  showModal(html);
}
function addMember() {
  const v = document.getElementById('new-member-inp').value.trim();
  if (!v) return;
  if (state.currentTrip.members.includes(v)) return alert('此成員名稱已存在！');
  state.currentTrip.members.push(v);
  syncTripInList();
  renderMemberModal();
}
function editMember(idx) {
  const oldName = state.currentTrip.members[idx];
  const inputName = prompt('請輸入新的成員名字：', oldName);
  if (!inputName || inputName.trim() === '') return;
  const newName = inputName.trim();
  if (newName === oldName) return;
  if (state.currentTrip.members.includes(newName)) return alert('此成員名稱已存在，請使用其他名稱！');
  state.currentTrip.members[idx] = newName;
  state.expenses.forEach(e => {
    if (e.tripId !== state.currentTrip.id) return;
    if (e.splitMembers && e.splitMembers.includes(oldName)) { e.splitMembers = e.splitMembers.map(m => m === oldName ? newName : m); }
    if (e.subsidies) { e.subsidies.forEach(s => { if (s.member === oldName) s.member = newName; }); }
    if (e.cardPayer === oldName) e.cardPayer = newName;
    if (e.borrower === oldName) e.borrower = newName;
    if (e.payer === oldName) e.payer = newName;
  });
  syncTripInList();
  renderMemberModal();
}
function removeMember(idx) {
  if (!confirm(`確定要刪除成員 ${state.currentTrip.members[idx]} 嗎？`)) return;
  state.currentTrip.members.splice(idx,1);
  syncTripInList();
  renderMemberModal();
}
function syncTripInList() {
  state.trips = state.trips.map(t=>t.id===state.currentTrip.id?state.currentTrip:t);
  document.getElementById('detail-members').textContent = '成員：'+state.currentTrip.members.join(', ');
  saveToStorage();
}

        <span style="color:${personalNet>0?'var(--green)':personalNet<0?'var(--red)':'#666'}">${fmt(Math.abs(personalNet))} (${personalNet>0?'應退':personalNet<0?'應補':'結清'})</span>
      </div>`;
    } else {
      html += `<div class="summary-row-item"><span>總應補進公費:</span><span style="color:var(--red);font-weight:700">${fmt(totalCollect, lc)}</span></div>
        <div class="summary-row-item"><span>總應退回成員:</span><span style="color:var(--green);font-weight:700">${fmt(totalRefund, lc)}</span></div>

        ${calc.splitRoundingError && Math.abs(calc.splitRoundingError) > 0 ? `<div class="summary-row-item" style="color:#9ca3af;font-size:12px"><span>🔢 分攤捨入差額（已入公費池）:</span><span>${fmt(calc.splitRoundingError, lc)} ${lc}</span></div>` : ''}`;
    }

      if (!groupExps.length) return `<div style="text-align:center;color:#999;padding:10px">無${groupLabel}紀錄</div>`;
      let s = `<div style="background:${bgHeader};border-radius:7px;padding:8px 10px;margin-bottom:8px">`;

      const membersToRender = isMember ? [mf] : members;
      
      membersToRender.forEach(m => {
        const sm_paid = groupExps.filter(e => getCardPayer(e, members) === m);
        const sm_owed = groupExps.filter(e => {
          const sm = (e.splitMembers||[]).filter(x => members.includes(x));
          return (sm.length ? sm : members).includes(m);
        });
        const totalPaid = sm_paid.reduce((a, e) => a + getCardTotal(e), 0);
        const totalOwed = sm_owed.reduce((a, e) => {
          const sc = (e.splitMembers||[]).filter(x => members.includes(x)).length || members.length;
          return a + getCardCost(e, sc);
        }, 0);
        
        if (totalPaid === 0 && totalOwed === 0) return;
        hasAny = true;
        const gNet = totalPaid - totalOwed;
        const isCreditor = gNet > 0.01, isDebtor = gNet < -0.01;
        const cardBg     = isCreditor ? '#f0fdf4' : isDebtor ? 'var(--red-light)' : '#f9fafb';

        const uid = 'cov' + (window._cardOverviewIdx++);

          </div>
        </div>`;

        const pairs = calcPairNet(m, groupExps, members);
        s += `<div id="${uid}" class="hidden" style="width:100%;margin-top:6px;padding-top:6px;border-top:1px solid #e5e7eb">`;
        if (pairs.length) {
          pairs.forEach(p => {
            const isRec = p.net > 0;
            const col   = isRec ? '#059669' : '#dc2626';
            const arrow = isRec ? '←' : '→';
            const verb  = isRec ? '應收' : '應付';
            s += `<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 2px;border-bottom:1px dotted #e5e7eb">
              <span style="color:${col}">${arrow} ${m} ${verb} ${p.other}</span>
              <span style="font-weight:700;color:${col}">${hc} ${fmt(Math.abs(p.net))}</span>

          s += `<div style="font-size:11px;color:#9ca3af;padding:2px 0">與其他成員無代墊往來</div>`;
        }
        s += '</div></div>'; 
      });

      s += '</div>';
      return s;
    }
    
    html += renderCardGroupOverview('💳 TWD 刷卡', calc.twdCardExps, '#e0f2fe', '#0369a1');
    html += renderCardGroupOverview('🌏 當地幣別刷卡', calc.foreignCardExps, '#f3e8ff', '#7c3aed');
    
    if(filtCard.length && isMember){
      const twdNet = calc.twdGroup.paid[mf]-calc.twdGroup.owed[mf];

        html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px dotted #d1fae5">
          <span><span style="font-weight:700;color:var(--red)">${s.member}</span> → <span style="font-weight:700;color:var(--green)">${s.target}</span></span>
          <span style="font-weight:700;color:var(--red)">${s.currency} ${fmt(s.amount)}</span>
        </div>`;
      });
      const grandTotal=filtCard.reduce((s,x)=>s+x.amount,0);
      html+=`<div style="text-align:right;font-size:13px;font-weight:700;color:#059669;margin-top:6px;padding-top:4px;border-top:1px solid #86efac">合計：${hc} ${fmt(grandTotal)}</div>`;
      html+=`</div>`;
    }
  }

  if (tab==='cash') {
    html += `<h4 style="font-size:16px;font-weight:700;margin-bottom:12px">公費現金結算詳情 (${lc})</h4>`;
    filtCash.forEach(s=>{
      const cls = s.amount>0?'checkout-pos':s.amount<0?'checkout-neg':'checkout-neu';
      const bd = memberBreakdown[s.member]||{};
      html += `<div class="checkout-item ${cls}" style="flex-direction:column;align-items:flex-start;gap:6px">
        <div style="display:flex;justify-content:space-between;width:100%;align-items:center">
          <div class="checkout-name">${s.member}</div>
          <div class="${s.amount>0?'checkout-amt-pos':'checkout-amt-neg'}">${s.currency} ${fmt(Math.abs(s.amount))} <span style="font-size:12px;font-weight:400">${s.type}</span></div>
        </div>
        <div style="width:100%;font-size:12px;color:#555;display:flex;flex-direction:column;gap:2px;padding-top:6px;border-top:1px dashed #ddd">
          <div style="display:flex;justify-content:space-between"><span>初始繳費:</span><span>+${fmt(bd.initialFee||0)}</span></div>
          <div style="display:flex;justify-content:space-between"><span>應分攤支出:</span><span>-${fmt(bd.expenseShare||0)}</span></div>
          <div style="display:flex;justify-content:space-between"><span>個人支援:</span><span>+${fmt(bd.memberSubsidy||0)}</span></div>
          <div style="display:flex;justify-content:space-between"><span>淨借款:</span><span>-${fmt(bd.netLoan||0)}</span></div>
        </div>
      </div>`;
    });
    if (!filtCash.length) html += `<div style="text-align:center;color:#999;padding:20px">無需現金結算</div>`;
  }

  if (tab==='card') {
    html += `<h4 style="font-size:16px;font-weight:700;margin-bottom:12px">刷卡/代墊結算</h4>`;

    function renderCardGroupDetail(groupLabel, groupExps, bgHeader, titleColor) {
      if (!groupExps.length) return '';
      
      const membersToRender = isMember ? [mf] : members;
      let memberHtml = '';
      let groupSubTotal = 0;
      let hasAny = false;

      membersToRender.forEach(m => {
        const sm_paid = groupExps.filter(e => getCardPayer(e, members) === m);
        const sm_owed = groupExps.filter(e => {
          const sm = (e.splitMembers||[]).filter(x => members.includes(x));
          return (sm.length ? sm : members).includes(m);
        });
        const totalPaid = sm_paid.reduce((a, e) => a + getCardTotal(e), 0);
        const totalOwed = sm_owed.reduce((a, e) => {
          const sc = (e.splitMembers||[]).filter(x => members.includes(x)).length || members.length;
          return a + getCardCost(e, sc);
        }, 0);
        
        if (totalPaid === 0 && totalOwed === 0) return;
        hasAny = true;
        
        const gNet = totalPaid - totalOwed;
        const isCreditor = gNet > 0.01;
        const isDebtor   = gNet < -0.01;
        const cardBg     = isCreditor ? '#f0fdf4' : isDebtor ? 'var(--red-light)' : '#f9fafb';
        const cardBorder = isCreditor ? 'var(--green)' : isDebtor ? 'var(--red)' : '#ddd';
        const netCol     = isCreditor ? 'var(--green)' : isDebtor ? 'var(--red)' : '#666';
        const netLabel   = isCreditor ? '應收回' : isDebtor ? '應付' : '結清';
        
        if (isCreditor) groupSubTotal += gNet;
        
        memberHtml += `<div class="checkout-item" style="flex-direction:column;align-items:flex-start;background:${cardBg};border-left-color:${cardBorder};margin-bottom:6px">`;
        memberHtml += `<div style="display:flex;justify-content:space-between;width:100%;margin-bottom:6px">
          <span style="font-weight:700;font-size:13px;color:${netCol}">${m}</span>
          <span style="font-weight:700;color:${netCol}">${isCreditor?'收回':'應付'} ${hc} ${fmt(Math.abs(gNet))}</span>
        </div>`;
        
        if (sm_paid.length) {
          memberHtml += `<div style="font-size:10px;color:#059669;font-weight:700;margin-bottom:3px">📤 代墊明細</div>`;
          sm_paid.forEach(e => {
            const sc = (e.splitMembers||[]).filter(x => members.includes(x)).length || members.length;
            const tot = getCardTotal(e);
            const myShare = getCardCost(e, sc);
            const netBack = tot - myShare;
            memberHtml += `<div style="width:100%;font-size:11px;color:#555;padding:3px 4px;border-bottom:1px dotted #d1fae5;margin-bottom:1px">
              <div style="display:flex;justify-content:space-between">
                <span>${e.date} | ${e.item}</span>
                <span style="color:#059669;font-weight:600">代墊 ${hc} ${fmt(tot)}</span>
              </div>
              <div style="font-size:10px;color:#6b7280;margin-top:1px">
                ${hc} ${fmt(tot)} ÷ ${sc}人 = 自付 ${fmt(myShare)}，淨收回 <span style="color:#059669;font-weight:700">+${fmt(netBack)}</span>
              </div>
            </div>`;
          });
        }
        
        if (sm_owed.length) {
          memberHtml += `<div style="font-size:10px;color:#dc2626;font-weight:700;margin:5px 0 3px">📥 分攤明細</div>`;
          sm_owed.forEach(e => {
            const sc = (e.splitMembers||[]).filter(x => members.includes(x)).length || members.length;
            const cost = getCardCost(e, sc);
            const payer = getCardPayer(e, members);
            const isPaidByMe = payer === m;
            if (isPaidByMe) return;
            memberHtml += `<div style="width:100%;font-size:11px;color:#555;padding:3px 4px;border-bottom:1px dotted #fee2e2;margin-bottom:1px">
              <div style="display:flex;justify-content:space-between">
                <span>${e.date} | ${e.item}</span>
                <span style="color:#dc2626;font-weight:600">應付 ${hc} ${fmt(cost)}</span>
              </div>
              <div style="font-size:10px;color:#6b7280;margin-top:1px">${payer} 代墊，${sc}人分攤</div>
            </div>`;
          });
        }
        
        memberHtml += `<div style="display:flex;justify-content:space-between;width:100%;margin-top:6px;padding-top:4px;border-top:1px solid #e5e7eb">
          <span style="font-size:11px;color:#6b7280">代墊 ${fmt(totalPaid)} - 分攤 ${fmt(totalOwed)}</span>
          <span style="font-size:12px;font-weight:700;color:${netCol}">${netLabel} ${hc} ${fmt(Math.abs(gNet))}</span>
        </div>`;
        
        if (isCreditor) {
          const sources = cardSettlement.filter(x => x.target === m);
          if (sources.length) {
            memberHtml += `<div style="font-size:10px;color:#059669;font-weight:700;margin-top:5px">💰 收款來源（合計折抵後）</div>`;
            sources.forEach(x => {
              memberHtml += `<div style="font-size:11px;color:#555;display:flex;justify-content:space-between;padding:2px 0">
                <span>← ${x.member}</span>
                <span style="font-weight:600;color:#059669">${x.currency} ${fmt(x.amount)}</span>
              </div>`;
            });
          }
        }
        memberHtml += '</div>';
      });

      if (!hasAny) return '';

      let s = `<div style="background:${bgHeader};border-radius:7px;padding:8px 10px;margin-bottom:10px">`;
      s += `<div style="font-size:12px;font-weight:700;color:${titleColor};margin-bottom:8px">${groupLabel}</div>`;
      s += memberHtml;

      if (groupSubTotal > 0 && !isMember) {
        s += `<div style="text-align:right;font-size:12px;font-weight:700;color:${titleColor};margin-top:4px;padding-top:4px;border-top:1px solid ${titleColor}33">小計：${hc} ${fmt(groupSubTotal)}</div>`;
      }
      s += '</div>';
      return s;
    }

    let hasCardSrc = false;
    const twdHtml = renderCardGroupDetail('💳 TWD 刷卡', calc.twdCardExps, '#e0f2fe', '#0369a1');
    if (twdHtml) { html += twdHtml; hasCardSrc = true; }

    const forHtml = renderCardGroupDetail('🌏 當地幣別刷卡', calc.foreignCardExps, '#f3e8ff', '#7c3aed');
    if (forHtml) { html += forHtml; hasCardSrc = true; }

    if (!hasCardSrc) {
       html += `<div style="text-align:center;color:#999;padding:16px;background:var(--white);border-radius:8px">此成員無刷卡代墊紀錄</div>`;
    } else {
      if (filtCard.length && isMember) {
        const twdNet = calc.twdGroup.paid[mf]-calc.twdGroup.owed[mf];
        const forNet = calc.foreignGroup.paid[mf]-calc.foreignGroup.owed[mf];
        const tNet = twdNet + forNet;
        const cLabel = tNet > 0 ? '應收回' : tNet < 0 ? '應付' : '結清';
        const cCol = tNet > 0 ? 'var(--green)' : tNet < 0 ? 'var(--red)' : '#666';
        html += `<div class="checkout-item" style="border-left-color:${cCol};background:${tNet>=0?'#e0f2fe':'#fff7ed'};margin-top:4px"><span style="font-weight:700">合計淨額：</span><span style="font-weight:700;color:${cCol}">${hc} ${fmt(Math.abs(tNet))} (${cLabel})</span></div>`;
      } else if (filtCard.length && !isMember) {
        html += `<div style="background:#f0fdf4;border-radius:7px;padding:8px 10px;border:1px solid #86efac;margin-top:4px">`;
        html += `<div style="font-size:12px;font-weight:700;color:#059669;margin-bottom:6px">✅ 合計折抵後實際應付</div>`;
        filtCard.forEach(s => {
          html += `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted #d1fae5">
            <span><span style="font-weight:700;color:var(--red)">${s.member}</span> → <span style="font-weight:700;color:var(--green)">${s.target}</span></span>
            <span style="font-weight:700;color:var(--red)">${s.currency} ${fmt(s.amount)}</span>
          </div>`;
        });
        const grand = filtCard.reduce((s, x) => s + x.amount, 0);
        html += `<div style="text-align:right;font-size:13px;font-weight:700;color:#059669;margin-top:6px;padding-top:4px;border-top:1px solid #86efac">合計：${hc} ${fmt(grand)}</div>`;
        html += '</div>';
      }
    }
  }
  if (tab==='personal') {
    if (!isMember) {
      html += `<div style="text-align:center;padding:20px;color:#999">請先選擇一位成員來查看個人財務明細。</div>`;
    } else {
      const bd = memberBreakdown[mf]||{};
      const personalNet = (bd.initialFee||0)-(bd.expenseShare||0)+(bd.memberSubsidy||0)-(bd.netLoan||0);
      const persExps = state.expenses.filter(e=>e.tripId===state.currentTrip.id&&e.accountType==='支出'&&e.category!=='公費借出').map(e=>{
        const sm=(e.splitMembers||[]).filter(m=>members.includes(m)); const sc=sm.length||members.length;
        const cost=(parseFloat(e.amount)||0)/sc;
        const b=parseFloat(e.billingAmount)||0,f=Math.round(b*(parseFloat(e.feeRate)||0)/100),tot=b+f;
        const twdCost=e.paymentMethod==='信用卡'&&b?parseFloat(fmtCeil(tot/sc)):0;
        const mSub=(e.subsidies||[]).filter(s=>s.member===mf).reduce((s,x)=>s+(parseFloat(x.amount)||0),0);
        return {...e,costPerPersonLocal:cost,costPerPersonTWD:twdCost,isParticipant:(sm.length?sm:members).includes(mf),memberSubsidy:mSub};
      }).filter(e=>e.isParticipant||e.memberSubsidy>0).sort((a,b)=>new Date(b.date)-new Date(a.date));

      const cashTotal = persExps.filter(e=>e.paymentMethod==='現金'&&e.isParticipant&&(e.currency||lc)===lc).reduce((s,e)=>s+e.costPerPersonLocal,0);
      const cardTotal = persExps.filter(e=>e.paymentMethod==='信用卡'&&e.isParticipant).reduce((s,e)=>s+e.costPerPersonTWD,0);
      const subTotal = persExps.reduce((s,e)=>s+e.memberSubsidy,0);

      const myDebts = cardSettlement.filter(s => s.member === mf);
      const myCredits = cardSettlement.filter(s => s.target === mf);
      let cardSettleHtml = `<div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)">
        <div style="font-size:12px;font-weight:700;color:#555;margin-bottom:6px">刷卡/代墊結算 (${hc}):</div>`;
      if (myDebts.length === 0 && myCredits.length === 0) {
        cardSettleHtml += `<div style="font-size:13px;color:#999;text-align:right">無欠款 / 已結清</div>`;
      } else {
        myDebts.forEach(d => {
          cardSettleHtml += `<div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px">
            <span style="color:#555">應付給 <span style="font-weight:700;color:#333">${d.target}</span>:</span>
            <span style="color:var(--red);font-weight:700">${hc} ${fmt(d.amount)}</span>
          </div>`;
        });
        myCredits.forEach(c => {
          cardSettleHtml += `<div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px">
            <span style="color:#555">向 <span style="font-weight:700;color:#333">${c.member}</span> 收回:</span>
            <span style="color:var(--green);font-weight:700">${hc} ${fmt(c.amount)}</span>
          </div>`;
        });
      }
      cardSettleHtml += `</div>`;

      html += `<div style="background:var(--white);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px">
        <div class="summary-block-title">${mf} 的總負擔</div>
        <div class="summary-row-item"><span>現金總分攤:</span><span style="font-weight:700;color:${cashTotal>0?'var(--red)':'#333'}">${lc} ${fmt(cashTotal)}</span></div>
        <div class="summary-row-item"><span>刷卡總分攤 (${hc}):</span><span style="font-weight:700;color:${cardTotal>0?'var(--blue)':'#333'}">${hc} ${fmt(cardTotal)}</span></div>
        <div class="summary-row-item" style="border-top:1px solid var(--border);padding-top:8px;margin-top:8px"><span style="color:var(--green);font-weight:700">+ 小額支援總額:</span><span style="font-weight:700;color:var(--green)">${lc} ${fmt(subTotal)}</span></div>
        <div class="summary-row-item" style="font-weight:700;margin-top:8px"><span>現金淨結算:</span><span style="color:${personalNet>0?'var(--green)':personalNet<0?'var(--red)':'#666'}">${fmt(Math.abs(personalNet))} (${personalNet>0?'應退':personalNet<0?'應補':'結清'})</span></div>
        ${cardSettleHtml}
      </div>`;

      html += `<div style="font-size:14px;font-weight:700;color:#666;margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:6px">${mf} 的參與與支援明細</div>`;
      
      persExps.forEach(e=>{
        const payer = getCardPayer(e, members);
        const payerBadge = e.paymentMethod === '信用卡' 
          ? `<div style="flex-shrink:0; max-width:85px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:#e0f2fe; color:#0369a1; padding:2px 5px; border-radius:4px; font-size:10px; font-weight:700;">💳 ${payer} 代墊</div>` 
          : '';
          
        html += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dotted var(--border);font-size:13px">
          <div style="flex:2; min-width:0; padding-right:6px;">
            <div style="display:flex; align-items:center; gap:6px; margin-bottom:3px;">
              <div style="font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${e.item || '(未命名)'}</div>
              ${payerBadge}
            </div>
            <div style="font-size:11px;color:#999">${e.date} | ${e.paymentMethod}${e.memberSubsidy>0?'<span style="color:var(--green);margin-left:4px">[支援]</span>':''}</div>
          </div>
          <div style="flex:1.5;text-align:right;font-size:11px;color:#666">${e.currency||lc} ${fmt(e.amount)}</div>
          <div style="flex:1.5;text-align:right">
            ${e.isParticipant?`<div style="font-size:12px;font-weight:700;color:${e.paymentMethod==='現金'?'var(--red)':'var(--blue)'}">${e.paymentMethod==='現金'?lc:hc} ${fmt(e.paymentMethod==='現金'?e.costPerPersonLocal:e.costPerPersonTWD)}</div><div style="font-size:10px;color:#999">(${(e.splitMembers||members).length}人分攤)</div>`:''}
            ${e.memberSubsidy>0?`<div style="font-size:12px;font-weight:700;color:var(--green)">(+${fmt(e.memberSubsidy)})</div>`:''}
          </div>
        </div>`;
      });
      if (!persExps.length) html += `<div style="text-align:center;color:#999;padding:10px">${mf} 無公費支出紀錄</div>`;

      // UI修正：按鈕修改為不換行的獨立樣式
      html += `<div style="margin-top:16px; text-align:right;">
        <button style="background:var(--blue-light);color:var(--blue);border:1px solid var(--blue);font-size:13px;padding:8px 16px;border-radius:20px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px;" onclick="exportCheckoutPDF('${mf}')">📄 匯出 PDF 報告</button>
      </div>`;
    }
  }

  html += `<button class="btn btn-secondary" style="margin-top:16px;width:100%" onclick="closeModal()">關閉結算</button>`;
  showModal(html);
}
function setCheckoutTab(tab) { state.activeCheckoutTab=tab; renderCheckoutModal(); }
function setCheckoutFilter(val) { state.checkoutMemberFilter=val; renderCheckoutModal(); }
function toggleCardDetail(id) {
  const el = document.getElementById(id) || document.getElementById(`card-detail-${id}`);
  if (!el) return;
  const isHidden = el.classList.toggle('hidden');
  const arrow = document.getElementById(id+'-arrow');
  if (arrow) arrow.style.transform = isHidden ? '' : 'rotate(180deg)';
}

function showModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
  if (state.activeTab==='pool') renderTab();
}
function closeModalOnOverlay(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

(function() {
  let active = null;
  function getEls(id) {
    const el = document.getElementById(id);
    if (!el) return null;
    const content = el.querySelector('.swipe-content');
    const bg = el.querySelector('.swipe-bg');
    return { el, content, bg };
  }
  function reset(r) {
    r.content.style.transition = 'transform 0.2s ease-out';
    r.content.style.transform = 'translateX(0)';
    r.bg.style.width = '0px';
    r.bg.classList.remove('full');
    r.bg.innerHTML = '🗑️';
  }
  function confirmDelete(r, onDelete) {
    r.content.style.transition = 'transform 0.22s ease-in';
    r.content.style.transform = 'translateX(-110%)';
    setTimeout(() => {
      r.el.style.transition = 'max-height 0.25s ease, opacity 0.25s ease, margin-bottom 0.25s ease, padding 0.25s ease';
      r.el.style.overflow = 'hidden';
      r.el.style.maxHeight = r.el.offsetHeight + 'px';
      requestAnimationFrame(() => {
        r.el.style.maxHeight = '0';
        r.el.style.opacity = '0';
        r.el.style.marginBottom = '0';
      });
      setTimeout(() => { if (onDelete) onDelete(); }, 280);
    }, 180);
  }
  function updateSwipe(r, dx) {
    const elW = r.el.offsetWidth;
    const offset = Math.max(dx, -elW);
    const absOff = Math.abs(offset);
    r.content.style.transition = 'none';
    r.content.style.transform = `translateX(${offset}px)`;
    r.bg.style.width = absOff + 'px';
    const pct = absOff / elW;
    if (pct > 0.45) {
      r.bg.classList.add('full');
      r.bg.innerHTML = '🗑️ 放開刪除';
      return true;
    } else {
      r.bg.classList.remove('full');
      r.bg.innerHTML = '🗑️';
      return false;
    }
  }

  document.addEventListener('touchstart', function(e) {
    const wrap = e.target.closest('.swipe-wrap');
    if (!wrap) return;
    const r = getEls(wrap.id);
    if (!r) return;
    const t = e.touches[0];
    active = { id: wrap.id, startX: t.clientX, startY: t.clientY,
               curDX: 0, confirmed: false, moved: false,
               onDelete: wrap._onDelete, onTap: wrap._onTap, ...r };
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (!active) return;
    const t = e.touches[0];
    const dx = t.clientX - active.startX;
    const dy = t.clientY - active.startY;
    if (!active.moved && Math.abs(dy) > Math.abs(dx)) {
      active = null; return;
    }
    if (dx >= 0) {
      if (active.moved) { reset(active); active = null; }
      return;
    }
    e.preventDefault();
    active.moved = true;
    active.curDX = dx;
    active.confirmed = updateSwipe(active, dx);
  }, { passive: false });

  document.addEventListener('touchend', function(e) {
    if (!active) return;
    const a = active; active = null;
    if (!a.moved) {
      if (a.onTap) a.onTap();
      return;
    }
    if (a.confirmed) confirmDelete(a, a.onDelete);
    else reset(a);
  }, { passive: true });

  document.addEventListener('mousedown', function(e) {
    const wrap = e.target.closest('.swipe-wrap');
    if (!wrap) return;
    const r = getEls(wrap.id);
    if (!r) return;
    active = { id: wrap.id, startX: e.clientX, startY: e.clientY,
               curDX: 0, confirmed: false, moved: false,
               onDelete: wrap._onDelete, onTap: wrap._onTap, ...r };
  });
  document.addEventListener('mousemove', function(e) {
    if (!active || active.isTouch) return;
    const dx = e.clientX - active.startX;
    if (dx >= 0) {
      if (active.moved) { reset(active); active = null; }
      return;
    }
    active.moved = true;
    active.curDX = dx;
    active.confirmed = updateSwipe(active, dx);
  });
  document.addEventListener('mouseup', function(e) {
    if (!active || active.isTouch) return;
    const a = active; active = null;
    if (!a.moved) {
      if (a.onTap) a.onTap();
      return;
    }
    if (a.confirmed) confirmDelete(a, a.onDelete);
    else reset(a);
  });
})();

function initSwipeItems() {
  document.querySelectorAll('.swipe-wrap[data-delete]').forEach(wrap => {
    const delFn = wrap.getAttribute('data-delete');
    const tapFn = wrap.getAttribute('data-tap');
    wrap._onDelete = delFn ? () => { try { eval(delFn); } catch(e){} } : null;
    wrap._onTap    = tapFn ? () => { try { eval(tapFn); } catch(e){} } : null;
  });
}

function handlePersonalSearch(v) {
  state.personalSearchTerm = v;
  const clearBtn = document.getElementById('personal-search-clear');
  if (clearBtn) clearBtn.style.display = v ? 'flex' : 'none';
  const container = document.getElementById('personal-expense-list-container');
  if (container) {
    container.innerHTML = renderPersonalListHTML();
    requestAnimationFrame(initSwipeItems);
  }
}

function renderPersonalListHTML() {
  const filtered = getFilteredPersonalExpenses();
  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    ${filtered.length ? `<h3 style="font-size:15px;color:#666;margin:0">花費記錄 <span style="font-size:12px;color:#999">(${filtered.length} 筆)</span></h3>` : ''}
  </div>`;

  if (!filtered.length) {
    html += `<div style="text-align:center;color:#999;padding:30px 0">
      <div style="font-size:36px;margin-bottom:8px">💳</div>
      <div>${state.personalSearchTerm||state.personalFilterCat||state.personalFilterDate ? '找不到符合的花費' : '還沒有個人花費記錄'}</div>
      ${!state.personalForm ? `<button class="btn btn-purple" style="margin-top:16px;width:auto;padding:12px 24px" onclick="openPersonalForm()">新增第一筆</button>` : ''}
    </div>`;
  } else {
    filtered.forEach(e => { html += renderPersonalItem(e); });
  }
  return html;
}

const PERSONAL_CATS = ['吃喝','交通','購物','娛樂','住宿','醫藥','其他'];
const PERSONAL_CAT_COLORS = {
  '吃喝':'#f59e0b','交通':'#06b6d4','購物':'#ec4899',
  '娛樂':'#8b5cf6','住宿':'#3b82f6','醫藥':'#10b981','其他':'#6b7280'
};
const PERSONAL_PAYMENT = ['現金','信用卡','電子支付'];

function getPersonalCatColor(cat) { return PERSONAL_CAT_COLORS[cat] || '#6b7280'; }
function defaultPersonalForm() {
  return { date: new Date().toISOString().split('T')[0], item: '', amount: '', currency: localCur(), category: '吃喝', paymentMethod: '現金', notes: '', attachments: [] };
}
function getTripPersonalExpenses() {
  const t = state.currentTrip;
  if (!t) return [];
  return state.personalExpenses.filter(e => e.tripId === t.id);
}
function getFilteredPersonalExpenses() {
  let list = getTripPersonalExpenses();
  if (state.personalFilterCat)  list = list.filter(e => e.category === state.personalFilterCat);
  if (state.personalFilterDate) list = list.filter(e => e.date === state.personalFilterDate);
  if (state.personalSearchTerm) {
    const q = state.personalSearchTerm.toLowerCase();
    list = list.filter(e => e.item?.toLowerCase().includes(q) || e.notes?.toLowerCase().includes(q) || e.amount?.toString().includes(q) || e.category?.toLowerCase().includes(q));
  }
  return list.sort((a,b) => b.date.localeCompare(a.date));
}

function renderPersonalTab() {
  const lc = localCur(), hc = habitCur();
  const allExps = getTripPersonalExpenses();
  const catTotals = {};
  PERSONAL_CATS.forEach(c => { catTotals[c] = 0; });
  allExps.forEach(e => {
    const c = e.category||'其他';
    catTotals[c] = (catTotals[c]||0) + (parseFloat(e.amount)||0);
  });
  const topCats = Object.entries(catTotals).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const allDates = [...new Set(allExps.map(e=>e.date))].sort((a,b)=>b.localeCompare(a));
  const totalLocal = allExps.filter(e=>(e.currency||lc)===lc).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const totalTWD   = allExps.filter(e=>e.currency===hc).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);

  let html = '';
  html += `<div style="background:var(--white);border-radius:20px;padding:20px;box-shadow:0 10px 25px -5px rgba(0,0,0,0.05);margin-bottom:16px">
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:13px;color:var(--text-sub);margin-bottom:4px">個人花費總計</div>
      <div style="display:flex;align-items:baseline;justify-content:center;gap:6px">
        <span style="font-size:22px;color:#64748b;font-weight:500">${lc}</span>
        <span style="font-size:42px;font-weight:800;color:var(--text)">${fmt(totalLocal)}</span>
      </div>
      ${totalTWD>0 ? `<div style="font-size:13px;color:var(--text-sub);margin-top:4px">另 ${hc} ${fmt(totalTWD)}</div>` : ''}
    </div>`;

  if (topCats.length > 0) {
    const maxVal = topCats[0][1];
    html += `<div style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px">
      <div style="font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:8px">分類佔比</div>`;
    topCats.slice(0,5).forEach(([cat,val]) => {
      const pct = maxVal > 0 ? Math.round(val/maxVal*100) : 0;
      html += `<div style="margin-bottom:6px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
          <span style="font-weight:600;color:${getPersonalCatColor(cat)}">${cat}</span>
          <span style="color:var(--text-sub)">${lc} ${fmt(val)}</span>
        </div>
        <div style="background:#f0f0f0;border-radius:4px;height:6px;overflow:hidden">
          <div style="width:${pct}%;background:${getPersonalCatColor(cat)};height:100%;border-radius:4px;transition:width 0.4s"></div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  html += `<button class="btn btn-purple" style="width:100%;margin-top:14px" onclick="openPersonalForm()">＋ 新增個人花費</button>
  </div>`;

  html += `<div class="filter-row" style="margin-bottom:8px">
    <span style="font-size:12px;color:#999;white-space:nowrap">類別:</span>
    <div class="chip ${!state.personalFilterCat?'active-purple':''}" onclick="setPersonalFilter('cat','')">全部</div>
    ${PERSONAL_CATS.map(c=>`<div class="chip ${state.personalFilterCat===c?'active-purple':''}" onclick="setPersonalFilter('cat','${c}')" style="${state.personalFilterCat===c?'':'border-left:3px solid '+getPersonalCatColor(c)}">${c}</div>`).join('')}
  </div>`;

  if (allDates.length > 1) {
    html += `<div class="filter-row" style="margin-bottom:10px">
      <span style="font-size:12px;color:#999;white-space:nowrap">日期:</span>
      <div class="chip ${!state.personalFilterDate?'active-purple':''}" onclick="setPersonalFilter('date','')">全部</div>
      ${allDates.map(d=>`<div class="chip ${state.personalFilterDate===d?'active-purple':''}" onclick="setPersonalFilter('date','${d}')">${formatDateSimple(d)}</div>`).join('')}
    </div>`;
  }

  html += `<div class="search-wrap" style="margin-bottom:12px">
    <span class="search-icon">🔍</span>
    <input type="text" id="personal-search-inp" placeholder="搜尋花費項目..." value="${state.personalSearchTerm}" oninput="handlePersonalSearch(this.value)">
    <button class="search-clear" id="personal-search-clear" style="display:${state.personalSearchTerm?'flex':'none'}" onclick="handlePersonalSearch(''); document.getElementById('personal-search-inp').value='';">✕</button>
  </div>`;

  if (state.personalForm) html += renderPersonalForm();

  html += `<div id="personal-expense-list-container">${renderPersonalListHTML()}</div>`;
  return html;
}

function renderPersonalItem(e) {
  const lc = localCur();
  const sid = 'sw-pe-' + e.id;
  return `<div class="swipe-wrap" id="${sid}"
    data-delete="delPersonalExpense('${e.id}')"
    data-tap="openPersonalDetail('${e.id}')">
    <div class="swipe-bg">🗑️</div>
    <div class="swipe-content" style="background:var(--white);padding:14px 15px;border-radius:var(--radius);border:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center">
      <div style="display:flex;flex-direction:column;gap:4px;flex:1">
        <div style="font-size:15px;font-weight:700;color:var(--text)">${e.item||'(未命名)'}</div>
        <div style="display:flex;gap:8px;align-items:center">
          <span style="background:${getPersonalCatColor(e.category)};color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px">${e.category}</span>
          <span style="font-size:12px;color:var(--text-sub)">${e.date}</span>
          <span style="font-size:11px;color:var(--text-sub)">${e.paymentMethod}</span>
        </div>
        ${e.notes ? `<div style="font-size:11px;color:#aaa;margin-top:1px">📝 ${e.notes}</div>` : ''}
      </div>
      <div style="text-align:right;min-width:80px">
        <div style="font-size:16px;font-weight:700;color:var(--red)">
          <span style="font-size:11px;margin-right:2px">${e.currency||lc}</span>${fmt(e.amount)}
        </div>
        <div style="font-size:11px;color:var(--text-sub);margin-top:2px">${e.paymentMethod==='信用卡'?'💳':'💵'}</div>
      </div>
    </div>
  </div>`;
}

function renderPersonalForm() {
  const e = state.personalForm;
  const lc = localCur();
  const opts = curOptions();
  const isEdit = !!state.personalEditId;
  return `<div class="form-card" style="margin-bottom:16px">
    <div class="flex-sb" style="margin-bottom:16px">
      <h3 style="color:#333;font-size:16px">${isEdit?'編輯個人花費':'新增個人花費'}</h3>
      <div class="top-btn-row">
        <button class="btn-cancel" onclick="cancelPersonalForm()">✕ 取消</button>
        <button class="btn-save" onclick="savePersonalExpense()">💾 儲存</button>
      </div>
    </div>
    <div class="input-group">
      <label class="lbl">日期</label>
      <div class="date-row">
        <button class="adj-btn" onclick="adjPersonalDate(-1)">&#8249;</button>
        <input type="date" id="pf-date" value="${e.date}" onchange="state.personalForm.date=this.value">
        <button class="adj-btn" onclick="adjPersonalDate(1)">&#8250;</button>
      </div>
    </div>
    <div class="input-group">
      <label class="lbl">花費項目</label>
      <input type="text" id="pf-item" placeholder="例如：拉麵、伴手禮" value="${e.item||''}" onchange="state.personalForm.item=this.value">
    </div>
    <div class="input-group">
      <label class="lbl">類別</label>
      <div class="select-wrap"><select onchange="state.personalForm.category=this.value">
        ${PERSONAL_CATS.map(c=>`<option value="${c}" ${e.category===c?'selected':''}>${c}</option>`).join('')}
      </select></div>
    </div>
    <div class="input-group">
      <label class="lbl">金額</label>
      <div class="flex-row" style="gap:8px">
        <input type="number" id="pf-amount" style="flex:2" placeholder="0" value="${e.amount||''}" onchange="state.personalForm.amount=this.value">
        <div class="select-wrap" style="flex:1"><select onchange="state.personalForm.currency=this.value">
          ${opts.map(c=>`<option value="${c}" ${(e.currency||lc)===c?'selected':''}>${c}</option>`).join('')}
        </select></div>
      </div>
    </div>
    <div class="input-group">
      <label class="lbl">付款方式</label>
      <div class="select-wrap"><select onchange="state.personalForm.paymentMethod=this.value">
        ${PERSONAL_PAYMENT.map(p=>`<option value="${p}" ${e.paymentMethod===p?'selected':''}>${p}</option>`).join('')}
      </select></div>
    </div>
    <div class="input-group">
      <label class="lbl">備註 (選填)</label>
      <textarea placeholder="輸入備註" onchange="state.personalForm.notes=this.value">${e.notes||''}</textarea>
    </div>
    <div class="flex-row" style="margin-top:16px">
      <button class="btn btn-secondary" style="flex:1" onclick="cancelPersonalForm()">取消</button>
      <button class="btn btn-purple" onclick="savePersonalExpense()">${isEdit?'更新':'儲存'}</button>
    </div>
  </div>`;
}

function openPersonalForm() {
  state.personalForm = defaultPersonalForm();
  state.personalEditId = null;
  renderTab();
  setTimeout(() => {
    const form = document.querySelector('#detail-content .form-card');
    if (form) form.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}
function cancelPersonalForm() { state.personalForm = null; state.personalEditId = null; renderTab(); }
function adjPersonalDate(d) {
  const dt = new Date(state.personalForm.date);
  dt.setDate(dt.getDate() + d);
  state.personalForm.date = dt.toISOString().split('T')[0];
  renderTab();
}
function savePersonalExpense() {
  const dateEl = document.getElementById('pf-date');
  const itemEl = document.getElementById('pf-item');
  const amtEl  = document.getElementById('pf-amount');
  if (dateEl) state.personalForm.date = dateEl.value;
  if (itemEl) state.personalForm.item = itemEl.value;
  if (amtEl)  state.personalForm.amount = amtEl.value;
  const e = state.personalForm;
  if (!e.item?.trim()) return alert('請輸入花費項目名稱');
  if (!parseFloat(e.amount)) return alert('請輸入金額');
  if (state.personalEditId) {
    state.personalExpenses = state.personalExpenses.map(x => x.id === state.personalEditId ? { ...e, id: state.personalEditId, tripId: state.currentTrip.id } : x);
  } else {
    state.personalExpenses.unshift({ ...e, id: 'pe-' + Date.now() + '-' + Math.random().toString(36).slice(2), tripId: state.currentTrip.id });
  }
  state.personalForm = null;
  state.personalEditId = null;
  saveToStorage();
  renderTab();
}
function delPersonalExpense(id) {
  if (!confirm('確定要刪除這筆花費嗎？')) return;
  state.personalExpenses = state.personalExpenses.filter(e => e.id !== id);
  saveToStorage();
  renderTab();
}
function openPersonalDetail(id) {
  const e = state.personalExpenses.find(x => x.id === id);
  if (!e) return;
  const lc = localCur();
  const html = `
    <div class="modal-header">
      <span class="modal-title">個人花費詳情</span>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <span style="display:inline-block;background:${getPersonalCatColor(e.category)};color:#fff;font-size:13px;font-weight:700;padding:4px 12px;border-radius:15px;margin-bottom:16px">${e.category}</span>
    <div class="detail-label">項目名稱</div>
    <div class="detail-value" style="font-size:22px;font-weight:700">${e.item}</div>
    <div style="display:flex;gap:20px">
      <div style="flex:1"><div class="detail-label">日期</div><div class="detail-value">${e.date}</div></div>
      <div style="flex:1"><div class="detail-label">付款方式</div><div class="detail-value">${e.paymentMethod}</div></div>
    </div>
    <div class="detail-label">金額</div>
    <div class="detail-value" style="font-size:22px;font-weight:700;color:var(--red)">${e.currency||lc} ${fmt(e.amount)}</div>
    <div class="detail-label">備註</div>
    <div style="background:#f9fafb;padding:12px;border-radius:8px;font-size:14px;color:var(--text);margin-bottom:20px">${e.notes||'無'}</div>
    <div class="flex-row">
      <button class="btn btn-secondary" style="flex:1" onclick="closeModal()">關閉</button>
      <button class="btn btn-outline" style="flex:1" onclick="editPersonalExpense('${e.id}')">✏️ 修改</button>
      <button class="btn" style="flex:1;background:var(--red-light);color:var(--red);border:none" onclick="delPersonalExpense('${e.id}');closeModal()">🗑️ 刪除</button>
    </div>`;
  showModal(html);
}
function editPersonalExpense(id) {
  const e = state.personalExpenses.find(x => x.id === id);
  if (!e) return;
  state.personalForm = { ...e };
  state.personalEditId = id;
  closeModal();
  renderTab();
  setTimeout(() => {
    const form = document.querySelector('#detail-content .form-card');
    if (form) form.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}
function setPersonalFilter(type, val) {
  if (type === 'cat')    state.personalFilterCat  = val;
  if (type === 'date')   state.personalFilterDate = val;
  if (type === 'search') state.personalSearchTerm = val;
  if (type === 'cat' || type === 'date') renderTab();
}

// ===== FIREBASE =====
const FIREBASE_URL = 'https://travel-198a3-default-rtdb.firebaseio.com/travelapp';

async function saveToStorage() {
  try {
    const data = { trips: state.trips, expenses: state.expenses, personalExpenses: state.personalExpenses, schedule: state.schedule };
    await fetch(`${FIREBASE_URL}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  } catch(e) { console.warn('Firebase 儲存失敗', e); }
}

async function loadFromStorage() {
  showLoadingScreen(true);
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 8000);
    const res = await fetch(`${FIREBASE_URL}.json`, { signal: controller.signal });
    clearTimeout(timeoutId);
    const data = await res.json();
    if (data && typeof data === 'object') {
      if (Array.isArray(data.trips))            state.trips            = data.trips;
      if (Array.isArray(data.expenses))         state.expenses         = data.expenses;
      if (Array.isArray(data.personalExpenses)) state.personalExpenses = data.personalExpenses;
      if (data.schedule && typeof data.schedule === 'object') state.schedule = data.schedule;
    }
  } catch(e) { console.warn('Firebase 讀取失敗或逾時', e.name, e.message); }
  showLoadingScreen(false);
  renderMemberInputs();
  renderTrips();
}

function showLoadingScreen(show) {
  document.getElementById('loading-screen').style.display = show ? 'flex' : 'none';
  document.getElementById('app').style.display = show ? 'none' : 'block';
}

loadFromStorage();
</script>
