          ${f>0?`<div class="billed-text">(${currCode(hc)} ${fmt(r.amount||0)}+${fmt(f)}=${fmt(parseFloat(r.amount||0)+f)})</div>`:''}
          </div></div>`;
      });
    } else html += `<div style="text-align:center;color:#999;padding:10px 0">無國內刷卡紀錄</div>`;

    // P-5：底部各幣別消費→請款統計（含手續費拆解）
    const cardByCurStat = {};
    filtCard2.forEach(e=>{
      const cCode=currCode(e.currency||lc);
      if(!cardByCurStat[cCode]) cardByCurStat[cCode]={total:0,twdBase:0,twdFee:0,twdBilled:0,origBase:0,origFee:0,origBilled:0,domBase:0,domFee:0,domBilled:0,pend:0};
      const amt=parseFloat(e.amount||0);
      cardByCurStat[cCode].total+=amt;
      const bt=e.billingType||(cCode===currCode(hc)?'domestic':'twd');
      const b=parseFloat(e.billingAmount||0);
      const fRate=parseFloat(e.feeRate||0);
      if(bt==='domestic'){const f=Math.round(amt*fRate/100);cardByCurStat[cCode].domBase+=amt;cardByCurStat[cCode].domFee+=f;cardByCurStat[cCode].domBilled+=amt+f;}
      else if(bt==='twd'){if(b>0){const f=Math.round(b*fRate/100);cardByCurStat[cCode].twdBase+=b;cardByCurStat[cCode].twdFee+=f;cardByCurStat[cCode].twdBilled+=b+f;}else cardByCurStat[cCode].pend++;}
      else if(bt==='original'){const f=Math.round(amt*fRate/100);cardByCurStat[cCode].origBase+=amt;cardByCurStat[cCode].origFee+=f;cardByCurStat[cCode].origBilled+=amt+f;}
    });
    let cardStatHtml='';
    Object.entries(cardByCurStat).forEach(([cCode,s])=>{
      if(s.total===0) return;
      cardStatHtml+='<div style="margin-bottom:8px;padding:8px 10px;background:#f8faff;border-radius:8px;border-left:3px solid var(--blue)">'
        +'<div style="font-size:12px;font-weight:700;color:#0369a1;margin-bottom:4px">'+cCode+' 刷卡消費</div>'
        +'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span style="color:#666">原始刷卡總額</span><span style="font-weight:600">'+cCode+' '+fmt(s.total)+'</span></div>'
        +(s.twdBilled>0?'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span style="color:#0369a1">→ 換算 '+currCode(hc)+' 請款 '+(s.twdFee>0?'('+fmt(s.twdBase)+'+'+fmt(s.twdFee)+')':'')+'</span><span style="font-weight:600;color:#0369a1">'+currCode(hc)+' '+fmt(s.twdBilled)+'</span></div>':'')
        +(s.domBilled>0?'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span style="color:#059669">→ 國內 '+currCode(hc)+' 請款 '+(s.domFee>0?'('+fmt(s.domBase)+'+'+fmt(s.domFee)+')':'')+'</span><span style="font-weight:600;color:#059669">'+currCode(hc)+' '+fmt(s.domBilled)+'</span></div>':'')
        +(s.origBilled>0?'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span style="color:#6366f1">→ 原幣請款 '+(s.origFee>0?'('+fmt(s.origBase)+'+'+fmt(s.origFee)+')':'')+'</span><span style="font-weight:600;color:#6366f1">'+cCode+' '+fmt(s.origBilled)+'</span></div>':'')
        +(s.pend>0?'<div style="font-size:11px;color:#f97316;font-weight:600;margin-top:2px">⚠️ 待請款 '+s.pend+' 筆</div>':'')
        +'</div>';
    });
    const totTWD=(Object.values(cardByCurStat).reduce((s,v)=>s+v.twdBilled+v.domBilled,0));
    html += `<div class="summary-footer">
      <div style="font-size:13px;font-weight:700;color:#333;margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:4px">各幣別消費統計</div>
      ${cardStatHtml}
      <div class="summary-total-row"><span>銀行請款總額 (${currCode(hc)}):</span><span>${currCode(hc)} ${fmt(totTWD)}</span></div>
    </div>`;
  }

  if (tab==='lending') {
    // P-4 篩選狀態
    if (!state.expLendCurFilter) state.expLendCurFilter = 'all';
    if (!state.expLendDateFilter) state.expLendDateFilter = 'all';
    const lendAllCurCodes = [...new Set(expLendRecs.map(e=>currCode(e.currency||lc)))];
    const lendAllDates    = [...new Set(expLendRecs.map(e=>e.date))].sort();
    const filtLend = expLendRecs
      .filter(e=>state.expLendCurFilter==='all'||currCode(e.currency||lc)===state.expLendCurFilter)
      .filter(e=>state.expLendDateFilter==='all'||e.date===state.expLendDateFilter)
      .sort((a,b)=>a.date.localeCompare(b.date));

    const lendCurChips = `<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
      <span style="font-size:12px;color:#999;align-self:center">幣別:</span>
      <button class="chip ${state.expLendCurFilter==='all'?'active-purple':''}" onclick="state.expLendCurFilter='all';renderExpenseModal()">全部</button>
      ${lendAllCurCodes.map(c=>`<button class="chip ${state.expLendCurFilter===c?'active-purple':''}" onclick="state.expLendCurFilter='${c}';renderExpenseModal()">${c}</button>`).join('')}
    </div>
    <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:10px">
      <span style="font-size:12px;color:#999;align-self:center">日期:</span>
      <button class="chip ${state.expLendDateFilter==='all'?'active-purple':''}" onclick="state.expLendDateFilter='all';renderExpenseModal()">全部</button>
      ${lendAllDates.map(d=>`<button class="chip ${state.expLendDateFilter===d?'active-purple':''}" onclick="state.expLendDateFilter='${d}';renderExpenseModal()">${formatDateSimple(d)}</button>`).join('')}
    </div>`;
    html += lendCurChips;
    html += `<div class="section-hdr">公費借出明細</div>`;
    if (filtLend.length) {
      filtLend.forEach(r=>{
        html += `<div class="income-item" onclick="openExpenseDetail(${r.id},()=>{state.expenseModalTab='lending';renderExpenseModal()})">
          <div class="income-item-left"><span class="income-title">${r.date}</span><span class="income-sub">借款人: ${r.borrower||'未知'}</span></div>
          <div style="font-size:14px;font-weight:700;color:#b45309">${currCode(r.currency||lc)} ${fmt(r.amount)}</div>
        </div>`;
      });
    } else html += `<div style="text-align:center;color:#999;padding:10px 0">無借出紀錄</div>`;
    const lendByCur={};
    filtLend.forEach(e=>{const cCode=currCode(e.currency||lc);lendByCur[cCode]=(lendByCur[cCode]||0)+(parseFloat(e.amount)||0);});
    html += `<div class="summary-footer">`;
    Object.entries(lendByCur).forEach(([cCode,v])=>{html+=`<div class="summary-row-item"><span>借出小計 (${cCode}):</span><span style="font-weight:700">${cCode} ${fmt(v)}</span></div>`;});
    html += `</div>`;
  }

  html += `<button class="btn btn-secondary" style="margin-top:16px;width:100%" onclick="closeModal()">關閉</button>`;
  showModal(html);
}
function setExpenseTab(tab, filterType, filterVal) {
  state.expenseModalTab = tab;
  if (filterType==='date') toggleFilter('date', filterVal);
  else if (filterType==='pm') toggleFilter('pm', filterVal);
  else if (filterType==='cur') toggleFilter('cur', filterVal);
  else renderExpenseModal();
}
function toggleFilter(type, val) {
  if (type==='date') {
    if (state.filterDates.includes(val)) state.filterDates = state.filterDates.filter(x=>x!==val);
    else state.filterDates.push(val);
  } else if (type==='pm') {
    if (state.filterPaymentMethods.includes(val)) state.filterPaymentMethods = state.filterPaymentMethods.filter(x=>x!==val);
    else state.filterPaymentMethods.push(val);
  } else if (type==='cur') {
    if (state.filterCurrencies.includes(val)) state.filterCurrencies = state.filterCurrencies.filter(x=>x!==val);
    else state.filterCurrencies.push(val);
  }
  const overlay = document.getElementById('modal-overlay');
  if (!overlay.classList.contains('hidden')) {
    if (state.incomeModalTab!==undefined && document.querySelector('[onclick*="setIncomeTab"]')) renderIncomeModal();
    else renderExpenseModal();
  } else renderTab();
}

function openMemberModal() { renderMemberModal(); }
function renderMemberModal() {
  const t = state.currentTrip;
  let html = `<div class="modal-header"><span class="modal-title">成員管理</span><button class="close-btn" onclick="closeModal()">✕</button></div>
    <div style="display:flex;gap:10px;margin-bottom:16px">
      <input type="text" id="new-member-inp" placeholder="輸入新成員名字" style="flex:1">
      <button class="btn btn-primary" style="width:auto;padding:12px 16px" onclick="addMember()">新增</button>
    </div>`;
  t.members.forEach((m,i)=>{
    html += `<div class="member-row">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="member-avatar">${m.charAt(0)}</div>
        <span style="font-size:16px">${m}</span>
      </div>
      <div style="display:flex; gap:4px;">
        <button class="btn-icon" style="color:var(--blue)" onclick="editMember(${i})">✏️</button>
        <button class="btn-icon" style="color:var(--red)" onclick="removeMember(${i})">🗑️</button>
      </div>
    </div>`;
  });
  html += `<button class="btn btn-secondary" style="margin-top:16px;width:100%" onclick="closeModal()">關閉</button>`;
  showModal(html);
}
function addMember() {
  const v = document.getElementById('new-member-inp').value.trim();
  if (!v) return;
  if (state.currentTrip.members.includes(v)) return alert('此成員名稱已存在！');
  state.currentTrip.members.push(v);
  syncTripInList();
  renderMemberModal();
}
function editMember(idx) {
  const oldName = state.currentTrip.members[idx];
  const inputName = prompt('請輸入新的成員名字：', oldName);
  if (!inputName || inputName.trim() === '') return;
  const newName = inputName.trim();
  if (newName === oldName) return;
  if (state.currentTrip.members.includes(newName)) return alert('此成員名稱已存在，請使用其他名稱！');
  state.currentTrip.members[idx] = newName;
  state.expenses.forEach(e => {
    if (e.tripId !== state.currentTrip.id) return;
    if (e.splitMembers && e.splitMembers.includes(oldName)) { e.splitMembers = e.splitMembers.map(m => m === oldName ? newName : m); }
    if (e.subsidies) { e.subsidies.forEach(s => { if (s.member === oldName) s.member = newName; }); }
    if (e.cardPayer === oldName) e.cardPayer = newName;
    if (e.borrower === oldName) e.borrower = newName;
    if (e.payer === oldName) e.payer = newName;
  });
  syncTripInList();
  renderMemberModal();
}
function removeMember(idx) {
  if (!confirm(`確定要刪除成員 ${state.currentTrip.members[idx]} 嗎？`)) return;
  state.currentTrip.members.splice(idx,1);
  syncTripInList();
  renderMemberModal();
}
function syncTripInList() {
  state.trips = state.trips.map(t=>t.id===state.currentTrip.id?state.currentTrip:t);
  document.getElementById('detail-members').textContent = '成員：'+state.currentTrip.members.join(', ');
  saveToStorage();
}

function openCheckoutModal() { state.activeCheckoutTab='overview'; state.checkoutMemberFilter=''; renderCheckoutModal(); }
function renderCheckoutModal() {
  const lc = localCur(), hc = habitCur();

        ${members.map(m=>`<option value="${m}" ${mf===m?'selected':''}>${m}</option>`).join('')}
      </select></div>
    </div>`;

  if (tab==='overview') {
    const personalNet = isMember&&memberBreakdown[mf] ? memberBreakdown[mf].initialFee-memberBreakdown[mf].expenseShare+memberBreakdown[mf].memberSubsidy-memberBreakdown[mf].netLoan : 0;
    html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;">
      <h4 style="font-size:18px;font-weight:700;margin:0;line-height:1.2;">${isMember?mf+' 的最終結算':'所有成員淨結算'}</h4>
      <button style="background:#f3e8ff;color:var(--purple);border:1px solid #a855f7;font-size:12px;padding:6px 12px;border-radius:20px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;" onclick="exportCheckoutPDF('${mf||''}')">📄 匯出 PDF</button>

    if (isMember) {
      html += `<div class="summary-total-row"><span>${mf} 現金淨結算:</span>
        <span style="color:${personalNet>0?'var(--green)':personalNet<0?'var(--red)':'#666'}">${currCode(lc)} ${fmt(Math.abs(personalNet))} (${personalNet>0?'應退':personalNet<0?'應補':'結清'})</span>
      </div>`;
    } else {
      html += `<div class="summary-row-item"><span>總應補進公費:</span><span style="color:var(--red);font-weight:700">${currCode(lc)} ${fmt(totalCollect)}</span></div>
        <div class="summary-row-item"><span>總應退回成員:</span><span style="color:var(--green);font-weight:700">${currCode(lc)} ${fmt(totalRefund)}</span></div>
        <div class="summary-total-row"><span>剩餘公費現金:</span><span style="color:${publicFundRemainder>0?'var(--blue)':'#666'}">${currCode(lc)} ${fmt(publicFundRemainder)}${publicFundRemainder>0&&members.length?` (每人約 ${fmt(publicFundRemainder/members.length)})`:''}</span></div>
        ${calc.splitRoundingError && Math.abs(calc.splitRoundingError) > 0 ? `<div class="summary-row-item" style="color:#9ca3af;font-size:12px"><span>🔢 分攤捨入差額:</span><span>${fmt(calc.splitRoundingError)} ${currCode(lc)}</span></div>` : ''}`;
    }
    html += `</div>`;

    // 多幣別現金結算：每種幣別各自一段
    const cursToShow = localCurs.length > 0 ? localCurs : [lc];
    cursToShow.forEach(c=>{
      const cCode = currCode(c);
      const cSettle = (cashSettlementByCur[c]||[]).filter(s=>!mf||s.member===mf);
      html += `<div style="font-size:14px;font-weight:700;color:#666;margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:6px">${cCode} 現金淨結算</div>`;
      if (cSettle.length) {
        cSettle.forEach(s=>{
          const cls = s.amount>0?'checkout-pos':s.amount<0?'checkout-neg':'checkout-neu';
          html += `<div class="checkout-item ${cls}">
            <div><div class="checkout-name" style="color:${s.amount>0?'var(--green)':s.amount<0?'var(--red)':'var(--blue)'}">${s.member}</div><div class="checkout-sub">${s.type}</div></div>
            <div class="${s.amount>0?'checkout-amt-pos':s.amount<0?'checkout-amt-neg':''}">${cCode} ${fmt(Math.abs(s.amount))}</div>
            <button class="checkout-settle-btn" style="background:${s.amount===0?'#ddd':'var(--green)'};color:#fff" onclick="alert('已標記 ${s.member} ${cCode} 結清')">✓ ${s.amount===0?'已結清':'結清'}</button>
          </div>`;
        });
      } else {
        html += `<div style="text-align:center;color:#666;padding:10px;background:#f9fafb;border-radius:8px;margin-bottom:8px">${cCode} 已全數結清</div>`;

    if (!window._cardOverviewIdx) window._cardOverviewIdx = 0;

    function renderCardGroupOverview(groupLabel, groupExps, bgHeader, titleColor) {
      if (!groupExps.length) return `<div style="text-align:center;color:#999;padding:10px">無${groupLabel}紀錄</div>`;
      let s = `<div style="background:${bgHeader};border-radius:7px;padding:8px 10px;margin-bottom:8px">`;
      s += `<div style="font-size:12px;font-weight:700;color:${titleColor};margin-bottom:8px">${groupLabel}</div>`;
      let hasAny = false, subTotal = 0;
      
      const membersToRender = isMember ? [mf] : members;
      
      membersToRender.forEach(m => {
        const sm_paid = groupExps.filter(e => getCardPayer(e, members) === m);
        const sm_owed = groupExps.filter(e => {
          const sm = (e.splitMembers||[]).filter(x => members.includes(x));
          return (sm.length ? sm : members).includes(m);
        });
        const totalPaid = sm_paid.reduce((a, e) => a + getCardTotal(e), 0);
        const totalOwed = sm_owed.reduce((a, e) => {
          const sc = (e.splitMembers||[]).filter(x => members.includes(x)).length || members.length;
          return a + getCardCost(e, sc);
        }, 0);
        
        if (totalPaid === 0 && totalOwed === 0) return;
        hasAny = true;
        const gNet = totalPaid - totalOwed;
        const isCreditor = gNet > 0.01, isDebtor = gNet < -0.01;
        const cardBg     = isCreditor ? '#f0fdf4' : isDebtor ? 'var(--red-light)' : '#f9fafb';
        const cardBorder = isCreditor ? 'var(--green)' : isDebtor ? 'var(--red)' : '#ddd';
        const netCol     = isCreditor ? 'var(--green)' : isDebtor ? 'var(--red)' : '#666';
        const netLabel   = isCreditor ? '收回' : isDebtor ? '應付' : '結清';
        if (isCreditor) subTotal += gNet;
        const uid = 'cov' + (window._cardOverviewIdx++);

        s += `<div class="checkout-item" style="flex-direction:column;align-items:flex-start;background:${cardBg};border-left-color:${cardBorder};margin-bottom:6px;cursor:pointer" onclick="toggleCardDetail('${uid}')">`;

            <span id="${uid}-arrow" style="font-size:11px;color:${netCol};transition:transform 0.2s">▾</span>
          </div>
        </div>`;

        const pairs = calcPairNet(m, groupExps, members);
        s += `<div id="${uid}" class="hidden" style="width:100%;margin-top:6px;padding-top:6px;border-top:1px solid #e5e7eb">`;
        if (pairs.length) {
          pairs.forEach(p => {
            const isRec = p.net > 0;
            const col   = isRec ? '#059669' : '#dc2626';
            const arrow = isRec ? '←' : '→';
            const verb  = isRec ? '應收' : '應付';
            s += `<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 2px;border-bottom:1px dotted #e5e7eb">

        }
        s += '</div></div>'; 
      });
      if (!hasAny) s += `<div style="font-size:12px;color:#999;padding:4px 0">無${groupLabel}刷卡記錄</div>`;
      if (subTotal > 0 && !isMember) s += `<div style="text-align:right;font-size:12px;font-weight:700;color:${titleColor};margin-top:4px;border-top:1px solid ${titleColor}33;padding-top:3px">小計：${hc} ${fmt(subTotal)}</div>`;
      s += '</div>';
      return s;
    }
    
    html += renderCardGroupOverview('💳 TWD 刷卡', calc.twdCardExps, '#e0f2fe', '#0369a1');
    html += renderCardGroupOverview('🌏 當地幣別刷卡', calc.foreignCardExps, '#f3e8ff', '#7c3aed');
    
    if(filtCard.length && isMember){
      const twdNet = calc.twdGroup.paid[mf]-calc.twdGroup.owed[mf];
      const forNet = calc.foreignGroup.paid[mf]-calc.foreignGroup.owed[mf];

    } else if(filtCard.length && !isMember) {
      html+=`<div style="background:#f0fdf4;border-radius:7px;padding:8px 10px;border:1px solid #86efac">`;
      html+=`<div style="font-size:12px;font-weight:700;color:#059669;margin-bottom:6px">✅ 合計後實際應付（折抵後）</div>`;
      filtCard.forEach(s=>{

  if (tab==='cash') {

  }

  if (tab==='card') {
    html += `<h4 style="font-size:16px;font-weight:700;margin-bottom:12px">刷卡/代墊結算</h4>`;

    function renderCardGroupDetail(groupLabel, groupExps, bgHeader, titleColor) {
      if (!groupExps.length) return '';
      
      const membersToRender = isMember ? [mf] : members;

      let groupSubTotal = 0;

      membersToRender.forEach(m => {

          const sm = (e.splitMembers||[]).filter(x => members.includes(x));

        const totalOwed = sm_owed.reduce((a, e) => {
          const sc = (e.splitMembers||[]).filter(x => members.includes(x)).length || members.length;

        if (totalPaid === 0 && totalOwed === 0) return;
        hasAny = true;
        
        const gNet = totalPaid - totalOwed;
        const isCreditor = gNet > 0.01;
        const isDebtor   = gNet < -0.01;
        const cardBg     = isCreditor ? '#f0fdf4' : isDebtor ? 'var(--red-light)' : '#f9fafb';
        const cardBorder = isCreditor ? 'var(--green)' : isDebtor ? 'var(--red)' : '#ddd';

        memberHtml += `<div class="checkout-item" style="flex-direction:column;align-items:flex-start;background:${cardBg};border-left-color:${cardBorder};margin-bottom:6px">`;

          memberHtml += `<div style="font-size:10px;color:#059669;font-weight:700;margin-bottom:3px">📤 代墊明細</div>`;

                <span>${e.date} | ${e.item}</span>

              <div style="font-size:10px;color:#6b7280;margin-top:1px">

        memberHtml += `<div style="display:flex;justify-content:space-between;width:100%;margin-top:6px;padding-top:4px;border-top:1px solid #e5e7eb">

        html += `<div style="text-align:right;font-size:13px;font-weight:700;color:#059669;margin-top:6px;padding-top:4px;border-top:1px solid #86efac">合計：${hc} ${fmt(grand)}</div>`;

  }
  if (tab==='personal') {
    if (!isMember) {
      html += `<div style="text-align:center;padding:20px;color:#999">請先選擇一位成員來查看個人財務明細。</div>`;
    } else {
      const bd = memberBreakdown[mf]||{};
      const personalNet = (bd.initialFee||0)-(bd.expenseShare||0)+(bd.memberSubsidy||0)-(bd.netLoan||0);
      const persExps = state.expenses.filter(e=>e.tripId===state.currentTrip.id&&e.accountType==='支出'&&e.category!=='公費借出').map(e=>{
        const sm=(e.splitMembers||[]).filter(m=>members.includes(m)); const sc=sm.length||members.length;
        const cost=(parseFloat(e.amount)||0)/sc;
        const b=parseFloat(e.billingAmount)||0,f=Math.round(b*(parseFloat(e.feeRate)||0)/100),tot=b+f;
        const twdCost=e.paymentMethod==='信用卡'&&b?parseFloat(fmtCeil(tot/sc)):0;
        const mSub=(e.subsidies||[]).filter(s=>s.member===mf).reduce((s,x)=>s+(parseFloat(x.amount)||0),0);
        return {...e,costPerPersonLocal:cost,costPerPersonTWD:twdCost,isParticipant:(sm.length?sm:members).includes(mf),memberSubsidy:mSub};
      }).filter(e=>e.isParticipant||e.memberSubsidy>0).sort((a,b)=>new Date(b.date)-new Date(a.date));

      const cashTotalByCur={}, cardTotalByCur={};
      persExps.forEach(e=>{
        const cCode=currCode(e.currency||lc);
        if(e.paymentMethod==='現金'&&e.isParticipant){cashTotalByCur[cCode]=(cashTotalByCur[cCode]||0)+e.costPerPersonLocal;}
        if(e.paymentMethod==='信用卡'&&e.isParticipant){cardTotalByCur[currCode(hc)]=(cardTotalByCur[currCode(hc)]||0)+e.costPerPersonTWD;}
      });
      const subTotal = persExps.reduce((s,e)=>s+e.memberSubsidy,0);

      const myDebts = cardSettlement.filter(s => s.member === mf);

      let cardSettleHtml = `<div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)">
        <div style="font-size:12px;font-weight:700;color:#555;margin-bottom:6px">刷卡/代墊結算 (${hc}):</div>`;
      if (myDebts.length === 0 && myCredits.length === 0) {

          </div>`;

      }
      cardSettleHtml += `</div>`;

      html += `<div style="background:var(--white);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px">
        <div class="summary-block-title">${mf} 的總負擔</div>
        ${Object.entries(cashTotalByCur).filter(([,v])=>v>0).map(([cCode,v])=>`<div class="summary-row-item"><span>現金分攤（${cCode}）:</span><span style="font-weight:700;color:var(--red)">${cCode} ${fmt(v)}</span></div>`).join('')}
        ${Object.entries(cardTotalByCur).filter(([,v])=>v>0).map(([cCode,v])=>`<div class="summary-row-item"><span>刷卡分攤（${cCode}）:</span><span style="font-weight:700;color:var(--blue)">${cCode} ${fmt(v)}</span></div>`).join('')}
        <div class="summary-row-item" style="border-top:1px solid var(--border);padding-top:8px;margin-top:8px"><span style="color:var(--green);font-weight:700">+ 小額支援總額:</span><span style="font-weight:700;color:var(--green)">${currCode(lc)} ${fmt(subTotal)}</span></div>
        ${cardSettleHtml}
      </div>`;

      html += `<div style="font-size:14px;font-weight:700;color:#666;margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:6px">${mf} 的參與與支援明細</div>`;
      
      persExps.forEach(e=>{
        const payer = getCardPayer(e, members);
        const payerBadge = e.paymentMethod === '信用卡' 
          ? `<div style="flex-shrink:0; max-width:85px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:#e0f2fe; color:#0369a1; padding:2px 5px; border-radius:4px; font-size:10px; font-weight:700;">💳 ${payer} 代墊</div>` 
          : '';
          
        html += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dotted var(--border);font-size:13px">
          <div style="flex:2; min-width:0; padding-right:6px;">
            <div style="display:flex; align-items:center; gap:6px; margin-bottom:3px;">
              <div style="font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${e.item || '(未命名)'}</div>
              ${payerBadge}
            </div>
            <div style="font-size:11px;color:#999">${e.date} | ${e.paymentMethod}${e.memberSubsidy>0?'<span style="color:var(--green);margin-left:4px">[支援]</span>':''}</div>
          </div>
          <div style="flex:1.5;text-align:right;font-size:11px;color:#666">${e.currency||lc} ${fmt(e.amount)}</div>
          <div style="flex:1.5;text-align:right">
            ${e.isParticipant?`<div style="font-size:12px;font-weight:700;color:${e.paymentMethod==='現金'?'var(--red)':'var(--blue)'}">${e.paymentMethod==='現金'?currCode(e.currency||lc):currCode(hc)} ${fmt(e.paymentMethod==='現金'?e.costPerPersonLocal:e.costPerPersonTWD)}</div><div style="font-size:10px;color:#999">(${(e.splitMembers||members).length}人分攤)</div>`:''}

      if (!persExps.length) html += `<div style="text-align:center;color:#999;padding:10px">${mf} 無公費支出紀錄</div>`;

      // UI修正：按鈕修改為不換行的獨立樣式
      html += `<div style="margin-top:16px; text-align:right;">
        <button style="background:var(--blue-light);color:var(--blue);border:1px solid var(--blue);font-size:13px;padding:8px 16px;border-radius:20px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px;" onclick="if('${mf}'){exportCheckoutPDF('${mf}');}else{alert('請先從上方「篩選成員」選擇一位成員後再匯出 PDF')}">📄 匯出 PDF 報告</button>

    }
  }

  html += `<button class="btn btn-secondary" style="margin-top:16px;width:100%" onclick="closeModal()">關閉結算</button>`;
  showModal(html);
}
function setCheckoutTab(tab) { state.activeCheckoutTab=tab; renderCheckoutModal(); }
function setCheckoutFilter(val) { state.checkoutMemberFilter=val; renderCheckoutModal(); }
function toggleCardDetail(id) {
  const el = document.getElementById(id) || document.getElementById(`card-detail-${id}`);
  if (!el) return;
  const isHidden = el.classList.toggle('hidden');
  const arrow = document.getElementById(id+'-arrow');
  if (arrow) arrow.style.transform = isHidden ? '' : 'rotate(180deg)';
}

function showModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
  if (state.activeTab==='pool') renderTab();
}
function closeModalOnOverlay(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

(function() {
  let active = null;
  function getEls(id) {
    const el = document.getElementById(id);
    if (!el) return null;
    const content = el.querySelector('.swipe-content');
    const bg = el.querySelector('.swipe-bg');
    return { el, content, bg };
  }
  function reset(r) {
    r.content.style.transition = 'transform 0.2s ease-out';
    r.content.style.transform = 'translateX(0)';
    r.bg.style.width = '0px';
    r.bg.classList.remove('full');
    r.bg.innerHTML = '🗑️';
  }
  function confirmDelete(r, onDelete) {
    r.content.style.transition = 'transform 0.22s ease-in';
    r.content.style.transform = 'translateX(-110%)';
    setTimeout(() => {
      r.el.style.transition = 'max-height 0.25s ease, opacity 0.25s ease, margin-bottom 0.25s ease, padding 0.25s ease';
      r.el.style.overflow = 'hidden';
      r.el.style.maxHeight = r.el.offsetHeight + 'px';
      requestAnimationFrame(() => {
        r.el.style.maxHeight = '0';
        r.el.style.opacity = '0';
        r.el.style.marginBottom = '0';
      });
      setTimeout(() => { if (onDelete) onDelete(); }, 280);
    }, 180);
  }
  function updateSwipe(r, dx) {
    const elW = r.el.offsetWidth;
    const offset = Math.max(dx, -elW);
    const absOff = Math.abs(offset);
    r.content.style.transition = 'none';
    r.content.style.transform = `translateX(${offset}px)`;
    r.bg.style.width = absOff + 'px';
    const pct = absOff / elW;
    if (pct > 0.45) {
      r.bg.classList.add('full');
      r.bg.innerHTML = '🗑️ 放開刪除';
      return true;
    } else {
      r.bg.classList.remove('full');
      r.bg.innerHTML = '🗑️';
      return false;
    }
  }

  document.addEventListener('touchstart', function(e) {
    const wrap = e.target.closest('.swipe-wrap');
    if (!wrap) return;
    const r = getEls(wrap.id);
    if (!r) return;
    const t = e.touches[0];
    active = { id: wrap.id, startX: t.clientX, startY: t.clientY,
               curDX: 0, confirmed: false, moved: false,
               onDelete: wrap._onDelete, onTap: wrap._onTap, ...r };
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (!active) return;
    const t = e.touches[0];
    const dx = t.clientX - active.startX;
    const dy = t.clientY - active.startY;
    if (!active.moved && Math.abs(dy) > Math.abs(dx)) {
      active = null; return;
    }
    if (dx >= 0) {
      if (active.moved) { reset(active); active = null; }
      return;
    }
    e.preventDefault();
    active.moved = true;
    active.curDX = dx;
    active.confirmed = updateSwipe(active, dx);
  }, { passive: false });

  document.addEventListener('touchend', function(e) {
    if (!active) return;
    const a = active; active = null;
    if (!a.moved) {
      if (a.onTap) a.onTap();
      return;
    }
    if (a.confirmed) confirmDelete(a, a.onDelete);
    else reset(a);
  }, { passive: true });

  document.addEventListener('mousedown', function(e) {
    const wrap = e.target.closest('.swipe-wrap');
    if (!wrap) return;
    const r = getEls(wrap.id);
    if (!r) return;
    active = { id: wrap.id, startX: e.clientX, startY: e.clientY,
               curDX: 0, confirmed: false, moved: false,
               onDelete: wrap._onDelete, onTap: wrap._onTap, ...r };
  });
  document.addEventListener('mousemove', function(e) {
    if (!active || active.isTouch) return;
    const dx = e.clientX - active.startX;
    if (dx >= 0) {
      if (active.moved) { reset(active); active = null; }
      return;
    }
    active.moved = true;
    active.curDX = dx;
    active.confirmed = updateSwipe(active, dx);
  });
  document.addEventListener('mouseup', function(e) {
    if (!active || active.isTouch) return;
    const a = active; active = null;
    if (!a.moved) {
      if (a.onTap) a.onTap();
      return;
    }
    if (a.confirmed) confirmDelete(a, a.onDelete);
    else reset(a);
  });
})();

function initSwipeItems() {
  document.querySelectorAll('.swipe-wrap[data-delete]').forEach(wrap => {
    const delFn = wrap.getAttribute('data-delete');
    const tapFn = wrap.getAttribute('data-tap');
    wrap._onDelete = delFn ? () => { try { eval(delFn); } catch(e){} } : null;
    wrap._onTap    = tapFn ? () => { try { eval(tapFn); } catch(e){} } : null;
  });
}

      <button class="btn btn-save" style="background:var(--blue-light);color:var(--blue);font-size:12px;padding:6px 12px" onclick="exportPersonalPDF()">📄 PDF</button>

  if (!filtered.length) {

      <div style="font-size:36px;margin-bottom:8px">💳</div>
      <div>${state.personalSearchTerm||state.personalFilterCat||state.personalFilterDate ? '找不到符合的花費' : '還沒有個人花費記錄'}</div>

  return html;
}

function getTripPersonalExpenses() {
  const t = state.currentTrip;
  if (!t) return [];
  return state.personalExpenses.filter(e => e.tripId === t.id);
}
function getFilteredPersonalExpenses() {
  let list = getTripPersonalExpenses();
  // 舊有篩選
  if (state.personalFilterCat)  list = list.filter(e => e.category === state.personalFilterCat);
  if (state.personalFilterDate) list = list.filter(e => e.date === state.personalFilterDate);
  // 新篩選面板
  if (state.pfFilterCats.length) list = list.filter(e => state.pfFilterCats.includes(e.category));
  if (state.pfFilterDateFrom) list = list.filter(e => e.date >= state.pfFilterDateFrom);
  if (state.pfFilterDateTo)   list = list.filter(e => e.date <= state.pfFilterDateTo);
  if (state.personalSearchTerm) {
    const q = state.personalSearchTerm.toLowerCase();
    list = list.filter(e => e.item?.toLowerCase().includes(q) || e.notes?.toLowerCase().includes(q) || e.amount?.toString().includes(q) || e.category?.toLowerCase().includes(q));
  }
  return list.sort((a,b) => b.date.localeCompare(a.date));
}
function pfHasActiveFilter() {
  return state.pfFilterCats.length > 0 || state.pfFilterDateFrom || state.pfFilterDateTo;
}
function pfClearFilter() {

}
function pfToggleFilterCat(c) {

function pfToggleFilterPanel() {

// 花費頁面「全部」分頁：雙欄 2×2 卡片
function buildPfAllCards(currencies, lc, hc, tripId, ccFinalHcTotal, ccLocTotal, ccDomTotal, ccLocCount, ccDomCount, ccPendingCount, allCCE) {
  const nonHc = currencies.filter(c=>c!==hc);
  let cards = [];
  nonHc.forEach(c=>{
    const cCode = currCode(c);
    const cashLedgerC = (state.personalCashLedger||[]).filter(r=>r.tripId===tripId&&currCode(r.currency||lc)===cCode);
    const cashInC     = cashLedgerC.filter(r=>r.type==='入帳').reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
    const allExpsC    = getTripPersonalExpenses().filter(e=>currCode(e.currency||lc)===cCode);
    const cashSpendC  = allExpsC.filter(e=>e.paymentMethod==='現金'&&e.category!=='金流').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    const cashLendC   = getDashLendOut(tripId, c, '現金');
    const cashRecvC   = getAllReturnRecords(tripId, c).filter(r=>r.dest==='現金').reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
    const cashToEpC   = (state.personalEpayLedger||[]).filter(r=>r.tripId===tripId&&currCode(r.currency||lc)===cCode&&r.source==='現金').reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
    const cashBalC    = cashInC - cashSpendC - cashToEpC - cashLendC + cashRecvC;
    const epayLedgerC = (state.personalEpayLedger||[]).filter(r=>r.tripId===tripId&&currCode(r.currency||lc)===cCode);
    const epayInC     = epayLedgerC.filter(r=>r.type==='儲值').reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
    const epaySpendC  = allExpsC.filter(e=>e.paymentMethod==='電子支付'&&e.category!=='金流').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    const epayLendC   = getDashLendOut(tripId, c, '電子支付');
    const epayRecvC   = getAllReturnRecords(tripId, c).filter(r=>r.dest==='電子支付').reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
    const epayBalC    = epayInC - epaySpendC - epayLendC + epayRecvC;

    // F-1：只顯示有資料的幣別（現金或電子支付有任何入帳/花費/借出）
    const hasCashData = cashInC>0 || cashSpendC>0 || cashLendC>0;
    const hasEpayData = epayInC>0 || epaySpendC>0 || epayLendC>0;
    if (hasCashData) {
      cards.push(`<div class="pf-twin-card" style="padding:12px 8px;cursor:pointer" onclick="pfSetDashCurrency('${cCode}');openLedgerTabs('cash')">
        <div class="pf-twin-label" style="font-size:11px;margin-bottom:2px">💵 ${cCode} 現金</div>
        <div style="font-size:11px;color:#aaa;margin-bottom:1px">入帳</div>
        <div style="font-size:15px;font-weight:800;color:var(--text)">${fmt(cashInC)}</div>
        <div style="font-size:11px;color:var(--red)">已花 ${fmt(cashSpendC)}</div>
        <div style="border-top:1px solid #e5e7eb;margin:5px 0 3px"></div>
        <div style="font-size:13px;font-weight:800;color:${cashBalC>=0?'var(--green)':'var(--red)'}">剩 ${fmt(Math.abs(cashBalC))}</div>
        <div style="font-size:10px;color:#aaa">${cCode}</div>
      </div>`);
    }
    if (hasEpayData) {
      cards.push(`<div class="pf-twin-card" style="padding:12px 8px;cursor:pointer" onclick="pfSetDashCurrency('${cCode}');openLedgerTabs('epay')">
        <div class="pf-twin-label" style="font-size:11px;margin-bottom:2px">📱 ${cCode} 電子</div>
        <div style="font-size:11px;color:#aaa;margin-bottom:1px">儲值</div>
        <div style="font-size:15px;font-weight:800;color:var(--text)">${fmt(epayInC)}</div>
        <div style="font-size:11px;color:var(--red)">已花 ${fmt(epaySpendC)}</div>
        <div style="border-top:1px solid #e5e7eb;margin:5px 0 3px"></div>
        <div style="font-size:13px;font-weight:800;color:${epayBalC>=0?'var(--green)':'var(--red)'}">剩 ${fmt(Math.abs(epayBalC))}</div>
        <div style="font-size:10px;color:#aaa">${cCode}</div>
      </div>`);
    }
  });
  // 刷卡欄（全部分頁：跨幣別彙總）
  if (ccFinalHcTotal>0 || ccLocTotal>0 || ccPendingCount>0) {
    // 全部分頁：按幣別各自一行顯示消費
    const ccByCurRows = Object.entries(
      allCCE.reduce((acc,e)=>{
        const cCode=currCode(e.currency||lc);
        acc[cCode]=(acc[cCode]||{total:0,count:0});
        acc[cCode].total+=parseFloat(e.amount||0);
        acc[cCode].count++;
        return acc;
      },{})
    ).map(([cCode,v])=>`<div style="font-size:14px;font-weight:800;color:var(--text)">${cCode} ${fmt(v.total)} (${v.count})</div>`).join('');
    cards.push(`<div class="pf-twin-card" style="padding:12px 8px;cursor:pointer" onclick="openLedgerTabs('cc')">
      <div class="pf-twin-label" style="font-size:11px;margin-bottom:2px">💳 刷卡（全幣別）</div>
      <div style="font-size:11px;color:#aaa;margin-bottom:4px">消費</div>
      ${ccByCurRows||'<div style="font-size:14px;color:#ccc">無刷卡記錄</div>'}
      ${ccFinalHcTotal>0?`<div style="font-size:11px;color:var(--blue);font-weight:600;margin-top:4px">≈ ${currCode(hc)} ${fmt(ccFinalHcTotal)}</div>`:''}
      <div style="font-size:11px;color:${ccPendingCount>0?'#f97316':'#aaa'};margin-top:4px;font-weight:700">⚠️ 待請款 ${ccPendingCount} 筆</div>
    </div>`);
  }
  if (cards.length === 0) {
    return `<div style="text-align:center;color:#aaa;padding:20px;font-size:13px">尚無任何花費記錄</div>`;
  }
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">${cards.join('')}</div>`;
}

function renderPersonalTab() {
  const lc = localCur(), hc = habitCur();
  const allExps = getTripPersonalExpenses();
  const filteredExps = getFilteredPersonalExpenses();

  // 幣別清單：以行程設定為主，補上有記錄但未設定的幣別
  const tripCurs = getTripCurrencies();
  const expCurs  = [...new Set(allExps.map(e=>e.currency||lc))];
  const allCurs  = [...new Set([...tripCurs, ...expCurs])];
  const hc2 = habitCur();
  const currencies = [...allCurs.filter(c=>c!==hc2), hc2];
  const isAll = state.pfDashCurrency === 'all';
  // 比較時用 currCode 確保相容完整名稱（如 'RON (羅馬尼亞)'）和3碼縮寫
  if (!state.pfDashCurrency || (!isAll && !currencies.some(c=>currCode(c)===state.pfDashCurrency))) {
    state.pfDashCurrency = currCode(currencies[0] || lc);
  }
  const cur = isAll ? (currencies[0]||lc) : (currencies.find(c=>currCode(c)===state.pfDashCurrency) || currencies[0] || lc);
  const curExps = isAll
    ? allExps
    : allExps.filter(e=>(e.currency||lc)===state.pfDashCurrency);

  // 現金帳本計算
  const tripId = state.currentTrip?.id;
  const cashLedger  = (state.personalCashLedger||[]).filter(e=>e.tripId===tripId&&(e.currency||lc)===cur);
  const cashIn      = cashLedger.filter(e=>e.type==='入帳').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const cashLendOut = getDashLendOut(tripId, cur, '現金');
  const cashRecvBack= getAllReturnRecords(tripId, cur).filter(r=>r.dest==='現金').reduce((s,r)=>s+(parseFloat(r.amount)||0),0);

  // 電子支付帳本計算
  const epayLedger  = (state.personalEpayLedger||[]).filter(e=>e.tripId===tripId&&(e.currency||lc)===cur);
  const epayIn      = epayLedger.filter(e=>e.type==='儲值').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const epayLendOut = getDashLendOut(tripId, cur, '電子支付');
  const epayRecvBack= getAllReturnRecords(tripId, cur).filter(r=>r.dest==='電子支付').reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
  // 現金儲值電子支付（從現金池扣除）
  const cashToEpay  = epayLedger.filter(e=>e.type==='儲值'&&e.source==='現金').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);

  // 花費計算
  const cashSpend  = curExps.filter(e=>e.paymentMethod==='現金'&&e.category!=='金流').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const epaySpend  = curExps.filter(e=>e.paymentMethod==='電子支付'&&e.category!=='金流').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  
  // ==========================================
  // ==========================================
  // 【刷卡統計卡片計算邏輯】
  // isAll：計算全部幣別；單一幣別：只計算該幣別
  // ==========================================
  const allCCExps2 = getTripPersonalExpenses().filter(e=>e.paymentMethod==='信用卡');
  // F-11：信用卡儲值也納入（category='金流' 但 paymentMethod='信用卡'）
  const filtCCExps2 = isAll
    ? allCCExps2.filter(e=>e.paymentMethod==='信用卡')
    : allCCExps2.filter(e=>currCode(e.currency||lc)===currCode(cur)&&e.paymentMethod==='信用卡');
  let ccDomTotal = 0, ccDomCount = 0;
  let ccLocTotal = 0, ccLocCount = 0;
  let ccFinalHcTotal = 0, ccPendingCount = 0;

  filtCCExps2.forEach(e => {
    const c = e.currency || lc;
    const amt = parseFloat(e.amount || 0);
    const fr = parseFloat(e.feeRate || 0);
    const bill = parseFloat(e.twdAmount || e.billingAmount || 0);
    if (currCode(c) === currCode(hc)) {
      ccDomCount++;
      const fee = Math.round(amt * fr / 100);
      const tot = amt + fee;
      ccDomTotal += tot;
      ccFinalHcTotal += tot;
    } else {
      ccLocCount++;
      ccLocTotal += amt;
      const bt = e.billingType || 'twd';
      if (bt === 'original') {
        const fee = Math.round(amt * fr / 100);
        ccLocTotal += fee;
      } else {
        if (bill > 0) {
          const billFee = Math.round(bill * fr / 100);
          ccFinalHcTotal += (bill + billFee);
        } else {
          ccPendingCount++;
        }
      }
    }
  });

  // 餘額計算
  const cashBalance = cashIn - cashSpend - cashToEpay - cashLendOut + cashRecvBack;
  const epayBalance = epayIn - epaySpend - epayLendOut + epayRecvBack;

  // 類別統計（排除金流）
  const catTotals = {};
  PERSONAL_CATS.forEach(c=>{ catTotals[c]=0; });
  curExps.filter(e=>e.category!=='金流').forEach(e=>{ const c=e.category||'其他'; catTotals[c]=(catTotals[c]||0)+(parseFloat(e.amount)||0); });
  const topCats = Object.entries(catTotals).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const grandTotal = curExps.filter(e=>e.category!=='金流').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);

  // 幣別分頁：加「全部」分頁
  const curTabs = [
    `<button class="pf-cur-tab ${state.pfDashCurrency==='all'?'active':''}" onclick="pfSetDashCurrency('all')">全部</button>`,
    ...currencies.map(c=>`<button class="pf-cur-tab ${state.pfDashCurrency===c?'active':''}" onclick="pfSetDashCurrency('${currCode(c)}')">${currCode(c)}</button>`)
  ].join('');

  // Stacked Bar
  const stackedSegs = topCats.map(([cat,val])=>{
    const w = grandTotal>0 ? (val/grandTotal*100).toFixed(1) : 0;
    return `<div class="pf-stacked-seg" style="width:${w}%;background:${getCatColor(cat)}" title="${cat} ${w}%"></div>`;
  }).join('');

  // 篩選面板
  const allDates = [...new Set(allExps.map(e=>e.date))].sort();
  const filterPanel = state.pfFilterOpen ? `
    <div class="pf-filter-panel">
      <div class="pf-filter-inner">
        <div class="pf-filter-label">📅 日期快選</div>
        <div class="pf-filter-chips">
          ${allDates.map(d=>'<button class="pf-filter-chip '+(state.pfFilterDateFrom===d&&state.pfFilterDateTo===d?'on':'')+' " onclick="state.pfFilterDateFrom=\''+d+'\';state.pfFilterDateTo=\''+d+'\';renderTab()">'+formatDateSimple(d)+'</button>').join('')}
        </div>
        <div class="pf-filter-label">📆 自訂日期範圍</div>
        <input type="date" value="${state.pfFilterDateFrom}" onchange="state.pfFilterDateFrom=this.value;renderTab()" style="width:100%;margin-bottom:8px">
        <div style="font-size:12px;color:#aaa;text-align:center;margin-bottom:8px">～</div>
        <input type="date" value="${state.pfFilterDateTo}" onchange="state.pfFilterDateTo=this.value;renderTab()" style="width:100%;margin-bottom:4px">
        <div class="pf-filter-label">🏷️ 類別</div>
        <div class="pf-filter-chips">
          ${PERSONAL_CATS.map(c=>'<button class="pf-filter-chip '+(state.pfFilterCats.includes(c)?'on':'')+' " onclick="pfToggleFilterCat(\''+c+'\')">' +c+'</button>').join('')}
        </div>
        <div class="pf-filter-footer">
          <span class="pf-filter-count">顯示 <strong>${filteredExps.length}</strong> 筆 / 共 ${allExps.length} 筆</span>
          ${pfHasActiveFilter()?'<button class="pf-filter-clear" onclick="pfClearFilter()">✕ 清除篩選</button>':''}
        </div>
      </div>
    </div>` : '';

  let html = '';

  // ── 儀表板 ──
  html += `<div class="pf-cur-tabs" style="margin-bottom:8px">${curTabs}</div>`;
  html += `<div class="pf-dashboard">
    ${isAll ? buildPfAllCards(currencies, lc, hc, tripId, ccFinalHcTotal, ccLocTotal, ccDomTotal, ccLocCount, ccDomCount, ccPendingCount, filtCCExps2) : (
    '<div class="pf-summary-cards" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">'
    +'<div class="pf-twin-card" style="padding:12px 8px;cursor:pointer" onclick="openLedgerTabs(\'cash\')">'
    +'<div class="pf-twin-label" style="font-size:11px;margin-bottom:4px">💵 現金</div>'
    +'<div style="font-size:11px;color:#aaa;margin-bottom:2px">入帳</div>'
    +'<div style="font-size:18px;font-weight:800;color:var(--text)">'+fmt(cashIn)+'</div>'
    +'<div style="font-size:11px;color:#aaa;margin:4px 0 2px">已花</div>'
    +'<div style="font-size:14px;font-weight:700;color:var(--red)">'+fmt(cashSpend)+'</div>'
    +((cashLendOut-cashRecvBack)>0?'<div style="font-size:11px;color:#aaa;margin:3px 0 1px">借出未收回</div><div style="font-size:13px;font-weight:700;color:#f97316">'+fmt(cashLendOut-cashRecvBack)+'</div>':'')
    +'<div style="border-top:1px solid #e5e7eb;margin:6px 0 4px"></div>'
    +'<div style="font-size:13px;font-weight:800;color:'+(cashBalance>=0?'var(--green)':'var(--red)')+'">剩 '+fmt(Math.abs(cashBalance))+'</div>'
    +'<div style="font-size:10px;color:#aaa">'+currCode(cur)+'</div>'
    +'</div>'
    +'<div class="pf-twin-card" style="padding:12px 8px;cursor:pointer" onclick="openLedgerTabs(\'cc\')">'
    +'<div class="pf-twin-label" style="font-size:11px;margin-bottom:4px">💳 刷卡</div>'
    +'<div style="font-size:11px;color:#aaa;margin-bottom:2px">消費</div>'
    +'<div style="font-size:18px;font-weight:800;color:var(--text);line-height:1.2">'+fmt(ccLocTotal)+' ('+ccLocCount+')</div>'
    +(ccFinalHcTotal>0?'<div style="font-size:11px;color:var(--blue);margin-top:4px;font-weight:600">≈ '+currCode(hc)+' '+fmt(ccFinalHcTotal)+'</div>':'')
    +'<div style="font-size:11px;color:'+(ccPendingCount>0?'#f97316':'#aaa')+';margin-top:4px;font-weight:700">⚠️ 待請款 '+ccPendingCount+' 筆</div>'
    +'</div>'
    +'<div class="pf-twin-card" style="padding:12px 8px;cursor:pointer" onclick="openLedgerTabs(\'epay\')">'
    +'<div class="pf-twin-label" style="font-size:11px;margin-bottom:4px">📱 電子</div>'
    +'<div style="font-size:11px;color:#aaa;margin-bottom:2px">儲值</div>'
    +'<div style="font-size:18px;font-weight:800;color:var(--text)">'+fmt(epayIn)+'</div>'
    +'<div style="font-size:11px;color:#aaa;margin:4px 0 2px">已花</div>'
    +'<div style="font-size:14px;font-weight:700;color:var(--red)">'+fmt(epaySpend)+'</div>'
    +((epayLendOut-epayRecvBack)>0?'<div style="font-size:11px;color:#aaa;margin:3px 0 1px">借出未收回</div><div style="font-size:13px;font-weight:700;color:#f97316">'+fmt(epayLendOut-epayRecvBack)+'</div>':'')
    +'<div style="border-top:1px solid #e5e7eb;margin:6px 0 4px"></div>'
    +'<div style="font-size:13px;font-weight:800;color:'+(epayBalance>=0?'var(--green)':'var(--red)')+'">剩 '+fmt(Math.abs(epayBalance))+'</div>'
    +'<div style="font-size:10px;color:#aaa">'+currCode(cur)+'</div>'
    +'</div>'
    +'</div>'
    )}
    ${stackedSegs ? '<div class="pf-stacked-bar">'+stackedSegs+'</div>' : ''}
    ${(function(){
      var balItems=[];
      getTripCurrencies().map(function(c){return currCode(c);}).forEach(function(cCode2){
        var cl=(state.personalCashLedger||[]).filter(function(r){return r.tripId===tripId&&currCode(r.currency||lc)===cCode2;});
        var cIn=cl.filter(function(r){return r.type==='入帳';}).reduce(function(s,r){return s+(parseFloat(r.amount)||0);},0);
        var cL=getDashLendOut(tripId,cCode2,'現金');
        var cR=getAllReturnRecords(tripId,cCode2).filter(function(r){return r.dest==='現金';}).reduce(function(s,r){return s+(parseFloat(r.amount)||0);},0);
        var cE=(state.personalEpayLedger||[]).filter(function(e){return e.tripId===tripId&&e.source==='現金'&&currCode(e.currency||lc)===cCode2;}).reduce(function(s,e){return s+(parseFloat(e.amount)||0);},0);
        var cS=getTripPersonalExpenses().filter(function(e){return e.paymentMethod==='現金'&&e.category!=='\u91d1\u6d41'&&currCode(e.currency||lc)===cCode2;}).reduce(function(s,e){return s+(parseFloat(e.amount)||0);},0);
        var bal=cIn-cS-cE-cL+cR;
        if(cIn>0||bal>0) balItems.push('<span onclick="openLedgerTabs(\'cash\')" style="cursor:pointer;color:#555">\ud83d\udcb5 '+cCode2+' <b style="color:'+(bal>0?'var(--green)':'var(--red)')+'">'+fmt(bal)+'</b></span>');
        var eL=(state.personalEpayLedger||[]).filter(function(e){return e.tripId===tripId&&currCode(e.currency||lc)===cCode2;});
        var eIn=eL.filter(function(e){return e.type==='\u5132\u5024';}).reduce(function(s,e){return s+(parseFloat(e.amount)||0);},0);
        var eLend=eL.filter(function(e){return e.type==='\u501f\u51fa';}).reduce(function(s,e){return s+(parseFloat(e.amount)||0);},0);
        var eRet=eL.filter(function(e){return e.type==='\u6536\u56de';}).reduce(function(s,e){return s+(parseFloat(e.amount)||0);},0);
        var eSp=getTripPersonalExpenses().filter(function(e){return e.paymentMethod==='\u96fb\u5b50\u652f\u4ed8'&&e.category!=='\u91d1\u6d41'&&currCode(e.currency||lc)===cCode2;}).reduce(function(s,e){return s+(parseFloat(e.amount)||0);},0);
        var eBal=eIn-eSp-eLend+eRet;
        if(eIn>0||eBal>0) balItems.push('<span onclick="openLedgerTabs(\'epay\')" style="cursor:pointer;color:#555">\ud83d\udcf1 '+cCode2+' <b style="color:'+(eBal>0?'var(--green)':'var(--red)')+'">'+fmt(eBal)+'</b></span>');
      });
      return balItems.length?'<div style="display:flex;flex-wrap:wrap;gap:10px;padding:6px 4px 0;font-size:12px">'+balItems.join('')+'</div>':'';
    })()}
  </div>`;

  // ── 匯出＋帳本總覽按鈕列 ──
  html += `<div class="pf-export-row" style="justify-content:flex-end">
    <button class="pf-export-btn" style="background:var(--purple-light);border-color:var(--purple);color:var(--purple);font-weight:700;flex:none;padding:10px 20px" onclick="openLedgerOverview()">📖 帳本總覽</button>
  </div>`;

  // ── 搜尋＋篩選按鈕 ──
  html += `<div class="search-wrap" style="margin-bottom:10px">
    <span class="search-icon">🔍</span>
    <input type="text" id="personal-search-inp" placeholder="搜尋花費項目..." value="${state.personalSearchTerm}" oninput="handlePersonalSearch(this.value)">
    <button class="pf-search-filter-btn ${pfHasActiveFilter()?'has-filter':''}" onclick="pfToggleFilterPanel()">${pfHasActiveFilter()?'篩選●':'⚙️'}</button>
    <button class="search-clear" id="personal-search-clear" style="display:${state.personalSearchTerm?'flex':'none'}" onclick="handlePersonalSearch(''); document.getElementById('personal-search-inp').value='';">✕</button>
  </div>`;

  // ── 篩選面板 ──
  html += filterPanel;

  // ── 新增按鈕 ──
  html += `<div class="flex-row" style="margin-bottom:14px;gap:10px">
    <button class="btn btn-purple" style="flex:2" onclick="openPersonalForm()">＋ 新增個人花費</button>
    <button class="btn btn-green-light" style="flex:1" onclick="openLedgerModal()">＋ 入帳</button>
  </div>`;

  if (state.personalForm) html += renderPersonalForm();

  html += `<div id="personal-expense-list-container">${renderPersonalListHTML()}</div>`;
  return html;
}
function renderPersonalItem(e) {
  const lc = localCur();
  const sid = 'sw-pe-' + e.id;
  const detailCount = (e.details||[]).filter(d=>d.desc||d.amount).length;
  const feeAmt = e.feeRate && e.twdAmount ? Math.round(parseFloat(e.twdAmount||0)*parseFloat(e.feeRate||0)/100) : 0;
  const isLedger = e.category === '金流';

  // 金流入帳記錄特殊樣式
  if (isLedger) {
    const icon = e.ledgerType==='cashIn'?'💵':e.ledgerType==='epayIn'?'📱':e.isLending?'🤝':'💰';
    // 類型標籤文字
    const typeLabel = e.ledgerType==='cashIn'?'現金兌換':
      e.ledgerType==='epayIn'?'電子支付儲值':
      e.ledgerType==='return'?'收回借款':
      e.isLending?'借出':'金流';
    const tagColor = e.isLending?'#f97316':
      e.ledgerType==='return'?'#15803d':
      '#6366f1';
    // 信用卡儲值請款資訊
    const feeAmt = e.feeRate && e.twdAmount ? Math.round(parseFloat(e.twdAmount||0)*parseFloat(e.feeRate||0)/100) : 0;
    const ccBillingHTML = e.paymentMethod==='信用卡'&&e.twdAmount?
      `<div class="billed-text">(TWD ${e.twdAmount}+${feeAmt}=${parseFloat(e.twdAmount||0)+feeAmt})</div>`:'';
    const payIcon = e.paymentMethod==='信用卡'?'💳':e.paymentMethod==='電子支付'?'📱':'💵';
    return `<div class="swipe-wrap" id="${sid}"
      data-delete="delPersonalExpense('${e.id}')"
      data-tap="openPersonalDetail('${e.id}')">
      <div class="swipe-bg">🗑️</div>
      <div class="swipe-content" style="background:#f0fdf4;padding:12px 15px;border-radius:var(--radius);border:1px solid #bbf7d0;display:flex;justify-content:space-between;align-items:center">
        <div style="display:flex;flex-direction:column;gap:3px;flex:1">
          <div style="font-size:14px;font-weight:700;color:#15803d">${icon} ${e.item||'(未命名)'}</div>
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
            <span style="background:${tagColor};color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px">${typeLabel}</span>
            <span style="font-size:12px;color:#aaa">${e.date}</span>
          </div>
          ${e.notes?`<div style="font-size:11px;color:#aaa">📝 ${e.notes}</div>`:''}
        </div>
        <div class="expense-right">
          <div style="font-size:16px;font-weight:800;color:#15803d">
            <span style="font-size:11px;margin-right:2px">${e.currency||lc}</span>${fmt(e.amount)}
          </div>
          ${ccBillingHTML}
          <div class="expense-payer">${payIcon}${e.paymentMethod}支付</div>
        </div>
      </div>
    </div>`;
  }

  return `<div class="swipe-wrap" id="${sid}"
    data-delete="delPersonalExpense('${e.id}')"
    data-tap="openPersonalDetail('${e.id}')">
    <div class="swipe-bg">🗑️</div>
    <div class="swipe-content" style="background:var(--white);padding:14px 15px;border-radius:var(--radius);border:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center">
      <div style="display:flex;flex-direction:column;gap:4px;flex:1">
        <div style="font-size:15px;font-weight:700;color:var(--text)">${e.item||'(未命名)'}${e.isGift?` <span class="pf-gift-badge">🛍️ 代購</span>`:''}</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span style="background:${getCatColor(e.category)};color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px">${e.category}</span>
          <span style="font-size:12px;color:var(--text-sub)">${e.date}</span>
          ${detailCount>0?`<span style="font-size:10px;color:#aaa">📋 ${detailCount}細項</span>`:''}
          ${(e.attachments||[]).length>0?`<span style="font-size:10px;color:#aaa">📎 ${e.attachments.length}張</span>`:''}
        </div>
        ${e.notes ? `<div style="font-size:11px;color:#aaa;margin-top:1px">📝 ${e.notes}</div>` : ''}
        ${e.isGift&&e.giftTargets&&e.giftTargets.length?`<div style="font-size:11px;color:#c2410c;margin-top:1px">🛍️ ${e.giftTargets.map(g=>g.name).join('、')}</div>`:''}
        ${e.isLending&&e.lendingTarget?`<div style="font-size:11px;color:#1d4ed8;margin-top:1px">🤝 借出：${e.lendingTarget}</div>`:''}
        <div style="margin-top:4px">
          <button class="pf-convert-btn" onclick="event.stopPropagation();convertPersonalToPool('${e.id}')">🔄 轉為公費</button>
        </div>
      </div>
      <div class="expense-right">
        <div class="expense-amount-red">
          <span style="font-size:11px;margin-right:2px">${e.currency||lc}</span>${fmt(e.amount)}
        </div>
        ${(()=>{
          const _lc2=localCur(), _hc2=habitCur();
          const bt2 = e.billingType||(((e.currency||_lc2)===_hc2)?'domestic':'twd');
          if (bt2==='domestic'&&e.paymentMethod==='信用卡'){const f2=e.feeRate?Math.round(parseFloat(e.amount||0)*parseFloat(e.feeRate||0)/100):0;return f2>0?`<div class="billed-text">(${_hc2} ${fmt(e.amount)}+${fmt(f2)}=${fmt(parseFloat(e.amount||0)+f2)})</div>`:'';}
          if (bt2==='twd'&&e.twdAmount&&e.paymentMethod==='信用卡')return `<div class="billed-text">(${_hc2} ${e.twdAmount}+${feeAmt}=${parseFloat(e.twdAmount||0)+feeAmt})</div>`;
          if (bt2==='original'&&e.paymentMethod==='信用卡'){const f3=e.feeRate?Math.round(parseFloat(e.amount||0)*parseFloat(e.feeRate||0)/100):0;return `<div class="billed-text" style="color:#6366f1">(${e.currency||_lc2} ${fmt(e.amount||0)}+${fmt(f3)}=${fmt(parseFloat(e.amount||0)+f3)})</div>`;}
          return '';
        })()}
        <div class="expense-payer">${e.paymentMethod==='信用卡'?'💳':e.paymentMethod==='電子支付'?'📱':'💵'}${e.paymentMethod}支付</div>
      </div>
    </div>
  </div>`;
}

    // 代購/送禮區塊

  return `<div class="form-card" style="margin-bottom:16px">

    </div>
    ${e.isLending ? `
    <div style="background:#eff6ff;border-radius:10px;padding:12px;margin-bottom:4px;border:1px solid #bfdbfe">

            </select></div>` : ''}
          <input type="text" id="pf-lend-custom" placeholder="自行輸入姓名" style="flex:1;font-size:13px;padding:8px 10px"
            value="${e.lendingIsCustom?e.lendingTarget:''}"
            oninput="state.personalForm.lendingTarget=this.value;state.personalForm.lendingIsCustom=true">

        ${e.lendingTarget?`<div style="margin-top:6px;font-size:12px;color:#1d4ed8">借給：<strong>${e.lendingTarget}</strong></div>`:''}

          </label>
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer">

    </div>

}

// ===== F1-F8：帳本總覽 Modal =====
// 取得所有待收回對象（尚欠 > 0）
function getPendingLendTargets(tripId, currency) {
  const lends = getAllLendRecords(tripId, currency);
  const targets = [...new Set(lends.map(e=>e.lendingTarget))];
  return targets.map(target=>{
    const bal = calcPersonLendBalance(target, tripId, currency);
    return { target, ...bal };
  }).filter(x=>x.remaining > 0);
}

function openLedgerOverview() {
  const t = state.currentTrip;
  if (!t) return;
  showModal(buildOverviewHTML('total'));
}

function buildOverviewHTML(activeTab) {
  const t = state.currentTrip;
  if (!t) return '';
  const lc = localCur(), hc = habitCur();
  const tripId = t.id;
  // 帳本總覽永遠顯示全部幣別，不受儀表板分頁影響
  const allExps = getTripPersonalExpenses();
  const cur = lc; // 預設用第一幣別，各 tab 內部自行處理多幣別

  const tabs = [
    {key:'total', label:'📋 總明細'},
    {key:'cash',  label:'💵 現金'},
    {key:'cc',    label:'💳 刷卡'},
    {key:'epay',  label:'📱 電子'},
  ];
  const tabsHTML = tabs.map(tb=>`
    <button class="overview-tab ${activeTab===tb.key?'active':''}" onclick="switchOverviewTab('${tb.key}')">${tb.label}</button>
  `).join('');

  let contentHTML = '';
  if (activeTab === 'total') contentHTML = buildTotalTab(tripId, cur, lc, hc, allExps);
  else if (activeTab === 'cash') contentHTML = buildCashTab(tripId, cur, lc, allExps);
  else if (activeTab === 'cc')   contentHTML = buildCCTab(tripId, cur, lc, hc, allExps);
  else if (activeTab === 'epay') contentHTML = buildEpayTab(tripId, cur, lc, allExps);

  return `
    <div class="modal-header">
      <span class="modal-title">📊 帳本總覽</span>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="overview-tabs" id="overview-tabs">${tabsHTML}</div>
    <div id="overview-content" style="max-height:60vh;overflow-y:auto">${contentHTML}</div>`;
}

function switchOverviewTab(tab) {
  document.getElementById('modal-content').innerHTML = buildOverviewHTML(tab);
}

// F2：總明細 Tab
function buildTotalTab(tripId, cur, lc, hc, allExps) {
  // 顯示全部幣別，不依 cur 過濾
  const cashLedger = (state.personalCashLedger||[]).filter(e=>e.tripId===tripId);
  const epayLedger = (state.personalEpayLedger||[]).filter(e=>e.tripId===tripId);
  const lendExps   = (state.personalExpenses||[]).filter(e=>e.tripId===tripId&&e.isLending);
  const returnRecs = (state.personalExpenses||[]).filter(e=>e.tripId===tripId&&e.isReturning);

  // 整理所有列表資料
  const rows = [
    ...cashLedger.filter(e=>e.type==='入帳').map(r=>({date:r.date,icon:'💵',badge:'<span style="color:#666;font-size:11px">[💵 現金]</span>',label:'現金兌換',sub:r.note||'',amt:+(parseFloat(r.amount)||0), mainHtml:'', isLedger:true})),
    ...epayLedger.filter(e=>e.type==='儲值').map(r=>({date:r.date,icon:'📱',badge:'<span style="color:var(--green);font-size:11px">[📱 電子]</span>',label:'電子支付儲值（'+r.source+'）',sub:r.note||'',amt:+(parseFloat(r.amount)||0), mainHtml:'', isLedger:true})),
    ...lendExps.map(e=>({date:e.date,icon:'🤝',badge:'',label:'借出：'+e.lendingTarget,sub:'',amt:-(parseFloat(e.amount)||0), mainHtml:'', isLedger:true})),
    ...returnRecs.map(r=>({date:r.date,icon:'💰',badge:'',label:'收回：'+r.target,sub:'',amt:+(parseFloat(r.amount)||0), mainHtml:'', isLedger:true})),
    ...allExps.filter(e=>e.category!=='金流').map(e=>{
      let badge = '', mainHtml = '';
      const amtVal = parseFloat(e.amount)||0;
      let finalAmt = -amtVal; 
      
      if(e.paymentMethod==='信用卡') {
        badge = '<span style="color:var(--purple);font-size:11px;font-weight:700">[💳 刷卡]</span>';
        const bt = e.billingType || (((e.currency||lc)===hc)?'domestic':'twd');
        const fr = parseFloat(e.feeRate||0);
        
        if (bt === 'domestic') {
          const fee = Math.round(amtVal * fr / 100);
          const total = amtVal + fee;
          finalAmt = -total;
          mainHtml = `<div style="font-size:14px;color:var(--text);font-weight:700">${hc} ${fmt(total)}</div><div style="font-size:10px;color:#aaa">(消費 ${fmt(amtVal)} + 手續費 ${fmt(fee)})</div>`;
        } else if (bt === 'twd') {
          const bill = parseFloat(e.twdAmount || e.billingAmount || 0);
          if (bill > 0) {
            const fee = Math.round(bill * fr / 100);
            const total = bill + fee;
            finalAmt = -total;
            mainHtml = `<div style="font-size:14px;color:var(--text);font-weight:700">${hc} ${fmt(total)}</div><div style="font-size:10px;color:#aaa">(${e.currency||lc} ${fmt(amtVal)} | 請款 ${fmt(bill)} + 手續費 ${fmt(fee)})</div>`;
          } else {
            finalAmt = -amtVal; 
            mainHtml = `<div style="font-size:14px;color:var(--red);font-weight:700">${e.currency||lc} ${fmt(amtVal)} ⚠️待請款</div><div style="font-size:10px;color:#aaa">(預估手續費 ${fr}%)</div>`;
          }
        } else if (bt === 'original') {
          const fee = Math.round(amtVal * fr / 100);
          const total = amtVal + fee;
          finalAmt = -total;
          mainHtml = `<div style="font-size:14px;color:var(--purple);font-weight:700">${e.currency||lc} ${fmt(total)}</div><div style="font-size:10px;color:#aaa">(消費 ${fmt(amtVal)} + 手續費 ${fmt(fee)})</div>`;
        }
      } else if (e.paymentMethod==='電子支付') {
        badge = '<span style="color:var(--green);font-size:11px;font-weight:700">[📱 電子]</span>';
        mainHtml = `<div style="font-size:14px;color:var(--text);font-weight:700">${e.currency||lc} ${fmt(amtVal)}</div>`;
      } else {
        badge = '<span style="color:#666;font-size:11px;font-weight:700">[💵 現金]</span>';
        mainHtml = `<div style="font-size:14px;color:var(--text);font-weight:700">${e.currency||lc} ${fmt(amtVal)}</div>`;
      }
      
      return {
        date: e.date,
        icon: '',
        badge: badge,
        label: e.item,
        sub: e.category,
        amt: finalAmt,
        mainHtml: mainHtml,
        isLedger: false,
        id: e.id
      };
    })
  ].sort((a,b)=>a.date.localeCompare(b.date));

  const rowsHTML = rows.length ? rows.map(r=>`
    <div class="overview-row" ${!r.isLedger&&r.id?`onclick="openPersonalDetail('${r.id}')" style="cursor:pointer"`:''}>
      <div>
        <div class="overview-date">${formatDateSimple(r.date)}</div>
        <div class="overview-label" style="display:flex;align-items:center;gap:4px">
          ${r.icon?`<span>${r.icon}</span>`:''}
          <span>${r.label}</span>
          ${r.badge}
        </div>
        ${r.sub?`<div class="overview-sub">${r.sub}</div>`:''}
      </div>
      <div class="overview-amt ${r.amt>=0?'overview-pos':'overview-neg'}" style="text-align:right">
        ${r.mainHtml ? r.mainHtml : (r.amt>=0?'+':'-') + fmt(Math.abs(r.amt)) + ' ' + cur}
      </div>
    </div>`).join('') : '<div style="color:#ccc;text-align:center;padding:20px">尚無記錄</div>';

  const pendingHTML = buildPendingSection(tripId, cur, lc);
  return rowsHTML + pendingHTML;
}
function buildCashTab(tripId, cur, lc, allExps) {
  // 顯示全部幣別，按幣別分組統計
  const tripCurs = [...new Set([...getTripCurrencies().map(c=>currCode(c)), ...(state.personalCashLedger||[]).filter(e=>e.tripId===tripId).map(e=>currCode(e.currency||lc))])];
  let allRows = [];
  let summaryByCur = {};

  tripCurs.forEach(cCode => {
    const cLedger   = (state.personalCashLedger||[]).filter(e=>e.tripId===tripId&&currCode(e.currency||lc)===cCode);
    const cIn       = cLedger.filter(e=>e.type==='入帳').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    const cLendOut  = getDashLendOut(tripId, cCode, '現金');
    const cRecvBack = getAllReturnRecords(tripId, cCode).filter(r=>r.dest==='現金').reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
    const cToEpay   = (state.personalEpayLedger||[]).filter(e=>e.tripId===tripId&&e.source==='現金'&&currCode(e.currency||lc)===cCode).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    const cExps     = allExps.filter(e=>e.paymentMethod==='現金'&&e.category!=='金流'&&currCode(e.currency||lc)===cCode);
    const cSpend    = cExps.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    if (cIn===0&&cSpend===0&&cLendOut===0) return; // 跳過無資料幣別
    summaryByCur[cCode] = { cIn, cSpend, cToEpay, cLendOut, cRecvBack, bal: cIn-cSpend-cToEpay-cLendOut+cRecvBack };
    const cLendExps  = getAllLendRecords(tripId, cCode).filter(e=>e.lendingSource==='現金'||!e.lendingSource);
    const cReturnCash= getAllReturnRecords(tripId, cCode).filter(r=>r.dest==='現金');
    allRows = allRows.concat([
      ...cLedger.filter(e=>e.type==='入帳').map(r=>({date:r.date,icon:'💵',label:'現金兌換',sub:r.note||'',amt:+(parseFloat(r.amount)||0),cCode})),
      ...cLendExps.map(e=>({date:e.date,icon:'🤝',label:'借出：'+e.lendingTarget,sub:'',amt:-(parseFloat(e.amount)||0),cCode})),
      ...cReturnCash.map(r=>({date:r.date,icon:'💰',label:'收回：'+(r.target||''),sub:'',amt:+(parseFloat(r.amount)||0),cCode})),
      ...(state.personalEpayLedger||[]).filter(e=>e.tripId===tripId&&e.source==='現金'&&currCode(e.currency||lc)===cCode).map(e=>({date:e.date,icon:'📱',label:'電子支付儲值',sub:'',amt:-(parseFloat(e.amount)||0),cCode})),
      ...cExps.map(e=>({date:e.date,icon:'💸',label:e.item,sub:e.category,amt:-(parseFloat(e.amount)||0),cCode})),
    ]);
  });
  allRows.sort((a,b)=>a.date.localeCompare(b.date));

  const hc = habitCur();
  const rowsHTML = allRows.length ? `<div style="padding:4px 0">` + allRows.map(r=>`
    <div class="overview-row">
      <div><div class="overview-date">${formatDateSimple(r.date)}</div><div class="overview-label">${r.icon} ${r.label}</div>${r.sub?`<div class="overview-sub">${r.sub}</div>`:''}</div>
      <div style="text-align:right;font-size:13px;font-weight:700;color:${r.amt>=0?'var(--green)':'var(--red)'}">${r.amt>=0?'+':''}${fmt(Math.abs(r.amt))} ${r.cCode}</div>
    </div>`).join('') + `</div>` : `<div style="text-align:center;color:#aaa;padding:16px;font-size:13px">尚無現金記錄</div>`;

  const summaryHTML = Object.keys(summaryByCur).length ? `<div style="margin:8px 0;padding:10px 12px;background:#f0fdf4;border-radius:8px;font-size:12px">` +
    Object.entries(summaryByCur).map(([cCode,s])=>`
      <div style="display:flex;justify-content:space-between;margin-bottom:3px">
        <span style="color:#666">${cCode} 現金餘額</span>
        <span style="font-weight:700;color:${s.bal>=0?'var(--green)':'var(--red)'}">${fmt(s.bal)} ${cCode}</span>
      </div>`).join('') + `</div>` : '';

  return rowsHTML + summaryHTML;
}

// F4：刷卡 Tab
function buildCCTab(tripId, cur, lc, hc, allExps) {
  const allCCE = getTripPersonalExpenses().filter(e=>e.paymentMethod==='信用卡'); // 含信用卡儲值（category=金流）
  const gbt = e => e.billingType||(((e.currency||lc)===hc)?'domestic':'twd');
  
  const fxTwd  = allCCE.filter(e=>gbt(e)==='twd'&&(e.currency||lc)!==hc);
  const fxOrig = allCCE.filter(e=>gbt(e)==='original');
  const dom    = allCCE.filter(e=>gbt(e)==='domestic'||(e.currency||lc)===hc);
  
  // 格式化顯示
  const fmtR = (e) => {
    const bt=gbt(e);
    const origAmt = parseFloat(e.amount||0);
    const fr = parseFloat(e.feeRate||0);
    
    if (bt === 'domestic') {
      const fee = Math.round(origAmt * fr / 100);
      const tt = origAmt + fee;
      return `<div style="font-size:14px;color:var(--text);font-weight:700">${hc} ${fmt(tt)}</div><div style="font-size:10px;color:#aaa">(消費 ${fmt(origAmt)} + 手續費 ${fmt(fee)})</div>`;
    } else if (bt === 'twd') {
      const bill = parseFloat(e.twdAmount || e.billingAmount || 0);
      if (bill > 0) {
        const fee = Math.round(bill * fr / 100);
        const tt = bill + fee;
        return `<div style="font-size:14px;color:var(--text);font-weight:700">${hc} ${fmt(tt)}</div><div style="font-size:10px;color:#aaa">(${e.currency||lc} ${fmt(origAmt)} | 請款 ${fmt(bill)} + 手續費 ${fmt(fee)})</div>`;
      } else {
        return `<div style="font-size:14px;color:var(--red);font-weight:700">${e.currency||lc} ${fmt(origAmt)} ⚠️待請款</div><div style="font-size:10px;color:#aaa">(預估手續費 ${fr}%)</div>`;
      }
    } else if (bt === 'original') {
      const fee = Math.round(origAmt * fr / 100);
      const tt = origAmt + fee;
      return `<div style="font-size:14px;color:var(--purple);font-weight:700">${e.currency||lc} ${fmt(tt)}</div><div style="font-size:10px;color:#aaa">(消費 ${fmt(origAmt)} + 手續費 ${fmt(fee)})</div>`;
    }
  };

  // 產生區塊 HTML（輕量分隔線樣式，不像巢狀 tab）
  const buildSection = (title, dataList, emptyMsg, colorClass) => {
    const rows = dataList.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`
      <div class="overview-row" onclick="openPersonalDetail('${e.id}')" style="cursor:pointer">
        <div>
          <div class="overview-date">${formatDateSimple(e.date)}</div>
          <div class="overview-label">${e.item}</div>
          <div class="overview-sub">${e.category}</div>
        </div>
        <div class="overview-amt overview-neg" style="text-align:right">${fmtR(e)}</div>
      </div>`).join('');
    return `
      <div style="margin:10px 0 0 0">
        <div style="padding:6px 12px;font-size:12px;font-weight:700;color:${colorClass};border-left:3px solid ${colorClass};background:#fafafa;margin-bottom:2px">
          ${title}
        </div>
        <div style="padding:0 4px">
          ${rows || `<div style="padding:10px 8px;text-align:center;color:#aaa;font-size:12px">${emptyMsg}</div>`}
        </div>
      </div>`;
  };

  // 產生三個區塊（藍:換算台幣, 紫:原幣扣款, 綠:國內刷卡）
  const sec1 = buildSection('🌍 海外刷卡 → 換算台幣請款', fxTwd, '尚無換算台幣請款記錄', '#3b82f6');
  const sec2 = buildSection('💱 海外刷卡 → 維持原幣請款', fxOrig, '尚無原幣扣款記錄', '#a855f7');
  const sec3 = buildSection('🇹🇼 國內刷卡 (TWD)', dom, '尚無國內刷卡記錄', '#10b981');

  // 底部統計計算
  let ttTwdBill = 0, pendCount = 0;
  let ttDom = 0;
  const origCurTotals = {};

  dom.forEach(e=>{ 
    let amt = parseFloat(e.amount||0);
    let fee = Math.round(amt * parseFloat(e.feeRate||0) / 100);
    ttDom += (amt + fee); 
  });
  fxTwd.forEach(e=>{
    const b = parseFloat(e.twdAmount||e.billingAmount||0);
    if(b>0) ttTwdBill += (b + Math.round(b*parseFloat(e.feeRate||0)/100));
    else pendCount++;
  });
  fxOrig.forEach(e=>{
    const a = parseFloat(e.amount||0);
    const c = e.currency||lc;
    if(!origCurTotals[c]) origCurTotals[c] = 0;
    origCurTotals[c] += (a + Math.round(a*parseFloat(e.feeRate||0)/100));
  });

  const finalTwdTotal = ttDom + ttTwdBill;
  
  const origSumHtml = Object.entries(origCurTotals).map(([c, v]) => 
    `<div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px;color:#666;">
      <span>原幣請款合計 (${c})</span><span style="font-weight:700;color:var(--purple)">${c} ${fmt(v)}</span>
     </div>`
  ).join('');

  // 底部統計區塊 HTML
  let summaryHtml = `<div style="padding:15px;background:#fff;border-top:2px solid #eee;margin-top:10px;">
    <div style="font-size:12px;color:#888;font-weight:700;margin-bottom:8px">📊 底部統計</div>
    
    <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px;color:#666;">
      <span>海外換算請款小計</span><span style="font-weight:600;">${hc} ${fmt(ttTwdBill)}</span>
    </div>
    ${origSumHtml}
    <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px;color:#666;">
      <span>國內刷卡小計</span><span style="font-weight:600;">${hc} ${fmt(ttDom)}</span>
    </div>
    
    <div style="border-top:1px dashed #ccc;margin:12px 0;"></div>
    
    <div style="display:flex;justify-content:space-between;margin-bottom:6px;align-items:center;">
      <span style="font-weight:800;color:var(--text);font-size:14px;">🏦 ${hc} 請款總額</span>
      <span style="font-weight:900;color:var(--red);font-size:18px;">${hc} ${fmt(finalTwdTotal)}</span>
    </div>
    
    ${pendCount>0 ? 
      `<div style="display:flex;justify-content:space-between;margin-top:10px;background:#fff7ed;border-radius:4px;padding:10px;border-left:4px solid #ea580c;">
        <span style="color:#ea580c;font-weight:700;font-size:13px;">⚠️ 待請款筆數</span>
        <span style="color:#ea580c;font-weight:800;cursor:pointer" onclick="showPendingBillingList()">${pendCount} 筆 ›</span>
       </div>` 
      : `<div style="font-size:13px;color:var(--green);margin-top:10px;text-align:right;font-weight:700;">✅ 全數已出帳</div>`}
  </div>`;
  
  return `<div style="padding-bottom:20px;background:#f5f7fa;padding-top:8px;overflow-x:hidden">` + sec1 + sec2 + sec3 + summaryHtml + `</div>`;
}
function buildEpayTab(tripId, cur, lc, allExps) {
  // 顯示全部幣別
  const tripCurs = [...new Set([...getTripCurrencies().map(c=>currCode(c)), ...(state.personalEpayLedger||[]).filter(e=>e.tripId===tripId).map(e=>currCode(e.currency||lc))])];
  let allRows = [];
  const summaryByCur = {};

  tripCurs.forEach(cCode => {
    const cLedger    = (state.personalEpayLedger||[]).filter(e=>e.tripId===tripId&&currCode(e.currency||lc)===cCode);
    const cIn        = cLedger.filter(e=>e.type==='儲值').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    const cLendOut   = getDashLendOut(tripId, cCode, '電子支付');
    const cRecvBack  = getAllReturnRecords(tripId, cCode).filter(r=>r.dest==='電子支付').reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
    const cExps      = allExps.filter(e=>e.paymentMethod==='電子支付'&&e.category!=='金流'&&currCode(e.currency||lc)===cCode);
    const cSpend     = cExps.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    if (cIn===0&&cSpend===0&&cLendOut===0) return;
    summaryByCur[cCode] = { cIn, cSpend, cLendOut, cRecvBack, bal: cIn-cSpend-cLendOut+cRecvBack };
    const cLendEpay  = getAllLendRecords(tripId, cCode).filter(e=>e.lendingSource==='電子支付');
    const cRetEpay   = getAllReturnRecords(tripId, cCode).filter(r=>r.dest==='電子支付');
    allRows = allRows.concat([
      ...cLedger.filter(e=>e.type==='儲值').map(r=>({date:r.date,icon:'📱',label:'儲值（'+r.source+'）',sub:r.note||'',amt:+(parseFloat(r.amount)||0),cCode})),
      ...cLendEpay.map(e=>({date:e.date,icon:'🤝',label:'借出：'+e.lendingTarget,sub:'',amt:-(parseFloat(e.amount)||0),cCode})),
      ...cRetEpay.map(r=>({date:r.date,icon:'💰',label:'收回：'+(r.target||''),sub:'',amt:+(parseFloat(r.amount)||0),cCode})),
      ...cExps.map(e=>({date:e.date,icon:'📱',label:e.item,sub:e.category,amt:-(parseFloat(e.amount)||0),cCode})),
    ]);
  });
  allRows.sort((a,b)=>a.date.localeCompare(b.date));

  const rowsHTML = allRows.length ? `<div style="padding:4px 0">` + allRows.map(r=>`
    <div class="overview-row">
      <div><div class="overview-date">${formatDateSimple(r.date)}</div><div class="overview-label">${r.icon} ${r.label}</div>${r.sub?`<div class="overview-sub">${r.sub}</div>`:''}</div>
      <div style="text-align:right;font-size:13px;font-weight:700;color:${r.amt>=0?'var(--green)':'var(--red)'}">${r.amt>=0?'+':''}${fmt(Math.abs(r.amt))} ${r.cCode}</div>
    </div>`).join('') + `</div>` : `<div style="text-align:center;color:#aaa;padding:16px;font-size:13px">尚無電子支付記錄</div>`;

  const summaryHTML = Object.keys(summaryByCur).length ? `<div style="margin:8px 0;padding:10px 12px;background:#f0f9ff;border-radius:8px;font-size:12px">` +
    Object.entries(summaryByCur).map(([cCode,s])=>`
      <div style="display:flex;justify-content:space-between;margin-bottom:3px">
        <span style="color:#666">${cCode} 電子支付餘額</span>
        <span style="font-weight:700;color:${s.bal>=0?'var(--green)':'var(--red)'}">${fmt(s.bal)} ${cCode}</span>
      </div>`).join('') + `</div>` : '';

  return rowsHTML + summaryHTML;

}
