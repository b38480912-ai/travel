      s1Rows.push(['','','','','','','','','','','', d.desc||'', d.amount?parseFloat(d.amount):'']);
      s1Props.push({level:1, hidden:true});
    });
  });
  const ws1 = XLSX.utils.aoa_to_sheet([s1Header, ...s1Rows]);
  ws1['!cols'] = [10,22,8,6,10,8,14,10,10,14,20,24,10].map(w=>({wch:w}));
  ws1['!rows'] = s1Props;
  ws1['!freeze'] = {xSplit:0,ySplit:1};
  XLSX.utils.book_append_sheet(wb, ws1, '花費明細');

  // ── Sheet2：分類統計 ──
  const catMap={}, pmMap={}, ccStatMap={};
  allExps.filter(e=>e.category!=='金流').forEach(e=>{
    const cCode=currCode(e.currency||lc), pm=e.paymentMethod||'現金', cat=e.category||'其他';
    const amt=parseFloat(e.amount)||0;
    if(!catMap[cat]) catMap[cat]={};
    catMap[cat][cCode]=(catMap[cat][cCode]||0)+amt;
    if(!pmMap[pm]) pmMap[pm]={};
    pmMap[pm][cCode]=(pmMap[pm][cCode]||0)+amt;
    if(pm==='信用卡'){
      if(!ccStatMap[cCode]) ccStatMap[cCode]={total:0,billed:0,fee:0,pend:0};
      ccStatMap[cCode].total+=amt;
      const bt=e.billingType||(cCode===currCode(hc)?'domestic':'twd');
      const b=parseFloat(e.twdAmount||e.billingAmount||0);
      const f=b>0?Math.round(b*(parseFloat(e.feeRate||0))/100):0;
      if(bt==='domestic'){ccStatMap[cCode].billed+=amt;ccStatMap[cCode].fee+=Math.round(amt*(parseFloat(e.feeRate||0))/100);}
      else if(b>0){ccStatMap[cCode].billed+=b;ccStatMap[cCode].fee+=f;}
      else ccStatMap[cCode].pend++;
    }
  });
  const s2Rows = [['【分類統計】', ...tripCurCodes.map(c=>''), '']];
  s2Rows.push(['類別', ...tripCurCodes.map(c=>c+' 金額'), '備註']);
  Object.entries(catMap).sort((a,b)=>((b[1][currCode(lc)]||0)-(a[1][currCode(lc)]||0))).forEach(([cat,cm])=>{
    s2Rows.push([cat, ...tripCurCodes.map(c=>cm[c]||0), '']);
  });
  s2Rows.push(['', ...tripCurCodes.map(()=>''), ''], ['【付款方式統計】', ...tripCurCodes.map(c=>''), '']);
  s2Rows.push(['付款方式', ...tripCurCodes.map(c=>c+' 金額'), '']);
  Object.entries(pmMap).forEach(([pm,cm])=>s2Rows.push([pm, ...tripCurCodes.map(c=>cm[c]||0), '']));
  s2Rows.push(['', ...tripCurCodes.map(()=>''), ''], ['【信用卡消費統計】', ...tripCurCodes.map(c=>''), '']);
  s2Rows.push(['幣別', '刷卡消費', '換算請款(TWD)', '手續費(TWD)', '待請款筆數', '']);
  Object.entries(ccStatMap).forEach(([cCode,v])=>s2Rows.push([cCode, v.total, v.billed, v.fee, v.pend>0?(v.pend+'筆'):'全數已填', '']));
  const ws2 = XLSX.utils.aoa_to_sheet(s2Rows);
  ws2['!cols'] = [{wch:16}, ...tripCurCodes.map(()=>({wch:14})), {wch:12}];
  XLSX.utils.book_append_sheet(wb, ws2, '分類統計');

  // ── Sheet3：信用卡請款 ──
  const ccExps = allExps.filter(e=>e.paymentMethod==='信用卡');
  const s3Header = ['日期','項目','類別','幣別','刷卡金額','請款方式','請款金額(TWD)','手續費率(%)','手續費(TWD)','實際請款(TWD)','狀態'];
  const s3Rows = ccExps.map(e=>{
    const cCode=currCode(e.currency||lc);
    const bt=e.billingType||(cCode===currCode(hc)?'domestic':'twd');
    const btLabel=bt==='domestic'?'國內刷卡':bt==='original'?'維持原幣':'換算TWD';
    const b=bt==='domestic'?parseFloat(e.amount||0):parseFloat(e.twdAmount||e.billingAmount||0);
    const fr=parseFloat(e.feeRate||0), fee=b>0?Math.round(b*fr/100):0;
    return [e.date, e.item||'', e.category||'', cCode, parseFloat(e.amount)||0, btLabel,
      b||'', b>0?fr:'', b>0?fee:'', b>0?(b+fee):'', b>0?'✅已請款':'⏳待請款'];
  });
  const pend3 = ccExps.filter(e=>!parseFloat(e.twdAmount||e.billingAmount||0)).length;
  const tot3  = ccExps.reduce((s,e)=>{const b=parseFloat(e.twdAmount||e.billingAmount||0);return s+b+Math.round(b*(parseFloat(e.feeRate||0))/100);},0);
  s3Rows.push([],[`待請款 ${pend3} 筆`,'','','','','','','','',''],['TWD 請款總額',tot3,'','','','','','','','','']);
  const ws3 = XLSX.utils.aoa_to_sheet([s3Header, ...s3Rows]);
  ws3['!cols'] = [10,22,8,6,10,10,14,10,10,14,10].map(w=>({wch:w}));
  ws3['!freeze'] = {xSplit:0,ySplit:1};
  XLSX.utils.book_append_sheet(wb, ws3, '信用卡請款');

  // ── Sheet4：現金帳本 ──
  const cashLedger = (state.personalCashLedger||[]).filter(e=>e.tripId===tripId).sort((a,b)=>a.date.localeCompare(b.date));
  const cashExps   = allExps.filter(e=>e.paymentMethod==='現金');
  const lendRecs   = allExps.filter(e=>e.isLending);
  const retRecs    = allExps.filter(e=>e.isReturning);
  const epayToRecs = (state.personalEpayLedger||[]).filter(e=>e.tripId===tripId&&e.source==='現金');
  const s4Header = ['日期','類型','幣別','金額','備註/說明'];
  let s4Rows = [];
  const allCashRows = [
    ...cashLedger.map(r=>({date:r.date,type:'＋現金兌換',cur:currCode(r.currency||lc),amt:parseFloat(r.amount||0),note:r.note||''})),
    ...lendRecs.map(e=>({date:e.date,type:'📤借出：'+e.lendingTarget,cur:currCode(e.currency||lc),amt:-parseFloat(e.amount||0),note:e.notes||''})),
    ...retRecs.map(e=>({date:e.date,type:'💰收回：'+(e.lendingTarget||''),cur:currCode(e.currency||lc),amt:parseFloat(e.amount||0),note:e.notes||''})),
    ...epayToRecs.map(e=>({date:e.date,type:'📱儲值電子支付',cur:currCode(e.currency||lc),amt:-parseFloat(e.amount||0),note:e.note||''})),
    ...cashExps.filter(e=>e.category!=='金流').map(e=>({date:e.date,type:'－花費：'+e.item,cur:currCode(e.currency||lc),amt:-parseFloat(e.amount||0),note:e.notes||''})),
  ].sort((a,b)=>a.date.localeCompare(b.date));
  allCashRows.forEach(r=>s4Rows.push([r.date, r.type, r.cur, r.amt, r.note]));
  s4Rows.push([],[]);
  s4Rows.push(['【各幣別現金餘額匯總】','','','','']);

    const cSpend = cashExps.filter(e=>currCode(e.currency||lc)===cCode&&e.category!=='金流').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    const cLend = lendRecs.filter(e=>currCode(e.currency||lc)===cCode).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    const cRet  = retRecs.filter(e=>currCode(e.currency||lc)===cCode).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);

      const note = r.type==='儲值'&&r.source==='信用卡'&&r.twdAmount?('TWD '+r.twdAmount+(r.feeRate?'+手續費':'')):r.note||'';
      return {date:r.date, type:typeLabel, cur:currCode(r.currency||lc), amt, note};

}

function pfRerenderCC() {
  const e = state.personalForm;
  const lc = localCur(), hcR = habitCur();
  const isDom = (e.currency||lc) === hcR;

  else if (bt==='twd') { base = parseFloat(e.twdAmount||0); baseCur = hcR; }
  else { base = parseFloat(e.amount||0); baseCur = (e.currency||lc); }
  const fee = Math.round(base * parseFloat(e.feeRate||0) / 100);
  const el = document.getElementById('pf-fee-display');
  if (el) el.textContent = baseCur+' '+fmt(base)+' + '+fmt(fee)+' = '+fmt(base+fee);
}
function pfUploadAttach(input) {
  if (!state.personalForm) return;
  state.personalForm.attachments = state.personalForm.attachments||[];
  const files = Array.from(input.files);
  const remaining = 10 - state.personalForm.attachments.length;
  files.slice(0, remaining).forEach(file=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        let w=img.width, h=img.height;
        // 無損模式：只在超過 2400px 才縮
        const MAX = 2400;
        if (w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const compressed = canvas.toDataURL('image/jpeg', 0.95);
        try {
          state.personalForm.attachments.push(compressed);
          renderTab();
        } catch(err) {
          state.personalForm.attachments.pop();
          alert('⚠️ 儲存空間不足，無法上傳更多附件。');
        }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  if (files.length > remaining) alert(`最多10張，本次僅上傳前 ${remaining} 張。`);
}

function savePersonalExpense() {
  // 儲存前從 DOM 讀取所有欄位
  const dateEl    = document.getElementById('pf-date');
  const itemEl    = document.getElementById('pf-item');
  const amtEl     = document.getElementById('pf-amount');
  const notesEl   = document.querySelector('.form-card textarea');
  const catEl     = document.querySelector('.form-card select[onchange*="category"]');
  const payEl     = document.querySelector('.form-card select[onchange*="paymentMethod"]');
  const curEl     = document.querySelector('.form-card select[onchange*="currency=this"]');
  const lendCustomEl = document.getElementById('pf-lend-custom');
  const lendSourceEl = document.querySelector('input[name="lend-source"]:checked');
  const feeRateEl = document.querySelector('.pf-cc-section input[step="0.1"]');
  const billingEl = document.querySelector('.pf-cc-section input[type="number"]:not([step])');

  if (dateEl)   state.personalForm.date   = dateEl.value;
  if (itemEl)   state.personalForm.item   = itemEl.value;
  if (amtEl)    state.personalForm.amount = amtEl.value;
  if (notesEl)  state.personalForm.notes  = notesEl.value;
  if (catEl)    state.personalForm.category = catEl.value;
  if (payEl)    state.personalForm.paymentMethod = payEl.value;
  if (curEl)    state.personalForm.currency = curEl.value;
  if (billingEl) state.personalForm.twdAmount = billingEl.value;
  if (feeRateEl) state.personalForm.feeRate = feeRateEl.value;
  if (lendCustomEl && lendCustomEl.value.trim()) {
    state.personalForm.lendingTarget   = lendCustomEl.value.trim();
    state.personalForm.lendingIsCustom = true;
  }
  const billingTypeEl = document.querySelector('input[name="pf-billing-type"]:checked');
  if (billingTypeEl) state.personalForm.billingType = billingTypeEl.value;
  else if (!state.personalForm.billingType) {
    const _lc=localCur(), _hc=habitCur();
    state.personalForm.billingType = ((state.personalForm.currency||_lc)===_hc) ? 'domestic' : 'twd';
  }
  if (lendSourceEl) state.personalForm.lendingSource = lendSourceEl.value;

  const e = state.personalForm;
  if (!e.item?.trim()) return alert('請輸入花費項目名稱');
  if (!parseFloat(e.amount)) return alert('請輸入金額');
  if (e.isLending && !e.lendingTarget?.trim()) return alert('請填寫借出對象');
  // 金流類型一律強制保持 category='金流'（不論表單怎麼改）
  if (e.isLending || e.ledgerType) e.category = '金流';
  e.details = (e.details||[]).filter(d=>d.desc||d.amount);

  const record = {
    ...e,
    id: state.personalEditId || ('pe-'+Date.now()+'-'+Math.random().toString(36).slice(2)),
    tripId: state.currentTrip.id,
  };

  if (state.personalEditId) {
    const oldExp = state.personalExpenses.find(x=>x.id===state.personalEditId);

    // ── 同步更新對應帳本記錄 ──
    if (oldExp) {
      // 1. 入帳類型（現金兌換 / 電子支付儲值 / 收回借款）→ 同步更新帳本裡的對應記錄
      if (oldExp.ledgerRef) {
        const ref = oldExp.ledgerRef;
        // 現金帳本更新
        state.personalCashLedger = (state.personalCashLedger||[]).map(r => {
          if (r.id !== ref) return r;
          return { ...r, date: e.date, amount: parseFloat(e.amount)||r.amount, currency: e.currency||r.currency, note: e.notes||r.note };
        });
        // 電子支付帳本更新
        state.personalEpayLedger = (state.personalEpayLedger||[]).map(r => {
          if (r.id !== ref) return r;
          return { ...r, date: e.date, amount: parseFloat(e.amount)||r.amount, currency: e.currency||r.currency, note: e.notes||r.note };
        });
      }

      // 2. 借出類型 → 清除舊的帳本借出記錄
      if (oldExp.isLending) {
        const oldId = state.personalEditId;
        state.personalCashLedger = (state.personalCashLedger||[]).filter(r=>r.lendRef!==oldId&&r.id!=='lend-'+oldId);
        state.personalEpayLedger = (state.personalEpayLedger||[]).filter(r=>r.lendRef!==oldId&&r.id!=='lend-'+oldId);
      }
    }

    state.personalExpenses = state.personalExpenses.map(x => x.id===state.personalEditId ? record : x);
  } else {
    state.personalExpenses.unshift(record);
  }

  // 借出 → 同步寫入/更新帳本借出記錄
  if (e.isLending) {
    const lendRecord = {
      id: 'lend-'+record.id, lendRef: record.id,
      tripId: state.currentTrip.id,
      date: e.date, type: '借出',
      amount: parseFloat(e.amount),
      currency: e.currency||localCur(),
      target: e.lendingTarget, note: e.notes||'',
    };
    state.personalCashLedger = (state.personalCashLedger||[]).filter(r=>r.lendRef!==record.id);
    state.personalEpayLedger = (state.personalEpayLedger||[]).filter(r=>r.lendRef!==record.id);
    if (e.lendingSource === '電子支付') {
      state.personalEpayLedger.push(lendRecord);
    } else {
      state.personalCashLedger.push(lendRecord);
    }
  } else if (state.personalEditId) {
    // 若原本是借出，現在取消勾選 → 清除帳本借出記錄
    state.personalCashLedger = (state.personalCashLedger||[]).filter(r=>r.lendRef!==record.id);
    state.personalEpayLedger = (state.personalEpayLedger||[]).filter(r=>r.lendRef!==record.id);
  }

  state.personalForm = null;
  state.personalEditId = null;
  saveToStorage();
  renderTab();
}
function delPersonalExpense(id) {
  if (!confirm('確定要刪除這筆花費嗎？')) return;
  const exp = state.personalExpenses.find(e=>e.id===id);

    if (exp.isLending) {
      state.personalCashLedger = (state.personalCashLedger||[]).filter(r=>r.lendRef!==id&&r.id!=='lend-'+id);
      state.personalEpayLedger = (state.personalEpayLedger||[]).filter(r=>r.lendRef!==id&&r.id!=='lend-'+id);

    // 刪除入帳記錄（現金兌換/電子支付儲值/收回）→ 清除帳本對應項
    if (exp.ledgerRef) {
      state.personalCashLedger = (state.personalCashLedger||[]).filter(r=>r.id!==exp.ledgerRef);
      state.personalEpayLedger = (state.personalEpayLedger||[]).filter(r=>r.id!==exp.ledgerRef);

  }
  state.personalExpenses = state.personalExpenses.filter(e=>e.id!==id);
  saveToStorage();
  renderTab();
}

    <div style="display:flex;gap:20px;margin-bottom:12px">
      <div style="flex:1"><div class="detail-label">日期</div><div class="detail-value">${e.date}</div></div>
      <div style="flex:1"><div class="detail-label">付款方式</div><div class="detail-value">${e.paymentMethod}</div></div>
    </div>
    <div class="detail-label">金額</div>
    <div class="detail-value" style="font-size:22px;font-weight:700;color:var(--red);margin-bottom:12px">${e.currency||lc} ${fmt(e.amount)}</div>
    ${ccHTML}
    ${detailHTML}
    ${giftHTML}
    ${attachHTML}
    <div class="detail-label">備註</div>
    <div style="background:#f9fafb;padding:12px;border-radius:8px;font-size:14px;color:var(--text);margin-bottom:20px">${(e.notes||'無').replace(/\n/g,'<br>')}</div>
    <div class="flex-row">
      ${state.modalBackFn?`<button class="btn btn-secondary" style="flex:1" onclick="state.modalBackFn&&state.modalBackFn()">← 返回</button>`:`<button class="btn btn-secondary" style="flex:1" onclick="closeModal()">關閉</button>`}
      <button class="btn btn-outline" style="flex:1" onclick="editPersonalExpense('${e.id}')">✏️ 修改</button>
      <button class="btn" style="flex:1;background:var(--red-light);color:var(--red);border:none" onclick="delPersonalExpense('${e.id}');closeModal()">🗑️ 刪除</button>
    </div>`;
  showModal(html);
}
function pfDetailViewAttach(expId, idx) {
  const e = state.personalExpenses.find(x=>x.id===expId);
  if (!e) return;
  openPhotoFullscreen(e.attachments||[], idx);
}
function editPersonalExpense(id) {
  const e = state.personalExpenses.find(x => x.id === id);
  if (!e) return;
  state.personalForm = { ...e };
  state.personalEditId = id;
  closeModal();
  renderTab();
  setTimeout(() => {
    const form = document.querySelector('#detail-content .form-card');
    if (form) form.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}
function setPersonalFilter(type, val) {
  if (type === 'cat')    state.personalFilterCat  = val;
  if (type === 'date')   state.personalFilterDate = val;
  if (type === 'search') state.personalSearchTerm = val;
  if (type === 'cat' || type === 'date') renderTab();
}

// ===== FIREBASE =====
const FIREBASE_URL = 'https://travel-198a3-default-rtdb.firebaseio.com/travelapp';

async function saveToStorage() {
  try {
    const data = { trips: state.trips, expenses: state.expenses, personalExpenses: state.personalExpenses, schedule: state.schedule, dayMemos: state.dayMemos, personalCashLedger: state.personalCashLedger, personalEpayLedger: state.personalEpayLedger };
    await fetch(`${FIREBASE_URL}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  } catch(e) { console.warn('Firebase 儲存失敗', e); }
}

async function loadFromStorage() {
  showLoadingScreen(true);
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 8000);
    const res = await fetch(`${FIREBASE_URL}.json`, { signal: controller.signal });
    clearTimeout(timeoutId);
    const data = await res.json();
    if (data && typeof data === 'object') {
      if (Array.isArray(data.trips))            state.trips            = data.trips;
      if (Array.isArray(data.expenses))         state.expenses         = data.expenses;
      if (Array.isArray(data.personalExpenses)) state.personalExpenses = data.personalExpenses;
      if (Array.isArray(data.personalCashLedger)) state.personalCashLedger = data.personalCashLedger;
      if (Array.isArray(data.personalEpayLedger)) state.personalEpayLedger = data.personalEpayLedger;
      if (data.schedule && typeof data.schedule === 'object') state.schedule = data.schedule;
      if (data.dayMemos && typeof data.dayMemos === 'object') state.dayMemos = data.dayMemos;
    }
  } catch(e) { console.warn('Firebase 讀取失敗或逾時', e.name, e.message); }
  showLoadingScreen(false);
  renderMemberInputs();
  renderTrips();
}

function showLoadingScreen(show) {
  document.getElementById('loading-screen').style.display = show ? 'flex' : 'none';
  document.getElementById('app').style.display = show ? 'none' : 'block';
}

loadFromStorage();
</script>
