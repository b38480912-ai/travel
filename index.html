function initLeafletMap() {
  const mapEl = document.getElementById('leaflet-map');
  if (!mapEl) return;
  // 銷毀舊地圖
  if (_leafletMap) { _leafletMap.remove(); _leafletMap = null; }
  _leafletMarkers = [];
  _selectedMarkerId = null;
  _leafletMap = L.map('leaflet-map', { zoomControl: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 19
  }).addTo(_leafletMap);
  const items = getAllItinItems().filter(x=>x.coord);
  if (!items.length) {
    // 沒有座標：顯示預設位置
    _leafletMap.setView([25, 121], 10);
    setTimeout(initMapLongPress, 100);
    return;
  }
  const bounds = [];
  items.forEach(item => {
    const { lat, lng } = item.coord;
    bounds.push([lat, lng]);
    const markerEl = document.createElement('div');
    markerEl.className = 'map-marker';
    markerEl.innerHTML = getTypeEmoji(item.type);
    markerEl.id = `map-marker-${item.id}`;
    const icon = L.divIcon({ html: markerEl, className: '', iconSize: [36,36], iconAnchor: [18,18] });
    const marker = L.marker([lat, lng], { icon })
      .addTo(_leafletMap)
      .bindPopup(`<b>${item.title}</b><br>Day ${item.dayIdx+1} · ${item.time||'--:--'}<br>${item.location||''}`, { maxWidth: 200 });
    marker._itinId = item.id;
    marker.on('click', () => {
      highlightListItem(item.id);
    });
    _leafletMarkers.push(marker);
  });
  _leafletMap.fitBounds(bounds, { padding: [30, 30] });
  // 初始化長按選單
  setTimeout(initMapLongPress, 100);
}

function focusMapMarker(itemId) {
  if (!_leafletMap) return;
  // 取消選取高亮
  _leafletMarkers.forEach(m => {
    const el = document.getElementById(`map-marker-${m._itinId}`);
    if (el) el.className = 'map-marker';
  });
  // 找目標
  const marker = _leafletMarkers.find(m=>m._itinId==itemId);
  if (!marker) return;
  // 放大選中圖標
  const el = document.getElementById(`map-marker-${itemId}`);
  if (el) el.className = 'map-marker big';
  // 地圖移動並開啟 popup
  _leafletMap.flyTo(marker.getLatLng(), 16, { duration: 0.8 });
  setTimeout(()=>marker.openPopup(), 850);
  // 高亮列表項目
  highlightListItem(itemId);
  _selectedMarkerId = itemId;
}

function highlightListItem(itemId) {
  document.querySelectorAll('.map-item').forEach(el=>el.classList.remove('selected'));
  const el = document.getElementById(`map-list-item-${itemId}`);
  if (el) {
    el.classList.add('selected');
    el.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }
}

function checkMapUrlCoord(inputId, hintId) {
  const url = document.getElementById(inputId).value.trim();
  const hint = document.getElementById(hintId);
  if (!hint) return;
  if (!url) { hint.textContent = ''; return; }
  const coord = parseLatLngFromUrl(url);
  if (coord) {
    hint.style.color = '#10b981';
    hint.textContent = `✅ 已取得座標 (${coord.lat.toFixed(4)}, ${coord.lng.toFixed(4)})，可顯示於地圖`;
  } else {
    hint.style.color = '#f59e0b';
    hint.textContent = '⚠️ 無法解析座標，請貼上含有 @ 符號的完整 Google Maps 連結';
  }
}

// 定位到我的位置
let _myLocationMarker = null;
function locateMe() {
  if (!_leafletMap) return;
  if (!navigator.geolocation) return alert('您的瀏覽器不支援定位功能');
  const btn = document.querySelector('.map-locate-btn');
  if (btn) btn.textContent = '⏳';
  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude: lat, longitude: lng } = pos.coords;
      // 移除舊的位置圖標
      if (_myLocationMarker) { _myLocationMarker.remove(); _myLocationMarker = null; }
      // 建立藍色脈衝圖標
      const el = document.createElement('div');
      el.className = 'map-my-location';
      const icon = L.divIcon({ html: el, className: '', iconSize: [18,18], iconAnchor: [9,9] });
      _myLocationMarker = L.marker([lat, lng], { icon, zIndexOffset: 1000 })
        .addTo(_leafletMap)
        .bindPopup('📍 我的目前位置');
      _leafletMap.flyTo([lat, lng], 16, { duration: 1 });
      if (btn) btn.textContent = '📍';
    },
    err => {
      if (btn) btn.textContent = '📍';
      if (err.code === 1) alert('請允許瀏覽器取得位置權限');
      else alert('無法取得您的位置，請確認定位功能已開啟');
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// 長按選單
let _longPressTimer = null;
let _longPressMenuEl = null;
let _touchStartY = 0;
let _touchMoved = false;

function initMapLongPress() {
  const container = document.getElementById('map-list-container');
  if (!container) return;
  const removeLongPressMenu = () => {
    if (_longPressMenuEl) { _longPressMenuEl.remove(); _longPressMenuEl = null; }
  };

  container.addEventListener('touchstart', e => {
    _touchMoved = false;
    _touchStartY = e.touches[0].clientY;
    const item = e.target.closest('.map-item:not(.no-coord)');
    if (!item) return;
    const touch = e.touches[0];
    const startX = touch.clientX;
    const startY = touch.clientY;
    clearTimeout(_longPressTimer);
    _longPressTimer = setTimeout(() => {
      if (_touchMoved) return; // 有滑動就不觸發長按
      const itemId = item.dataset.itemId;
      const allItems = getAllItinItems();
      const found = allItems.find(x=>x.id==itemId);
      if (!found || !found.coord) return;
      removeLongPressMenu();
      // 震動回饋（支援的裝置）
      if (navigator.vibrate) navigator.vibrate(40);
      showLongPressMenu(startX, startY, found);
    }, 500);
  }, { passive: true }); // 保持 passive:true 讓滑動順暢

  container.addEventListener('touchmove', e => {
    const dy = Math.abs(e.touches[0].clientY - _touchStartY);
    if (dy > 8) { _touchMoved = true; clearTimeout(_longPressTimer); }
  }, { passive: true });

  container.addEventListener('touchend', e => {
    clearTimeout(_longPressTimer);
    // 短按：觸發 focusMapMarker
    if (!_touchMoved && !_longPressMenuEl) {
      const item = e.target.closest('.map-item');
      if (!item) return;
      const hasCoord = item.dataset.hasCoord === 'true';
      const itemId = item.dataset.itemId;
      if (hasCoord) focusMapMarker(itemId);
      else showNoCoordTip();
    }
  }, { passive: true });

  document.addEventListener('touchstart', e => {
    if (_longPressMenuEl && !_longPressMenuEl.contains(e.target)) removeLongPressMenu();
  }, { passive: true });
}

function showLongPressMenu(x, y, item) {
  _longPressMenuEl = document.createElement('div');
  _longPressMenuEl.className = 'longpress-menu';
  // 確保選單不超出螢幕
  const menuX = Math.min(x, window.innerWidth - 180);
  const menuY = Math.min(y, window.innerHeight - 120);
  _longPressMenuEl.style.cssText = `left:${menuX}px;top:${menuY}px`;
  _longPressMenuEl.innerHTML = `
    <div class="longpress-menu-item" onclick="setMapNavPoint('origin',${JSON.stringify(item).replace(/"/g,"'")})">
      📍 設為出發地
    </div>
    <div class="longpress-menu-item" onclick="setMapNavPoint('dest',${JSON.stringify(item).replace(/"/g,"'")})">
      🎯 設為目的地
    </div>`;
  document.body.appendChild(_longPressMenuEl);
}

function setMapNavPoint(type, item) {
  if (_longPressMenuEl) { _longPressMenuEl.remove(); _longPressMenuEl = null; }
  if (type === 'origin') {
    state.mapNavOrigin = { id: item.id, title: item.title, coord: item.coord };
  } else {
    state.mapNavDest = { id: item.id, title: item.title, coord: item.coord };
  }
  // 重新渲染地圖頁（保留地圖）
  const c = document.getElementById('detail-content');
  c.innerHTML = renderMapPage();
  requestAnimationFrame(initLeafletMap);
}

function clearMapNav() {
  state.mapNavOrigin = null;
  state.mapNavDest = null;
  const c = document.getElementById('detail-content');
  c.innerHTML = renderMapPage();
  requestAnimationFrame(initLeafletMap);
}

function openMapNav(mode) {
  if (!state.mapNavOrigin || !state.mapNavDest) return;
  const o = state.mapNavOrigin.coord;
  const d = state.mapNavDest.coord;
  // 使用 Google Maps Directions API 格式，確保 travelmode 正確傳遞
  const url = `https://www.google.com/maps/dir/?api=1&origin=${o.lat},${o.lng}&destination=${d.lat},${d.lng}&travelmode=${mode}`;
  window.open(url, '_blank');
}

function useMyLocationAsNavPoint() {
  if (!navigator.geolocation) return alert('您的瀏覽器不支援定位功能');
  // 顯示自訂選單讓使用者選擇
  if (_longPressMenuEl) { _longPressMenuEl.remove(); _longPressMenuEl = null; }
  const btn = document.querySelector('.map-nav-use-loc-btn');
  const rect = btn ? btn.getBoundingClientRect() : { left: window.innerWidth/2 - 80, top: window.innerHeight/2 };
  _longPressMenuEl = document.createElement('div');
  _longPressMenuEl.className = 'longpress-menu';
  const menuX = Math.min(rect.left, window.innerWidth - 180);
  const menuY = Math.max(rect.top - 110, 60);
  _longPressMenuEl.style.cssText = `left:${menuX}px;top:${menuY}px`;
  _longPressMenuEl.innerHTML = `
    <div style="padding:10px 18px 6px;font-size:11px;color:#aaa;font-weight:700">用目前位置設為</div>
    <div class="longpress-menu-item" onclick="doLocateAsNavPoint('origin')">📍 出發地</div>
    <div class="longpress-menu-item" onclick="doLocateAsNavPoint('dest')">🎯 目的地</div>`;
  document.body.appendChild(_longPressMenuEl);
}

function doLocateAsNavPoint(targetType) {
  if (_longPressMenuEl) { _longPressMenuEl.remove(); _longPressMenuEl = null; }
  const btn = document.querySelector('.map-nav-use-loc-btn');
  if (btn) btn.textContent = '⏳ 定位中...';
  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude: lat, longitude: lng } = pos.coords;
      const locObj = { id: 'myloc', title: '我的目前位置', coord: { lat, lng } };
      if (targetType === 'origin') state.mapNavOrigin = locObj;
      else state.mapNavDest = locObj;
      // 同步在地圖上顯示藍點
      if (_leafletMap) {
        if (_myLocationMarker) { _myLocationMarker.remove(); _myLocationMarker = null; }
        const el = document.createElement('div');
        el.className = 'map-my-location';
        const icon = L.divIcon({ html: el, className: '', iconSize: [18,18], iconAnchor: [9,9] });
        _myLocationMarker = L.marker([lat, lng], { icon, zIndexOffset: 1000 })
          .addTo(_leafletMap).bindPopup('📍 我的目前位置');
      }
      const c = document.getElementById('detail-content');
      c.innerHTML = renderMapPage();
      requestAnimationFrame(initLeafletMap);
    },
    err => {
      if (btn) btn.textContent = '📍 用目前位置設定出發地或目的地';
      if (err.code === 1) alert('請允許瀏覽器取得位置權限');
      else alert('無法取得您的位置，請確認定位功能已開啟');
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function showNoCoordTip() {
  alert('此行程尚未設定地圖座標\n請到行程頁面編輯，貼上完整的 Google Maps 連結即可顯示於地圖上。');
}

// ===== 行程頁面 =====
const ITIN_TYPES = [
  {key:'food', emoji:'🍽️', label:'餐廳'},
  {key:'transport', emoji:'🚌', label:'交通'},
  {key:'hotel', emoji:'🏨', label:'住宿'},
  {key:'attraction', emoji:'🎡', label:'景點'},
  {key:'shopping', emoji:'🛒', label:'購物'},
  {key:'other', emoji:'📌', label:'其他'},
];
function getTypeEmoji(key) {
  const t = ITIN_TYPES.find(x=>x.key===key);
  return t ? t.emoji : '📌';
}
function getDayCostSummary(tripId, dayDate) {
  const t = state.currentTrip;
  if (!t) return '';
  const dayExps = state.expenses.filter(e => e.tripId === tripId && e.date === dayDate && e.accountType !== '收入');
  if (!dayExps.length) return '';
  // 按幣別分組
  const byC = {};
  dayExps.forEach(e => {
    const c = e.currency || t.localCurrency;
    byC[c] = (byC[c]||0) + (parseFloat(e.amount)||0);
  });
  return Object.entries(byC).map(([c,a])=>`${c} ${a.toLocaleString()}`).join(' / ');
}
function toggleDayCollapse(key) {
  state.dayCollapsed[key] = !state.dayCollapsed[key];
  renderTab();
}


function editDayMemo(key) {
  const t = state.currentTrip;
  const dayIdx = parseInt(key.split('-')[1]);
  const currentMemo = state.dayMemos[key] || '';
  const inputMemo = prompt(`請輸入 Day ${dayIdx+1} 的專屬小叮嚀：\n(例如：氣溫驟降，記得帶厚外套！)`, currentMemo);
  if (inputMemo !== null) {
    state.dayMemos[key] = inputMemo.trim();
    saveToStorage();
    renderTab();
  }
}

async function moveItinToDay(key, itemId) {
  const items = state.schedule[key]||[];
  const itemToMove = items.find(x=>x.id==itemId);
  if (!itemToMove) return;
  
  const t = state.currentTrip;
  const days = parseInt(t.days)||1;
  const dayOpts = Array.from({length:days},(_,i)=>{
    const d = getDayDate(t.startDate,i);
    const curKey = `${t.id}-${i}`;
    return `<option value="${curKey}" ${curKey===key?'selected':''}>Day ${i+1}（${d}）</option>`;
  }).join('');
  
  const html = `<div class="modal-header"><span class="modal-title">➡️ 移動行程到其他天</span><button class="close-btn" onclick="openItinDetail('${key}',${itemId})">✕</button></div>

    <div class="input-group"><label class="lbl">選擇目標天數</label><select id="move-target-day">${dayOpts}</select></div>

      <button class="btn btn-secondary" style="flex:1" onclick="openItinDetail('${key}',${itemId})">取消</button>

}

async function executeMoveItin(srcKey, itemId) {
  const items = state.schedule[srcKey]||[];
  const itemIdx = items.findIndex(x=>x.id==itemId);
  if (itemIdx < 0) return;
  
  const targetKey = document.getElementById('move-target-day').value;
  if (srcKey === targetKey) {
    openItinDetail(srcKey, itemId);
    return;
  }
  
  const [itemToMove] = items.splice(itemIdx, 1);
  const targetItems = state.schedule[targetKey] || [];
  
  targetItems.push(itemToMove);
  targetItems.sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  state.schedule[targetKey] = targetItems;
  state.dayCollapsed[targetKey] = false;
  
  await saveToStorage();
  closeModal();
  renderTab();
}

  targetItems.push(newItem);
  targetItems.sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  state.schedule[targetKey] = targetItems;

function toggleBatchMode() {
  state.isBatchMode = !state.isBatchMode;
  state.batchSelectedItems = [];
  renderTab();
}

function toggleBatchSelect(key, itemId) {
  if (!state.isBatchMode) return;
  const idStr = key + '_' + itemId;
  const idx = state.batchSelectedItems.findIndex(x => x.idStr === idStr);
  if (idx >= 0) state.batchSelectedItems.splice(idx, 1);
  else state.batchSelectedItems.push({ key: key, itemId: itemId, idStr: idStr });
  renderTab();
}

async function executeBatchCopy() {
  if (state.batchSelectedItems.length === 0) return alert('請先選擇要複製的行程！');
  const targetKey = document.getElementById('batch-target-day').value;

  state.batchSelectedItems.forEach(sel => {
    const itemToCopy = state.schedule[sel.key]?.find(x => x.id === sel.itemId);
    if (itemToCopy) {
      const newItem = JSON.parse(JSON.stringify(itemToCopy));
      newItem.id = Date.now() + Math.floor(Math.random()*10000);
      if (!state.schedule[targetKey]) state.schedule[targetKey] = [];
      state.schedule[targetKey].push(newItem);
    }
  });

  if (state.schedule[targetKey]) {
    state.schedule[targetKey].sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  }

  state.dayCollapsed[targetKey] = false;
  state.isBatchMode = false;
  state.batchSelectedItems = [];

  await saveToStorage();
  renderTab();
}
async function executeBatchMove() {
  if (state.batchSelectedItems.length === 0) return alert('請先選擇要移動的行程！');
  const targetKey = document.getElementById('batch-target-day').value;

  state.batchSelectedItems.forEach(sel => {
    if (sel.key === targetKey) return; // 本來就在這天，略過
    const itemIdx = state.schedule[sel.key].findIndex(x => x.id === sel.itemId);
    if (itemIdx >= 0) {
      const [item] = state.schedule[sel.key].splice(itemIdx, 1);
      if (!state.schedule[targetKey]) state.schedule[targetKey] = [];
      state.schedule[targetKey].push(item);
    }
  });

  if (state.schedule[targetKey]) {
    state.schedule[targetKey].sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  }

  state.dayCollapsed[targetKey] = false; // 自動展開目標天
  state.isBatchMode = false;
  state.batchSelectedItems = [];

  await saveToStorage();
  renderTab();
}

    '<button class="btn btn-outline" style="padding: 6px 14px; width: auto; font-size: 13px; font-weight:600; border-radius: 20px; border:1px solid ' + (state.isBatchMode ? '#bae6fd' : '#d1d5db') + '!important; background:' + (state.isBatchMode ? '#e0f2fe' : '#ffffff') + '; color:' + (state.isBatchMode ? '#0369a1' : '#4b5563') + '; box-shadow:0 1px 2px rgba(0,0,0,0.05); transition:all 0.2s;" onclick="toggleBatchMode()">' +

  '</div>';

    const rawDate = getRawDayDate(t.startDate, i);

    const dayMemo = state.dayMemos[key] || '';
    
    if (state.dayCollapsed[key] === undefined) {
      state.dayCollapsed[key] = !isToday;

    const collapsed = state.dayCollapsed[key];
    const costSum = getDayCostSummary(t.id, rawDate);
    
    html += '<div style="margin-bottom: 30px;">';
    
    html += '<div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; padding:0 4px; cursor:pointer; user-select:none;" onclick="toggleDayCollapse(\'' + key + '\')">' +

      '</div>' +
      '<div style="display:flex; flex-direction:column; align-items:flex-end; gap:10px; padding-top:4px;">' +

          (costSum ? '<span style="font-size:13px; font-weight:700; color:var(--purple); background:var(--purple-light); padding:4px 10px; border-radius:12px;">💰 ' + costSum + '</span>' : '') +

function openItinEdit(key, itemId) {
  const items = state.schedule[key]||[];
  const item = items.find(x=>x.id==itemId);
  if (!item) return;
  const t = state.currentTrip;
  // key 格式為 tripId-dayIdx，tripId 本身可能含 '-'，所以用 tripId 長度來截取
  const dayIdx = parseInt(key.substring(t.id.toString().length + 1));
  const dayDate = getDayDate(t.startDate, dayIdx);
  state._editVoucherImg = item.voucherImg || null;
  document.getElementById('modal-content').innerHTML = renderItinDetailHTML(key, item, dayDate, true);
}

function itinSetType(key, itemId, typeKey, btn) {
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
}

async function saveItinEdit(key, itemId) {
  const items = state.schedule[key]||[];
  const item = items.find(x=>x.id==itemId);
  if (!item) return;
  const title = document.getElementById('ei-title').value.trim();
  if (!title) return alert('請輸入行程名稱');
  const selectedTypeBtn = document.querySelector('.type-btn.selected');
  item.time = document.getElementById('ei-time').value;
  item.endTime = document.getElementById('ei-endTime').value;
  item.title = title;
  if (selectedTypeBtn) {
    const label = selectedTypeBtn.textContent.trim().split(' ').slice(1).join(' ');
    const found = ITIN_TYPES.find(tp=>tp.label===label);
    if (found) item.type = found.key;
  }
  item.location = document.getElementById('ei-location').value.trim();
  const newMapsUrl = document.getElementById('ei-maps').value.trim();
  item.mapsUrl = newMapsUrl;
  item.coord = parseLatLngFromUrl(newMapsUrl);
  item.notes = document.getElementById('ei-notes').value.trim();
  item.voucher = document.getElementById('ei-voucher').value.trim();
  item.voucherImg = state._editVoucherImg;
  item.isPrepaid = document.getElementById('ei-isPrepaid').checked;
  
  const newKey = document.getElementById('ei-day').value;
  if (newKey !== key) {
    state.schedule[key] = items.filter(x=>x.id!==itemId);
    const targetItems = state.schedule[newKey]||[];
    targetItems.push(item);
    targetItems.sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    state.schedule[newKey] = targetItems;
    state.dayCollapsed[newKey] = false;
  } else {
    items.sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  }
  await saveToStorage(); closeModal(); renderTab();
}

function itinUploadPhotos(key, itemId, input) {
  const items = state.schedule[key]||[];
  const item = items.find(x=>x.id==itemId);
  if (!item) return;
  item.photos = item.photos||[];
  const files = Array.from(input.files);
  const remaining = 10 - item.photos.length;
  files.slice(0,remaining).forEach(file=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        let w=img.width, h=img.height;
        const MAX=1200;
        if (w>MAX||h>MAX) { if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;} }
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const compressed = canvas.toDataURL('image/jpeg', 0.82);
        // 檢查 localStorage 空間
        try {
          item.photos.push(compressed);
          saveToStorage();
          const t=state.currentTrip;
          const dayIdx=parseInt(key.substring(t.id.toString().length+1));
          const dayDate=getDayDate(t.startDate,dayIdx);
          document.getElementById('modal-content').innerHTML = renderItinDetailHTML(key,item,dayDate,true);
        } catch(err) {
          item.photos.pop();
          alert('⚠️ 儲存空間不足，無法上傳更多照片。請刪除部分照片後再試。');
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
  if (files.length > remaining) alert(`每個行程最多上傳10張照片，本次僅上傳了前 ${remaining} 張。`);
}

function itinDelPhoto(key, itemId, idx) {
  const items = state.schedule[key]||[];
  const item = items.find(x=>x.id==itemId);
  if (!item) return;
  item.photos.splice(idx,1);
  saveToStorage();
  const t=state.currentTrip;
  const dayIdx=parseInt(key.substring(t.id.toString().length+1));
  const dayDate=getDayDate(t.startDate,dayIdx);
  document.getElementById('modal-content').innerHTML = renderItinDetailHTML(key,item,dayDate,true);
}

function openPhotoFullscreen(photos, startIdx) {
  let idx = startIdx;
  const show = (i) => {
    idx = i;
    const fs = document.getElementById('photo-fullscreen-wrap');
    if (!fs) return;
    fs.querySelector('.photo-fs-img').src = photos[i];
    fs.querySelector('.photo-fs-counter').textContent = `${i+1} / ${photos.length}`;
    fs.querySelectorAll('.photo-fs-dot').forEach((d,di)=>d.classList.toggle('active',di===i));
  };
  const dots = photos.map((_,i)=>`<div class="photo-fs-dot ${i===startIdx?'active':''}" onclick="(function(){document.getElementById('photo-fullscreen-wrap').querySelectorAll('.photo-fs-dot').forEach((d,di)=>d.classList.toggle('active',di===${i}));document.getElementById('photo-fullscreen-wrap').querySelector('.photo-fs-img').src='${photos[i]}';document.getElementById('photo-fullscreen-wrap').querySelector('.photo-fs-counter').textContent='${i+1} / ${photos.length}'})()"></div>`).join('');
  const wrap = document.createElement('div');
  wrap.id = 'photo-fullscreen-wrap';
  wrap.className = 'photo-fullscreen';
  wrap.innerHTML = `
    <div class="photo-fs-counter">${startIdx+1} / ${photos.length}</div>
    <img class="photo-fs-img" src="${photos[startIdx]}" alt="">
    <button class="photo-fs-close" onclick="document.getElementById('photo-fullscreen-wrap').remove()">✕</button>
    <div class="photo-fs-nav">${dots}</div>`;
  document.body.appendChild(wrap);
  // 左右滑動切換
  let startX = 0;
  wrap.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; }, {passive:true});
  wrap.addEventListener('touchend', e=>{
    const diff = e.changedTouches[0].clientX - startX;
    if (Math.abs(diff)>50) {
      const newIdx = diff<0 ? Math.min(idx+1,photos.length-1) : Math.max(idx-1,0);
      show(newIdx);
    }
  });
}

function uploadVoucherImg(input, mode) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height, MAX = 1600; // Higher max size for QR readability
      if(w > MAX || h > MAX) {
        if(w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const compressed = canvas.toDataURL('image/jpeg', 0.9); // Better quality
      if (mode === 'new') {
        state._newVoucherImg = compressed;
        const p = document.getElementById('m-voucher-preview');
        p.style.display = 'flex';
        p.querySelector('img').src = compressed;
      } else {
        state._editVoucherImg = compressed;
        const p = document.getElementById('ei-voucher-preview');
        p.style.display = 'flex';
        p.querySelector('img').src = compressed;
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function removeVoucherImg(mode) {
  if (mode === 'new') {
    state._newVoucherImg = null;
    document.getElementById('m-voucher-preview').style.display = 'none';
  } else {
    state._editVoucherImg = null;
    document.getElementById('ei-voucher-preview').style.display = 'none';
  }
}

function newItinUploadPhotos(input) {
  state._newItinPhotos = state._newItinPhotos||[];
  const files = Array.from(input.files);
  const remaining = 10 - state._newItinPhotos.length;
  files.slice(0, remaining).forEach(file=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        let w=img.width, h=img.height, MAX=1200;
        if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        state._newItinPhotos.push(canvas.toDataURL('image/jpeg',0.82));
        // 更新預覽
        const grid = document.getElementById('new-itin-photo-grid');
        if (!grid) return;
        grid.innerHTML = state._newItinPhotos.map((p,idx)=>`
          <div class="photo-thumb-wrap">
            <img src="${p}" alt="">
            <button class="photo-del-btn" onclick="state._newItinPhotos.splice(${idx},1);newItinRefreshGrid()">✕</button>
          </div>`).join('') +
          (state._newItinPhotos.length<10?`<div class="photo-add-btn" onclick="document.getElementById('new-itin-photo-inp').click()"><span>＋</span>新增照片</div>`:'');
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
  if (files.length>remaining) alert(`最多10張，本次僅上傳前 ${remaining} 張。`);
}

function newItinRefreshGrid() {
  const grid = document.getElementById('new-itin-photo-grid');
  if (!grid) return;
  grid.innerHTML = (state._newItinPhotos||[]).map((p,idx)=>`
    <div class="photo-thumb-wrap">

      <button class="photo-del-btn" onclick="state._newItinPhotos.splice(${idx},1);newItinRefreshGrid()">✕</button>

async function saveSchedule(key) {
  const title = document.getElementById('m-title').value.trim();
  if (!title) return alert('請輸入行程名稱');
  const selectedBtn = document.querySelector('.type-btn.selected');
  const typeKey = selectedBtn ? selectedBtn.textContent.trim().split(' ')[1] : '';
  const selectedType = ITIN_TYPES.find(t=>t.label===typeKey)||ITIN_TYPES[3];
  const items = state.schedule[key]||[];
  const mapsUrl = document.getElementById('m-maps').value.trim();
  items.push({
    id: Date.now(),
    type: selectedType.key,
    time: document.getElementById('m-time').value,
    endTime: document.getElementById('m-endTime').value,
    title,
    location: document.getElementById('m-location').value.trim(),
    mapsUrl,
    coord: parseLatLngFromUrl(mapsUrl),
    notes: document.getElementById('m-notes').value.trim(),
    voucher: document.getElementById('m-voucher').value.trim(),
    voucherImg: state._newVoucherImg,
    isPrepaid: document.getElementById('m-isPrepaid').checked,
    photos: state._newItinPhotos||[],
    done: false,
  });
  state._newItinPhotos = []; state._newVoucherImg = null;
  items.sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  state.schedule[key] = items;
  state.dayCollapsed[key] = false;
  closeModal();
  await saveToStorage();
  renderTab();
}

async function delSchedule(key, itemId) {
  state.schedule[key] = (state.schedule[key]||[]).filter(x=>x.id!==itemId);
  await saveToStorage(); renderTab();
}

async function confirmDelSchedule(key, itemId) {
  if (!confirm('確定要刪除這個行程嗎？')) return;
  state.schedule[key] = (state.schedule[key]||[]).filter(x=>x.id!=itemId);
  await saveToStorage(); closeModal(); renderTab();
}

function hasActiveFilter() {
  return state.filterMembers.length > 0 || state.filterCategories.length > 0 || state.filterDateFrom || state.filterDateTo;
}

function clearAllFilters() {
  state.filterMembers = [];
  state.filterCategories = [];
  state.filterDateFrom = '';
  state.filterDateTo = '';
  refreshFilterPanel();
}

function toggleFilterMember(m) {
  const idx = state.filterMembers.indexOf(m);
  if (idx >= 0) state.filterMembers.splice(idx, 1);
  else state.filterMembers.push(m);
  refreshFilterPanel();
}

function toggleFilterCategory(c) {
  const idx = state.filterCategories.indexOf(c);
  if (idx >= 0) state.filterCategories.splice(idx, 1);
  else state.filterCategories.push(c);
  refreshFilterPanel();
}

function setFilterDayQuick(date) {
  // 如果已選同一天就取消
  if (state.filterDateFrom === date && state.filterDateTo === date) {
    state.filterDateFrom = '';
    state.filterDateTo = '';
  } else {
    state.filterDateFrom = date;
    state.filterDateTo = date;
  }
  refreshFilterPanel();
}

function handleFilterDateFrom(v) {
  state.filterDateFrom = v;
  refreshFilterPanel();
}

function handleFilterDateTo(v) {
  state.filterDateTo = v;
  refreshFilterPanel();
}

function toggleFilterPanel() {
  state.filterPanelOpen = !state.filterPanelOpen;
  const panel = document.getElementById('filter-panel');
  const btn = document.getElementById('filter-toggle-btn');
  if (panel) panel.style.display = state.filterPanelOpen ? 'block' : 'none';
  if (btn) {
    const active = hasActiveFilter();
    btn.className = 'search-filter-btn' + (active ? ' has-filter' : '');
    btn.textContent = active ? '篩選●' : '⚙️';

  refreshFilterPanel();
}

function refreshFilterPanel() {
  const panel = document.getElementById('filter-panel-inner');
  const btn = document.getElementById('filter-toggle-btn');
  const container = document.getElementById('pool-expense-list-container');
  if (panel && state.filterPanelOpen) panel.innerHTML = renderFilterPanelInner();

function renderFilterPanelInner() {
  const t = state.currentTrip;
  if (!t) return '';
  const members = t.members || [];
  // 固定類別清單（與新增花費表單一致）
  const allCats = ['吃喝', '交通', '住宿', '購物', '娛樂', '其他', '金流'];
  // 從資料動態取得所有日期（作為快速按鈕）
  const allDates = [...new Set(state.expenses.filter(e => e.tripId === t.id).map(e => e.date))].sort();
  const totalCount = state.expenses.filter(e => e.tripId === t.id).length;
  const filteredCount = getFilteredExpenses().length;

  let html = '';

  // 日期快速按鈕
  html += `<div class="filter-section-label">📅 日期快選</div>`;
  html += `<div class="filter-chips-row">`;
  allDates.forEach(d => {
    const isOn = state.filterDateFrom === d && state.filterDateTo === d;
    html += `<button class="filter-chip${isOn?' on':''}" onclick="setFilterDayQuick('${d}')">${formatDateSimple(d)}</button>`;
  });

  // 手動日期範圍
  html += `<div class="filter-section-label">📆 自訂日期範圍</div>`;
  html += `<div class="filter-date-row">
    <input type="date" value="${state.filterDateFrom}" onchange="handleFilterDateFrom(this.value)" placeholder="開始日期">
    <span>～</span>
    <input type="date" value="${state.filterDateTo}" onchange="handleFilterDateTo(this.value)" placeholder="結束日期">
  </div>`;

  // 成員篩選
  html += `<div class="filter-section-label">👤 成員</div>`;
  html += `<div class="filter-chips-row">`;
  members.forEach(m => {
    const isOn = state.filterMembers.includes(m);
    html += `<button class="filter-chip${isOn?' on':''}" onclick="toggleFilterMember('${m}')">${m}</button>`;
  });
  html += `</div>`;

  // 類別篩選
  html += `<div class="filter-section-label">🏷️ 類別</div>`;
  html += `<div class="filter-chips-row">`;
  allCats.forEach(c => {
    const isOn = state.filterCategories.includes(c);
    html += `<button class="filter-chip${isOn?' on':''}" onclick="toggleFilterCategory('${c}')">${c}</button>`;
  });
  html += `</div>`;

  // 底部：筆數 + 清除
  html += `<div class="filter-footer">
    <span class="filter-count-badge">顯示 <strong>${filteredCount}</strong> 筆 / 共 ${totalCount} 筆</span>
    ${hasActiveFilter() ? `<button class="filter-clear-btn" onclick="clearAllFilters()">✕ 清除全部篩選</button>` : ''}
  </div>`;

  return html;

function buildPoolAllCards(poolCurrencies, lc, hc, calc) {
  const exps = (state.expenses||[]).filter(e=>e.tripId===state.currentTrip?.id);
  const nonHc = poolCurrencies.filter(c=>c!==hc);
  let cards = [];
  nonHc.forEach(c=>{
    const cCode = currCode(c);
    const cExps = exps.filter(e=>currCode(e.currency||lc)===cCode);
    const income = cExps.filter(e=>e.accountType==='收入').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    const cashOut= cExps.filter(e=>e.accountType!=='收入'&&e.paymentMethod==='現金'&&e.category!=='公費借出').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    const cardOut= cExps.filter(e=>e.accountType!=='收入'&&e.paymentMethod==='信用卡').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    const bal    = income - cashOut;
    cards.push('<div class="pf-twin-card" style="padding:12px 8px;cursor:pointer;text-align:left" onclick="poolSetDashCurrency(\''+c+'\')">'
      +'<div style="font-size:11px;font-weight:700;color:#666;margin-bottom:4px">'+cCode+' 公費池</div>'
      +'<div style="font-size:15px;font-weight:800;color:var(--green)">'+fmt(income)+'</div>'
      +'<div style="font-size:11px;color:var(--red)">支出 '+fmt(cashOut)+'</div>'
      +(cardOut>0?'<div style="font-size:11px;color:var(--purple)">刷卡 '+fmt(cardOut)+'</div>':'')
      +'<div style="border-top:1px solid #e5e7eb;margin:5px 0 3px"></div>'
      +'<div style="font-size:13px;font-weight:800;color:'+(bal>=0?'var(--green)':'var(--red)')+'">餘 '+fmt(Math.abs(bal))+'</div>'
      +'<div style="font-size:10px;color:#aaa">'+cCode+'</div>'
      +'</div>');
  });
  // TWD（習慣幣別）
  const hcExps = exps.filter(e=>currCode(e.currency||lc)===currCode(hc));
  const hcIncome= hcExps.filter(e=>e.accountType==='收入').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const hcOut   = hcExps.filter(e=>e.accountType!=='收入'&&e.paymentMethod==='現金').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const hcBal   = hcIncome - hcOut;
  if (hcIncome>0 || hcOut>0) {
    cards.push('<div class="pf-twin-card" style="padding:12px 8px;cursor:pointer;text-align:left" onclick="poolSetDashCurrency(\''+hc+'\')">'
      +'<div style="font-size:11px;font-weight:700;color:#666;margin-bottom:4px">'+currCode(hc)+' 公費池</div>'
      +'<div style="font-size:15px;font-weight:800;color:var(--green)">'+fmt(hcIncome)+'</div>'
      +'<div style="font-size:11px;color:var(--red)">支出 '+fmt(hcOut)+'</div>'
      +'<div style="border-top:1px solid #e5e7eb;margin:5px 0 3px"></div>'
      +'<div style="font-size:13px;font-weight:800;color:'+(hcBal>=0?'var(--green)':'var(--red)')+'">餘 '+fmt(Math.abs(hcBal))+'</div>'
      +'<div style="font-size:10px;color:#aaa">'+currCode(hc)+'</div>'
      +'</div>');
  }
  // 刷卡彙總卡（跨幣別）
  const { totalBilledTWD, pendingCard } = calc;
  cards.push('<div class="pf-twin-card" style="padding:12px 8px;cursor:pointer;text-align:left" onclick="openCheckoutModal()">'
    +'<div style="font-size:11px;font-weight:700;color:#666;margin-bottom:4px">💳 刷卡請款（全幣別）</div>'
    +'<div style="font-size:15px;font-weight:800;color:var(--blue)">'+currCode(hc)+' '+fmt(totalBilledTWD)+'</div>'
    +(pendingCard>0?'<div style="font-size:11px;color:#f97316;font-weight:700">⚠️ 待請款 '+pendingCard+' 筆</div>':'<div style="font-size:11px;color:var(--green)">✅ 全數已填</div>')
    +'</div>');
  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">'+cards.join('')+'</div>';
}

function renderPool() {
  const calc = calcAll();
  const lc = localCur(), hc = habitCur();
  const tripCurs = getTripCurrencies();
  const expCurs  = [...new Set((state.expenses||[]).filter(e=>e.tripId===state.currentTrip?.id).map(e=>e.currency||lc))];
  const allPoolCurs = [...new Set([...tripCurs, ...expCurs])].filter(c=>c!==hc);
  const poolCurrencies = [...allPoolCurs, hc];
  if (!state.poolDashAll && (!state.poolDashCurrency || !poolCurrencies.some(c=>currCode(c)===state.poolDashCurrency))) {
    state.poolDashAll = true;
  }
  const isPoolAll = state.poolDashAll;
  const poolCur = isPoolAll ? lc : (poolCurrencies.find(c=>currCode(c)===state.poolDashCurrency) || lc);
  const poolTabsHtml = [
    '<button class="pf-cur-tab '+(isPoolAll?'active':'')+' " onclick="poolSetDashCurrency(\'all\')">\u5168\u90e8<\/button>',
    ...poolCurrencies.map(c=>'<button class="pf-cur-tab '+(!isPoolAll&&state.poolDashCurrency===currCode(c)?'active':'')+' " onclick="poolSetDashCurrency(\''+currCode(c)+'\')">'+ currCode(c)+'</button>')
  ].join('');
  const { totalLendingNet, pendingCard, totalBilledTWD } = calc;
  let html = '<div class="pf-cur-tabs" style="margin-bottom:12px">'+poolTabsHtml+'</div>';
  if (isPoolAll) {
    html += buildPoolAllCards(poolCurrencies, lc, hc, calc);
    html += `<div class="balance-card" style="margin-top:8px">
      <div class="action-links">
        <button class="action-link" onclick="openMemberModal()">成員管理</button>
        <button class="action-link" onclick="openCheckoutModal()">查看結算</button>
      </div>
      <div class="flex-row">
        <button class="btn btn-purple" onclick="startAddExpense()">＋ 新增花費</button>
        <button class="btn btn-green-light" onclick="startAddIncome()">＋ 入帳</button>
      </div>
    </div>`;
  } else {
    // 依 poolCur 即時計算
    const pCode = currCode(poolCur);
    const poolIncome  = calc.incomeByCur[pCode] || 0;
    const poolSubsidy = calc.subsidyByCur[pCode] || 0;
    const poolCashOut = calc.expCashByCur[pCode] || 0;
    const poolCardOut = calc.expCardByCur[pCode] || 0;
    const poolTotal   = poolIncome + poolSubsidy - poolCashOut;
    html += `<div class="summary-row">
      <div class="summary-item" onclick="openIncomeModal()">
        <div class="summary-label">公費收入</div>
        <div class="summary-value" style="color:var(--green)"><span style="font-size:12px;color:#999;margin-right:2px">${pCode}</span>${fmt(poolIncome)}</div>
        <div style="margin-top:4px"><span class="badge badge-green">小額支援: +${fmt(poolSubsidy)}</span></div>
        <div style="margin-top:4px"><span class="badge badge-orange">未收回: ${fmt(totalLendingNet)}</span></div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item" onclick="openExpenseModal()">
        <div class="summary-label">公費支出</div>
        <div class="summary-value" style="color:var(--red)"><span style="font-size:12px;color:#999;margin-right:2px">${pCode}</span>${fmt(poolCashOut)}</div>
        <div style="margin-top:4px"><span class="badge badge-blue">信用卡: ${fmt(poolCardOut)}</span></div>
      </div>
    </div>
    <div class="balance-card">
      <div class="action-links">
        <button class="action-link" onclick="openMemberModal()">成員管理</button>
        <button class="action-link" onclick="openCheckoutModal()">查看結算</button>
      </div>
      <div class="balance-amount">
        <span class="balance-currency">${pCode}</span>
        <span class="balance-number">${fmt(poolTotal)}</span>
      </div>
      <div class="flex-row">
        <button class="btn btn-purple" onclick="startAddExpense()">＋ 新增花費</button>
        <button class="btn btn-green-light" onclick="startAddIncome()">＋ 入帳</button>
      </div>
    </div>`;
  }
  html += `<div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="pool-search-inp" placeholder="搜尋項目、備註、成員..." value="${state.searchTerm}" oninput="handlePoolSearch(this.value)">
    <button id="filter-toggle-btn" class="search-filter-btn${hasActiveFilter()?' has-filter':''}" onclick="toggleFilterPanel()">${hasActiveFilter()?'篩選●':'⚙️'}</button>
    <button class="search-clear" id="pool-search-clear" style="display:${state.searchTerm?'flex':'none'}" onclick="handlePoolSearch(''); document.getElementById('pool-search-inp').value='';">✕</button>
  </div>

    <div id="filter-panel-inner" class="filter-panel-inner">${state.filterPanelOpen?renderFilterPanelInner():''}</div>
  </div>`;
  if (state.activeFormType) { html += renderExpenseForm(); }
  html += '<div id="pool-expense-list-container">'+renderPoolListHTML()+'</div>';
  return html;
}
function renderExpenseItem(e) {

    const isDomExp = (e.currency||lc)===hc;
    if (isDomExp) {
      const fee = Math.round(parseFloat(e.amount||0)*(parseFloat(e.feeRate)||0)/100);
      billHtml = fee>0 ? `<div class="billed-text">(${hc} ${fmt(e.amount||0)}+${fmt(fee)}=${fmt(parseFloat(e.amount||0)+fee)})</div>` : '';

function bindPoolEvents() {}

function updateDetailVal(id, field, val) {
  const d = state.newExpense.details.find(x => x.id === id);
  if (d) d[field] = val;
  if (field === 'amount') updateDetailSubtotal();
}

function updateDetailSubtotal() {
  const e = state.newExpense;
  if (!e) return;
  const totalAmt = parseFloat(e.amount) || 0;
  const subTotal = (e.details||[]).reduce((s,d)=>s+(parseFloat(d.amount)||0),0);
  const el = document.getElementById('detail-subtotal-display');
  if (!el) return;
  const cur = e.currency || localCur();
  if (totalAmt > 0 && subTotal > totalAmt) {
      el.style.color = '#dc2626';
      el.style.backgroundColor = '#fee2e2';
  } else {
      el.style.color = '#059669';
      el.style.backgroundColor = '#dcfce7';
  }
  el.innerHTML = `細項小計: ${cur} ${fmt(subTotal)}`;
}

function updateSubsidyVal(id, field, val) {
  const s = state.newExpense.subsidies.find(x => x.id === id);
  if (s) s[field] = val;
  if (field === 'amount') {
    updateSubsidySubtotal();
    if (state.activeFormType === 'income' && !state.isReturning) {
      const total = state.newExpense.subsidies.reduce((acc, x) => acc + (parseFloat(x.amount) || 0), 0);
      state.newExpense.amount = total > 0 ? String(total) : '';
      const amtEl = document.getElementById('fe-amount');
      if (amtEl) {
        amtEl.value = state.newExpense.amount;
        updateDetailSubtotal();
      }
    }
  }
}

function updateSubsidySubtotal() {
  const e = state.newExpense;
  if (!e) return;
  const totalAmt = parseFloat(e.amount) || 0;
  const subTotal = (e.subsidies||[]).reduce((s,x)=>s+(parseFloat(x.amount)||0),0);
  const el = document.getElementById('subsidy-subtotal-display');
  if (el) {
    el.style.color = (totalAmt > 0 && subTotal > totalAmt) ? 'var(--red)' : 'var(--green)';
    el.innerHTML = subTotal > 0 ? `+ ${fmt(subTotal)}` : '';
  }
}

    </label>
      <div class="select-wrap"><select onchange="setExp('payer',this.value)">
        <option value="">選擇還款成員</option>
        ${members.map(m=>`<option value="${m}" ${e.payer===m?'selected':''}>${m}</option>`).join('')}
      </select></div></div>`;

    html += `<div class="input-group"><label class="lbl">分攤成員 (誰要分攤這筆？)</label>
      <div class="split-member-grid">

          <div class="split-member-chip ${e.splitMembers.includes(m)?'selected':''}" onclick="toggleSplitMember('${m}')">

      html += `<div class="subsidy-row">
        <div class="select-wrap" style="flex:1"><select onchange="setSubsidy(${row.id},'member',this.value)">

          ${members.map(m=>`<option value="${m}" ${row.member===m?'selected':''} ${sel.includes(m)?'disabled':''} style="${sel.includes(m)?'color:#ccc':''}">${m}${sel.includes(m)?' (已選)':''}</option>`).join('')}
        </select></div>
        <div class="amount-currency-wrap" style="flex:1.2">
          <input type="number" placeholder="0" value="${row.amount||''}" oninput="updateSubsidyVal(${row.id},'amount',this.value)">
          <select class="currency-select-inline" onchange="setSubsidy(${row.id},'currency',this.value)">
            ${opts.map(c=>`<option value="${c}" ${(row.currency||lc)===c?'selected':''}>${c}</option>`).join('')}

        </div>

      html += `<div class="detail-row">
        <input type="text" style="flex:2" placeholder="品項描述" value="${row.desc||''}" oninput="updateDetailVal(${row.id},'desc',this.value)">
        <input type="number" style="flex:1" placeholder="金額" value="${row.amount||''}" oninput="updateDetailVal(${row.id},'amount',this.value)">
        <span style="font-size:12px;color:#999;width:30px;text-align:center">${currentCur}</span>
        <button class="remove-btn" onclick="removeDetail(${row.id})">－</button>

    html += `<div style="display:flex;gap:8px;margin-top:4px">
      <button class="add-row-btn" style="color:var(--blue)" onclick="addDetail()">＋ 新增一列</button>
      <button class="add-row-btn" style="color:var(--purple)" onclick="openImportDetails('pool')">📋 匯入細項</button>
    </div></div>`;

    html += `<div class="input-group"><label class="lbl">附件/收據 (最多10張)</label>`;
    if ((e.attachments||[]).length) {
      html += `<div class="thumbnails">`;
      e.attachments.forEach((f,idx) => {
        html += `<div class="thumb-wrap"><img src="${f.url}" alt="">
          <button class="thumb-del" onclick="removeAttach(${f.id})">✕</button></div>`;
      });
      html += `</div>`;
    }
    html += `<div class="upload-box" onclick="document.getElementById('file-upload').click()">📎 點擊上傳<input id="file-upload" type="file" accept="image/*" multiple style="display:none" onchange="handleUpload(this)"></div></div>`;
  }

  html += `<div class="input-group"><label class="lbl">備註 (選填)</label>
    <textarea placeholder="輸入備註或額外資訊" onchange="setExp('notes',this.value)">${e.notes||''}</textarea></div>`;

  html += `<div class="flex-row" style="margin-top:24px">
    <button class="btn btn-secondary" style="flex:1" onclick="cancelExpense()">取消</button>
    <button class="btn btn-purple" onclick="saveExpense()">${editingExpenseId?'更新':'儲存'}</button>
  </div></div>`;
  return html;
}

function splitSubsidiesEvenly() {
  const tot = parseInt(state.newExpense.amount) || 0;
  if (tot <= 0) return alert('請先輸入總金額再進行平分');
  const active = state.newExpense.subsidies.filter(s => s.member);
  const cnt = active.length;
  if (cnt === 0) return alert('請先選擇繳款成員再進行平分');
  const cur = state.newExpense.currency || localCur();
  const isInt = INT_CURRENCIES.includes(cur);
  const base = isInt ? Math.floor(tot / cnt) : Math.round(tot / cnt * 100) / 100;
  const rem  = isInt ? tot % cnt : 0;
  let remGiven = false;
  state.newExpense.subsidies = state.newExpense.subsidies.map(s => {
    if (!s.member) return s;
    if (!remGiven) { remGiven = true; return {...s, amount: isInt ? base + rem : base}; }
    return {...s, amount: base};
  });
  renderTab();
}
function onCurrencyChange(v) {
  const lc = localCur();
  state.newExpense.currency = v;
  if (state.activeFormType==='expense' && state.newExpense.paymentMethod==='信用卡') {
    if (v==='TWD') { state.newExpense.billingAmount=state.newExpense.amount; state.newExpense.feeRate=0; }
    else { state.newExpense.billingAmount=''; state.newExpense.feeRate=1.5; }
  }
  if (state.newExpense.subsidies && state.newExpense.subsidies.length > 0) {
    state.newExpense.subsidies = state.newExpense.subsidies.map(s => ({...s, currency: v}));
  }
  renderTab();
}

function doImportDetails(formType) {
  var textarea = document.getElementById('import-detail-text');
  if (!textarea) return;
  var lines = textarea.value.split('\n');
  var cur = formType==='pool'
    ? (state.newExpense.currency || localCur())
    : (state.personalForm.currency || localCur());
  var imported = 0;

  lines.forEach(function(line) {
    line = line.trim();
    if (!line) return; // 忽略空行
    var lastSpace = line.lastIndexOf(' ');
    var desc, amount;
    if (lastSpace >= 0) {
      var tail = line.slice(lastSpace+1);
      var num = parseFloat(tail);
      if (!isNaN(num) && isFinite(num) && tail.trim() !== '') {
        desc = line.slice(0, lastSpace).trim();
        amount = num;
      } else {
        desc = line;
        amount = 0;
      }
    } else {
      desc = line;
      amount = 0;
    }
    if (!desc) return;

    if (formType === 'pool') {
      var newId = Date.now() + imported;
      state.newExpense.details = state.newExpense.details || [];
      state.newExpense.details.push({ id: newId, desc: desc, amount: amount, currency: cur });
    } else {
      var newId2 = Date.now() + imported;
      state.personalForm.details = state.personalForm.details || [];
      state.personalForm.details.push({ id: newId2, desc: desc, amount: amount, currency: cur });
    }
    imported++;
  });

  closeModal();
  renderTab();
  if (imported > 0) {
    // 短暫提示
    var toast = document.createElement('div');
    toast.textContent = '✅ 已匯入 '+imported+' 筆細項';
    toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:9999';
    document.body.appendChild(toast);
    setTimeout(function(){ document.body.removeChild(toast); }, 2000);
  }
}

function saveExpense() {
  const dateEl = document.getElementById('fe-date');
  const itemEl = document.getElementById('fe-item');
  const amtEl = document.getElementById('fe-amount');
  if (dateEl) state.newExpense.date = dateEl.value;
  if (itemEl && !state.isLending && !state.isReturning && state.activeFormType!=='income') state.newExpense.item = itemEl.value;
  if (amtEl) state.newExpense.amount = amtEl.value;
  const feeEl = document.getElementById('fe-feerate');
  if (feeEl) state.newExpense.feeRate = feeEl.value;
  const billEl = document.getElementById('fe-billing');
  if (billEl) state.newExpense.billingAmount = billEl.value;

  const e = state.newExpense;
  const lc = localCur();
  const { isLending, isReturning, activeFormType, editingExpenseId } = state;
  const calc = calcAll();

  if (!parseFloat(e.amount)) return alert('請輸入金額');
  if (activeFormType==='expense' && !isLending && e.splitMembers.length===0) return alert('請至少選擇一位分攤成員。');

  if (isReturning && !e.payer) return alert('請選擇還款人，公費收回為必填項目。');

  if (isReturning) {
    const debt = calc.outstandingDebts.find(d=>d.member===e.payer);
    const actual = debt?debt.amount:0;
    if (parseFloat(e.amount) > actual) return alert(`還款金額不能超過欠款餘額！\n${e.payer} 尚欠 ${lc} ${fmt(actual)}`);
  }

  if (activeFormType==='income' && !isReturning) {
    const totalSub = e.subsidies.reduce((s,x)=>s+(parseFloat(x.amount)||0),0);
    if (Math.abs(parseFloat(e.amount)-totalSub)>0.01) return alert(`金額不符！\n總金額: ${e.amount}\n繳款明細總和: ${totalSub}\n\n請確認金額一致後再儲存。`);
  }

  if (activeFormType!=='income' && !isLending) {
    for (const sub of e.subsidies) {
      const sa = parseFloat(sub.amount)||0;
      if (sub.member && sa<=0) return alert(`成員 ${sub.member} 已選，請輸入有效的支援金額。`);
      if (sa>0 && !sub.member) return alert(`您輸入了 ${fmt(sa)} 的小額支援金額，請選擇對應的支援成員。`);
    }
  }

  const finalExp = activeFormType==='income' ? {
    ...e, item: isReturning?'公費收回':'公費收入',
    category: isReturning?'公費收回':'金流',
    paymentMethod: '現金', accountType: '收入',
    splitMembers: [], cardPayer: '',
    ...(isReturning?{ currency:lc, subsidies:[] }:{})
  } : {
    ...e, item: isLending?'公費借出':e.item,
    category: isLending?'公費借出':e.category,
    accountType: '支出',
    cardPayer: e.paymentMethod==='信用卡'?e.cardPayer:(state.currentTrip?.members?.[0]||'')
  };

  if (editingExpenseId) {
    state.expenses = state.expenses.map(x=>x.id===editingExpenseId?{...finalExp,id:editingExpenseId,tripId:state.currentTrip.id}:x);
    state.editingExpenseId = null;
  } else {
    state.expenses.unshift({ ...finalExp, id:Date.now()+Math.random(), tripId:state.currentTrip.id });
  }
  state.activeFormType = null;
  state.isLending = false;
  state.isReturning = false;
  state.newExpense = defaultExpense();
  saveToStorage();
  renderTab();
}

        ${e.subsidies.map(s=>`<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span>${s.member}</span><span style="color:var(--green)">+ ${s.currency||lc} ${fmt(s.amount)}</span></div>`).join('')}
        <div style="border-top:1px solid var(--border);margin-top:4px;padding-top:4px;text-align:right;font-weight:700;color:var(--green)">總計: ${lc} ${fmt(totalSub)}</div>
      </div>`:''}
    </div>`;

  if ((e.details||[]).some(d=>d.desc||d.amount)) {
    html += `<div class="detail-label">細項描述</div><table class="detail-table">
      <tr><th>項目</th><th style="text-align:right">金額</th></tr>
      ${e.details.filter(d=>d.desc||d.amount).map(d=>`<tr><td>${d.desc||'-'}</td><td style="text-align:right">${fmt(d.amount)}</td></tr>`).join('')}
    </table>`;
  }
  html += `<div class="detail-label">備註</div><div style="background:#eee;padding:12px;border-radius:8px;font-size:14px;margin-bottom:14px">${e.notes||'無'}</div>`;

  if ((e.attachments||[]).length) {
    html += `<div class="detail-label">附件/收據</div><div class="thumbnails">
      ${e.attachments.map((f,i)=>`<div class="thumb-wrap" style="cursor:zoom-in" onclick="openLightbox(${e.id},${i})"><img src="${f.url}" alt=""></div>`).join('')}
    </div>`;
  }

  const backBtn = state.modalBackFn
    ? `<button class="btn btn-secondary" style="flex:1" onclick="state.modalBackFn&&state.modalBackFn()">← 返回</button>`
    : `<button class="btn btn-secondary" style="flex:1" onclick="closeModal()">關閉</button>`;

  html += `<div class="flex-row" style="margin-top:20px">
    ${backBtn}
    <button class="btn btn-outline" style="flex:1" onclick="startEditExpense(state.expenses.find(x=>x.id===${e.id}))">✏️ 修改</button>
    <button class="btn" style="flex:1;background:var(--red-light);color:var(--red);border:none" onclick="delExpense(${e.id})">🗑️ 刪除</button>
  </div>`;
  showModal(html);
}

let lbExpId = null, lbIndex = 0, lbZoomLevel = 1;
function openLightbox(expId, idx) {
  lbExpId = expId; lbIndex = idx; lbZoomLevel = 1;
  updateLightbox();
  document.getElementById('lightbox').classList.remove('hidden');
}
function closeLightbox() { document.getElementById('lightbox').classList.add('hidden'); }
function updateLightbox() {
  const e = state.expenses.find(x=>x.id===lbExpId);
  if (!e || !e.attachments) return;
  const imgs = e.attachments;
  document.getElementById('lb-img').src = imgs[lbIndex].url;
  document.getElementById('lb-img').style.transform = `scale(${lbZoomLevel})`;
  document.getElementById('lb-counter').textContent = `${lbIndex+1} / ${imgs.length}`;
  document.getElementById('lb-prev').style.display = lbIndex>0?'flex':'none';
  document.getElementById('lb-next').style.display = lbIndex<imgs.length-1?'flex':'none';
}
function lbNav(d) { lbIndex += d; lbZoomLevel=1; updateLightbox(); }
function lbZoom(d) { lbZoomLevel = Math.max(1,Math.min(3,lbZoomLevel+d)); document.getElementById('lb-img').style.transform=`scale(${lbZoomLevel})`; }

function openIncomeModal() { renderIncomeModal(); }
function renderIncomeModal() {
  const lc = localCur(), hc = habitCur();
  const tab = state.incomeModalTab;
  const calc = calcAll();
  const filtered = getFilteredExpenses();
  const allPoolCurCodes = [...new Set([...getTripCurrencies().map(c=>currCode(c)), currCode(hc)])];

  // 幣別篩選狀態
  if (!state.incomeModalCurFilter) state.incomeModalCurFilter = 'all';
  const curFilt = state.incomeModalCurFilter;

  const incomeGenAll = filtered.filter(e=>e.accountType==='收入'&&e.item!=='公費收回');
  const incRetAll    = filtered.filter(e=>e.accountType==='收入'&&e.item==='公費收回');
  const subAll       = filtered.filter(e=>e.accountType==='支出').flatMap(e=>(e.subsidies||[]).filter(s=>s.amount&&parseFloat(s.amount)>0).map(s=>({...s,date:e.date,sourceItem:e.item,parentId:e.id,currency:s.currency||lc})));

  // 依幣別篩選
  const incomeGenRecs = curFilt==='all' ? incomeGenAll : incomeGenAll.filter(e=>currCode(e.currency||lc)===curFilt);
  const incRetRecs    = curFilt==='all' ? incRetAll    : incRetAll.filter(e=>currCode(e.currency||lc)===curFilt);
  const subRecs       = curFilt==='all' ? subAll       : subAll.filter(s=>currCode(s.currency||lc)===curFilt);

  const allCurCodes = [...new Set([...incomeGenAll, ...incRetAll].map(e=>currCode(e.currency||lc)))];

  // 各幣別小計
  const incByCur={}, subByCur={}, retByCur={};
  allCurCodes.forEach(cCode=>{
    incByCur[cCode]  = incomeGenRecs.filter(e=>currCode(e.currency||lc)===cCode).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    subByCur[cCode]  = subRecs.filter(s=>currCode(s.currency||lc)===cCode).reduce((s,x)=>s+(parseFloat(x.amount)||0),0);
    retByCur[cCode]  = incRetRecs.filter(e=>currCode(e.currency||lc)===cCode).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  });

  const { outstandingDebts, totalLendingRaw, totalLendingNet } = calc;

  // 幣別篩選 chips
  const curChips = `<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
    <span style="font-size:12px;color:#999;align-self:center">幣別:</span>
    <button class="chip ${curFilt==='all'?'active-purple':''}" onclick="state.incomeModalCurFilter='all';renderIncomeModal()">全部</button>
    ${allPoolCurCodes.map(c=>`<button class="chip ${curFilt===c?'active-purple':''}" onclick="state.incomeModalCurFilter='${c}';renderIncomeModal()">${c}</button>`).join('')}
  </div>`;

  let html = `<div class="modal-header"><span class="modal-title">收入與支援明細</span><button class="close-btn" onclick="closeModal()">✕</button></div>
    <div class="tab-header">
      <button class="tab-btn ${tab==='general'?'active':''}" onclick="setIncomeTab('general')">資金與支援</button>
      <button class="tab-btn ${tab==='return'?'active':''}" onclick="setIncomeTab('return')">公費收回</button>
    </div>
    ${curChips}`;

  html += `<div class="filter-row"><span style="font-size:12px;color:#999;white-space:nowrap">篩選:</span>
    ${getAllFilterDates().map(d=>`<div class="chip ${state.filterDates.includes(d)?'active-purple':''}" onclick="toggleFilter('date','${d}')">${formatDateSimple(d)}</div>`).join('')}
  </div>`;

  if (tab==='general') {
    html += `<div class="section-hdr">公費入帳明細</div>`;
    if (incomeGenRecs.length) {
      incomeGenRecs.forEach(r=>{
        const cCode=currCode(r.currency||lc);
        html += `<div class="income-item" onclick="openExpenseDetail(${r.id},()=>renderIncomeModal())">
          <div class="income-item-left"><span class="income-title">${r.date}</span><span class="income-sub">${(r.subsidies||[]).map(s=>`${s.member}: ${s.amount}`).join(', ')}</span></div>
          <div class="income-amt">${cCode} +${fmt(r.amount)}</div>
        </div>`;
      });
    } else html += `<div style="text-align:center;color:#999;padding:10px 0">無入帳紀錄</div>`;
    // 各幣別小計
    html += `<div class="summary-footer">`;
    allCurCodes.filter(c=>incByCur[c]>0).forEach(cCode=>{
      html += `<div class="summary-row-item"><span>${cCode} 小計:</span><span>${fmt(incByCur[cCode])}</span></div>`;
    });
    html += `</div>`;

    html += `<div class="section-hdr" style="margin-top:16px">小額支援明細</div>`;
    if (subRecs.length) {
      subRecs.forEach(s=>{
        const cCode=currCode(s.currency||lc);
        html += `<div class="income-item" onclick="openExpenseDetail(${s.parentId},()=>renderIncomeModal())">
          <div class="income-item-left"><span class="income-title">${s.sourceItem}</span><span class="income-sub">${s.date} - ${s.member} 支援 (${cCode})</span></div>
          <div style="font-size:14px;font-weight:700;color:#059669">${cCode} +${fmt(s.amount)}</div>
        </div>`;
      });
    } else html += `<div style="text-align:center;color:#999;padding:10px 0">無支援紀錄</div>`;
    html += `<div class="summary-footer">`;
    allCurCodes.filter(c=>subByCur[c]>0).forEach(cCode=>{
      html += `<div class="summary-row-item"><span>${cCode} 小計:</span><span>${fmt(subByCur[cCode])}</span></div>`;
    });
    html += `</div>`;

    html += `<div class="summary-block-colored" style="margin-top:16px"><div class="summary-block-title">總共合計</div>`;
    allCurCodes.filter(c=>(incByCur[c]||0)+(subByCur[c]||0)>0).forEach(cCode=>{
      html += `<div class="summary-row-item" style="font-weight:700;color:#004d40"><span>${cCode} 總計:</span><span>${fmt((incByCur[cCode]||0)+(subByCur[cCode]||0))}</span></div>`;
    });
    html += `</div>`;
  }

  if (tab==='return') {
    if (outstandingDebts.length) {
      html += `<div class="debt-section"><div class="debt-title">⚠️ 公費借出未還統計</div>
        ${outstandingDebts.map(d=>`<div class="debt-row"><span>${d.member}</span><span style="font-weight:700">欠 ${currCode(lc)} ${fmt(d.amount)}</span></div>`).join('')}
        <div style="margin-top:8px;border-top:1px dashed #fca5a5;padding-top:6px;text-align:right;font-weight:700;color:#b91c1c">
          未還總計: ${currCode(lc)} ${fmt(outstandingDebts.reduce((s,d)=>s+d.amount,0))}
        </div>
      </div>`;
    } else if (totalLendingRaw>0&&totalLendingNet===0) {
      html += `<div class="all-clear">✅ 所有公費借款已全數結清！</div>`;
    }
    html += `<div class="section-hdr">公費收回明細</div>`;
    if (incRetRecs.length) {
      incRetRecs.forEach(r=>{
        const cCode=currCode(r.currency||lc);
        html += `<div class="income-item" onclick="openExpenseDetail(${r.id},()=>renderIncomeModal())">
          <div class="income-item-left"><span class="income-title">${r.date}</span><span class="income-sub">還款人: ${r.payer||'未知'}</span></div>
          <div style="font-size:14px;font-weight:700;color:#b45309">${cCode} +${fmt(r.amount)}</div>
        </div>`;
      });
    } else html += `<div style="text-align:center;color:#999;padding:10px 0">無收回紀錄</div>`;
    html += `<div class="summary-footer">`;
    allCurCodes.filter(c=>retByCur[c]>0).forEach(cCode=>{
      html += `<div class="summary-row-item"><span>${cCode} 小計:</span><span>${fmt(retByCur[cCode])}</span></div>`;
    });
    html += `</div>`;
  }

  html += `<button class="btn btn-secondary" style="margin-top:16px;width:100%" onclick="closeModal()">關閉</button>`;
  showModal(html);
}
function setIncomeTab(tab) { state.incomeModalTab = tab; renderIncomeModal(); }

function openExpenseModal() { renderExpenseModal(); }
function renderExpenseModal() {
  const lc = localCur(), hc = habitCur();
  const tab = state.expenseModalTab;
  const calc = calcAll();
  const filtered = getFilteredExpenses();
  const members = state.currentTrip?.members || [];
  const expGenRecs  = filtered.filter(e=>e.accountType==='支出'&&e.category!=='公費借出');
  const expLendRecs = filtered.filter(e=>e.accountType==='支出'&&e.category==='公費借出');
  const { overseasCards, domesticCards, totalBilledLocal, totalBilledOverseasTWD, totalDomesticCard, totalBilledTWD, totalOverseasLocalCard, pendingCard } = calc;
  const allCurCodes = [...new Set(expGenRecs.map(e=>currCode(e.currency||lc)))];

  // 各幣別現金/刷卡小計
  const cashByCur={}, cardByCur={};
  allCurCodes.forEach(cCode=>{
    cashByCur[cCode]=expGenRecs.filter(e=>currCode(e.currency||lc)===cCode&&e.paymentMethod==='現金').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    cardByCur[cCode]=expGenRecs.filter(e=>currCode(e.currency||lc)===cCode&&e.paymentMethod==='信用卡').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  });
  const lendTotal = expLendRecs.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);

  let html = `<div class="modal-header"><span class="modal-title">公費支出明細</span><button class="close-btn" onclick="closeModal()">✕</button></div>
    <div class="tab-header">
      <button class="tab-btn ${tab==='general'?'active':''}" onclick="setExpenseTab('general')">一般支出</button>
      <button class="tab-btn ${tab==='cardBilling'?'active':''}" onclick="setExpenseTab('cardBilling')">刷卡請款</button>
      <button class="tab-btn ${tab==='lending'?'active':''}" onclick="setExpenseTab('lending')">公費借出</button>
    </div>`;

  if (tab==='general') {
    // 幣別篩選（所有幣別 + 全部）
    const allPoolCurCodes = [...new Set([...getTripCurrencies().map(c=>currCode(c)), currCode(hc)])];
    html += `<div class="filter-row"><span style="font-size:12px;color:#999;white-space:nowrap">日期:</span>
      ${getAllFilterDates().map(d=>`<div class="chip ${state.filterDates.includes(d)?'active-purple':''}" onclick="setExpenseTab('general','date','${d}')">${formatDateSimple(d)}</div>`).join('')}
    </div>
    <div class="filter-row" style="margin-bottom:8px">
      <span style="font-size:12px;color:#999;white-space:nowrap">付款:</span>
      ${['現金','信用卡'].map(m=>`<div class="chip ${state.filterPaymentMethods.includes(m)?'active-blue':''}" onclick="setExpenseTab('general','pm','${m}')">${m}</div>`).join('')}
    </div>
    <div class="filter-row" style="margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:12px">
      <span style="font-size:12px;color:#999;white-space:nowrap">幣別:</span>
      <div class="chip ${state.filterCurrencies.length===0?'active-purple':''}" onclick="state.filterCurrencies=[];renderExpenseModal()">全部</div>
      ${allPoolCurCodes.map(c=>`<div class="chip ${state.filterCurrencies.includes(c)?'active-purple':''}" onclick="setExpenseTab('general','cur','${c}')">${c}</div>`).join('')}
    </div>`;

    expGenRecs.forEach(r=>{
      const dc = currCode(r.currency||lc);
      let extra = '';
      if (r.paymentMethod==='信用卡') {
        const b=parseFloat(r.billingAmount);
        const bt=r.billingType||(currCode(r.currency||lc)===currCode(hc)?'domestic':'twd');
        if(bt==='domestic'){const f=Math.round(parseFloat(r.amount||0)*(parseFloat(r.feeRate)||0)/100);extra=f>0?`<div class="billed-text">(${currCode(hc)} ${fmt(r.amount)}+${fmt(f)}=${fmt(parseFloat(r.amount||0)+f)})</div>`:'';
        }else if(b>0){const f=Math.round(b*(parseFloat(r.feeRate)||0)/100);extra=`<div class="billed-text">(${currCode(hc)} ${fmt(b)}+${fmt(f)}=${fmt(b+f)})</div>`;
        }else extra=`<div class="pending-text">銀行尚未請款</div>`;
      }
      html += `<div class="income-item" onclick="openExpenseDetail(${r.id},()=>renderExpenseModal())">
        <div class="income-item-left"><span class="income-title">${r.date} - ${r.item}</span><span class="income-sub">${r.category} | ${r.paymentMethod}支付</span></div>
        <div style="text-align:right"><div style="font-size:14px;font-weight:700;color:var(--red)"><span style="font-size:10px;color:#666;font-weight:normal">${dc}</span> ${fmt(r.amount)}</div>${extra}</div>
      </div>`;
    });
    if (!expGenRecs.length) html += `<div style="text-align:center;color:#999;padding:10px 0">無支出紀錄</div>`;

    html += `<div class="summary-footer">`;
    allCurCodes.forEach(cCode=>{
      if((cashByCur[cCode]||0)+(cardByCur[cCode]||0)===0) return;
      html += `<div class="summary-block-colored"><div class="summary-block-title">${cCode} 統計</div>
        <div class="summary-row-item"><span>現金小計:</span><span>${fmt(cashByCur[cCode]||0)}</span></div>
        <div class="summary-row-item"><span>信用卡小計:</span><span>${fmt(cardByCur[cCode]||0)}</span></div>
        <div class="summary-total-row"><span>${cCode} 總計:</span><span>${fmt((cashByCur[cCode]||0)+(cardByCur[cCode]||0))}</span></div>
      </div>`;
    });
    html += `</div>`;
  }

  if (tab==='cardBilling') {
    const allCardExps = calc.exps.filter(e=>e.accountType==='支出'&&e.paymentMethod==='信用卡');
    // P-3 篩選狀態
    if (!state.expCardCurFilter) state.expCardCurFilter = 'all';
    if (!state.expCardDateFilter) state.expCardDateFilter = 'all';
    const cardAllCurCodes = [...new Set(allCardExps.map(e=>currCode(e.currency||lc)))];
    const cardAllDates    = [...new Set(allCardExps.map(e=>e.date))].sort();
    const filtCard2 = allCardExps
      .filter(e=>state.expCardCurFilter==='all'||currCode(e.currency||lc)===state.expCardCurFilter)
      .filter(e=>state.expCardDateFilter==='all'||e.date===state.expCardDateFilter);

    const cardCurChips = `<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
      <span style="font-size:12px;color:#999;align-self:center">幣別:</span>
      <button class="chip ${state.expCardCurFilter==='all'?'active-purple':''}" onclick="state.expCardCurFilter='all';renderExpenseModal()">全部</button>
      ${cardAllCurCodes.map(c=>`<button class="chip ${state.expCardCurFilter===c?'active-purple':''}" onclick="state.expCardCurFilter='${c}';renderExpenseModal()">${c}</button>`).join('')}
    </div>
    <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:10px">
      <span style="font-size:12px;color:#999;align-self:center">日期:</span>
      <button class="chip ${state.expCardDateFilter==='all'?'active-purple':''}" onclick="state.expCardDateFilter='all';renderExpenseModal()">全部</button>
      ${cardAllDates.map(d=>`<button class="chip ${state.expCardDateFilter===d?'active-purple':''}" onclick="state.expCardDateFilter='${d}';renderExpenseModal()">${formatDateSimple(d)}</button>`).join('')}
    </div>`;
    html += cardCurChips;

    // P-8：排序最舊→最新
    const fxExps = filtCard2.filter(e=>currCode(e.currency||lc)!==currCode(hc)).sort((a,b)=>a.date.localeCompare(b.date));
    const fxCurCodes = [...new Set(fxExps.map(e=>currCode(e.currency||lc)))];
    html += `<div class="section-hdr">海外刷卡請款對帳</div>`;
    if (fxExps.length) {
      fxCurCodes.forEach(cCode=>{
        const cExps=fxExps.filter(e=>currCode(e.currency||lc)===cCode);
        html += `<div style="font-size:12px;font-weight:700;color:#0369a1;margin:6px 0 4px">${cCode}</div>`;
        cExps.forEach(r=>{
          const b=parseFloat(r.billingAmount)||0, f=b>0?Math.round(b*(parseFloat(r.feeRate)||0)/100):0;
          html += `<div class="income-item" onclick="openExpenseDetail(${r.id},()=>{state.expenseModalTab='cardBilling';renderExpenseModal()})">
            <div class="income-item-left"><span class="income-title">${r.date} - ${r.item}</span><span class="income-sub">${r.category} | 代墊人: ${r.cardPayer||members[0]||''}</span></div>
            <div style="text-align:right"><div style="font-size:14px;font-weight:700">${cCode} ${fmt(r.amount)}</div>
            ${b>0?`<div class="billed-text">(${currCode(hc)} ${fmt(b)}+${fmt(f)}=${fmt(b+f)})</div>`:'<div class="pending-text">尚未輸入請款金額</div>'}
            </div></div>`;
        });
      });
    } else html += `<div style="text-align:center;color:#999;padding:10px 0">無海外刷卡紀錄</div>`;

    const domCardExps = filtCard2.filter(e=>currCode(e.currency||lc)===currCode(hc)).sort((a,b)=>a.date.localeCompare(b.date));
    html += `<div class="section-hdr" style="margin-top:14px">國內刷卡（${currCode(hc)}）</div>`;
    if (domCardExps.length) {
      domCardExps.forEach(r=>{
        const f=Math.round(parseFloat(r.amount||0)*(parseFloat(r.feeRate)||0)/100);
        html += `<div class="income-item" onclick="openExpenseDetail(${r.id},()=>{state.expenseModalTab='cardBilling';renderExpenseModal()})">
          <div class="income-item-left"><span class="income-title">${r.date} - ${r.item}</span><span class="income-sub">${r.category} | 代墊人: ${r.cardPayer||members[0]||''}</span></div>
