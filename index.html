// F8：催收方向二 - 複製提醒訊息
function copyRemindText(target, remaining, cur) {
  const t = state.currentTrip;
  const tripName = t ? t.name : '旅遊';
  const today = new Date().toLocaleDateString('zh-TW');
  const text = '提醒通知（'+today+'）\n嗨 '+target+'！\n在「'+tripName+'」旅途中，你尚有 '+cur+' '+fmt(remaining)+' 的借款未歸還。\n方便的話，請記得還款，謝謝！';
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(()=>{
      showConvertSuccessToast('催收訊息已複製到剪貼簿！');
    }).catch(()=>{ alert(text); });
  } else {
    alert(text);
  }
}

// ===== 三欄明細 Modal =====
function openLedgerDetail(type) {
  const t = state.currentTrip;
  if (!t) return;
  const lc = localCur(), hc = habitCur();
  const tripId = t.id;
  const tripCurs = getTripCurrencies();
  const allCurCodes = [...new Set([...tripCurs.map(c=>currCode(c)), currCode(hc)])];

  // 安全取得目前選擇的幣別（避免 'all' 和完整名稱問題）
  const isAllPf = state.pfDashCurrency === 'all';
  const selCurCode = isAllPf ? currCode(lc) : (state.pfDashCurrency || currCode(lc));

  // 現金/電子支付：幣別篩選狀態（預設=目前分頁幣別，isAll時=全部）
  if (!state.ledgerCashCurFilter) state.ledgerCashCurFilter = isAllPf ? 'all' : selCurCode;
  if (!state.ledgerEpayCurFilter) state.ledgerEpayCurFilter = isAllPf ? 'all' : selCurCode;
  if (!state.ledgerCCCurFilter)   state.ledgerCCCurFilter   = 'all';
  if (!state.ledgerCCDateFilter)  state.ledgerCCDateFilter   = 'all';

  // 共用：列表項目點擊 handler（cash 和 epay 共用）
  const getRowOnClick = (r, backType) => {
    if (!r.id) return '';
    const bt = backType;
    if (r.action==='cashLedger') return `onclick="openCashLedgerDetail('${r.id}',()=>openLedgerDetail('${bt}'))" style="cursor:pointer"`;
    if (r.action==='personal')   return `onclick="openPersonalDetail('${r.id}',()=>openLedgerDetail('${bt}'))" style="cursor:pointer"`;
    if (r.action==='return')     return `onclick="openReturnDetail('${r.id}',()=>openLedgerDetail('${bt}'))" style="cursor:pointer"`;
    if (r.action==='toEpay')     return `onclick="openLedgerTabs('epay')" style="cursor:pointer"`;
    if (r.action==='epayLedger') return `onclick="openEpayLedgerDetail('${r.id}',()=>openLedgerDetail('${bt}'))" style="cursor:pointer"`;
    return '';
  };

  if (type === 'cash') {
    // 依幣別篩選決定顯示哪些幣別
    const showCashCurs = state.ledgerCashCurFilter === 'all' ? allCurCodes : [state.ledgerCashCurFilter];
    let allRows = [], cashIn=0, cashSpend=0, cashToEpay=0, cashLendOut=0, cashRecvBack=0;

    showCashCurs.forEach(cCode => {
      const cLedger  = (state.personalCashLedger||[]).filter(e=>e.tripId===tripId&&currCode(e.currency||lc)===cCode);
      const cIn      = cLedger.filter(e=>e.type==='入帳').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const cLendOut = getDashLendOut(tripId, cCode, '現金');
      const cRecvBack= getAllReturnRecords(tripId, cCode).filter(r=>r.dest==='現金').reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
      const cToEpay  = (state.personalEpayLedger||[]).filter(e=>e.tripId===tripId&&e.source==='現金'&&currCode(e.currency||lc)===cCode).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const cExps    = getTripPersonalExpenses().filter(e=>currCode(e.currency||lc)===cCode);
      const cSpend   = cExps.filter(e=>e.paymentMethod==='現金'&&e.category!=='金流').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      cashIn+=cIn; cashLendOut+=cLendOut; cashRecvBack+=cRecvBack; cashToEpay+=cToEpay; cashSpend+=cSpend;
      const cLendExps  = getAllLendRecords(tripId, cCode).filter(e=>e.lendingSource==='現金'||!e.lendingSource);
      const cReturnCash= getAllReturnRecords(tripId, cCode).filter(r=>r.dest==='現金');
      allRows = allRows.concat([
        ...cLedger.filter(e=>e.type==='入帳').map(r=>({date:r.date,label:'＋入帳',sub:r.note||'',amount:+(parseFloat(r.amount)||0),cCode,id:r.id,action:'cashLedger'})),
        ...cLendExps.map(e=>({date:e.date,label:'📤借出',sub:e.lendingTarget||'',amount:-(parseFloat(e.amount)||0),cCode,id:e.id,action:'personal'})),
        ...cReturnCash.map(r=>({date:r.date,label:'💰收回',sub:r.target||r.lendingTarget||'',amount:+(parseFloat(r.amount)||0),cCode,id:r.id,action:'return'})),
        ...(state.personalEpayLedger||[]).filter(e=>e.tripId===tripId&&e.source==='現金'&&currCode(e.currency||lc)===cCode).map(e=>({date:e.date,label:'📱儲值',sub:'電子支付',amount:-(parseFloat(e.amount)||0),cCode,id:e.id,action:'toEpay'})),
        ...cExps.filter(e=>e.paymentMethod==='現金'&&e.category!=='金流').map(e=>({date:e.date,label:'－花費',sub:e.item,amount:-(parseFloat(e.amount)||0),cCode,id:e.id,action:'personal'})),
      ]);
    });
    allRows.sort((a,b)=>a.date.localeCompare(b.date));
    const balance = cashIn - cashSpend - cashToEpay - cashLendOut + cashRecvBack;

    // 幣別篩選 chips
    const curChips = `<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
      <span style="font-size:12px;color:#999;align-self:center">幣別:</span>
      <button class="chip ${state.ledgerCashCurFilter==='all'?'active-purple':''}" onclick="state.ledgerCashCurFilter='all';openLedgerTabs('cash')">全部</button>
      ${allCurCodes.map(c=>`<button class="chip ${state.ledgerCashCurFilter===c?'active-purple':''}" onclick="state.ledgerCashCurFilter='${c}';openLedgerTabs('cash')">${c}</button>`).join('')}
    </div>`;

    const rowsHTML = allRows.length ? allRows.map(r=>`
      <div data-row-date="${r.date}" style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5" ${getRowOnClick(r,'cash')}>
        <div>
          <div style="font-size:11px;color:#aaa">${formatDateSimple(r.date)}</div>
          <div style="font-size:13px;font-weight:600">${r.label} ${r.sub?('<span style="color:#999;font-size:11px">'+r.sub+'</span>'):''} ${r.id?'<span style="font-size:10px;color:#ccc">›</span>':''}</div>
        </div>
        <div style="font-size:13px;font-weight:700;color:${r.amount>=0?'var(--green)':'var(--red)'}">${r.amount>=0?'+':''}${fmt(Math.abs(r.amount))} ${r.cCode}</div>
      </div>`).join('') : '<div style="color:#ccc;text-align:center;padding:16px;font-size:13px">尚無記錄</div>';

    // F-3：底部統計依幣別分行
    const summaryHtml = showCashCurs.map(cCode => {
      const cLedger2  = (state.personalCashLedger||[]).filter(e=>e.tripId===tripId&&currCode(e.currency||lc)===cCode);
      const cIn2      = cLedger2.filter(e=>e.type==='入帳').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const cLendOut2 = getDashLendOut(tripId, cCode, '現金');
      const cRecvBack2= getAllReturnRecords(tripId, cCode).filter(r=>r.dest==='現金').reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
      const cToEpay2  = (state.personalEpayLedger||[]).filter(e=>e.tripId===tripId&&e.source==='現金'&&currCode(e.currency||lc)===cCode).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const cExps2    = getTripPersonalExpenses().filter(e=>currCode(e.currency||lc)===cCode);
      const cSpend2   = cExps2.filter(e=>e.paymentMethod==='現金'&&e.category!=='金流').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const cBal2     = cIn2 - cSpend2 - cToEpay2 - cLendOut2 + cRecvBack2;
      if (cIn2===0 && cSpend2===0 && cToEpay2===0 && cLendOut2===0) return '';
      return `<div style="background:#f9fafb;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:12px">
        <div style="font-weight:700;color:#555;margin-bottom:4px">${cCode}</div>
        <div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">總入帳</span><span style="font-weight:600">+${fmt(cIn2)}</span></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">總花費</span><span style="font-weight:600;color:var(--red)">-${fmt(cSpend2)}</span></div>
        ${cToEpay2>0?'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">儲值電子支付</span><span style="font-weight:600;color:var(--red)">-'+fmt(cToEpay2)+'</span></div>':''}
        ${cLendOut2>0?'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">借出</span><span style="font-weight:600;color:#f97316">-'+fmt(cLendOut2)+'</span></div>':''}
        ${cRecvBack2>0?'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">收回</span><span style="font-weight:600;color:var(--green)">+'+fmt(cRecvBack2)+'</span></div>':''}
        <div style="border-top:1px solid #e5e7eb;margin:5px 0 3px"></div>
        <div style="display:flex;justify-content:space-between"><span style="font-weight:700">💰 現金餘額</span><span style="font-size:14px;font-weight:800;color:${cBal2>=0?'var(--green)':'var(--red)'}">${fmt(cBal2)} ${cCode}</span></div>
      </div>`;
    }).join('');

    const html = `
      <div class="modal-header"><span class="modal-title">💵 現金帳本明細</span><button class="close-btn" onclick="closeModal()">✕</button></div>
      ${curChips}
      <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
        <button class="chip active-purple" onclick="filterLedgerDetail('cash','all',this)">全部日期</button>
        ${[...new Set(allRows.map(r=>r.date))].map(d=>`<button class="chip" onclick="filterLedgerDetail('cash','${d}',this)">${formatDateSimple(d)}</button>`).join('')}
      </div>
      <div style="display:flex;gap:6px;margin-bottom:12px;align-items:center">
        <input type="date" id="cash-date-from" style="flex:1;font-size:12px;padding:6px" onchange="filterLedgerDateRange('cash')">
        <span style="color:#aaa;font-size:12px">～</span>
        <input type="date" id="cash-date-to" style="flex:1;font-size:12px;padding:6px" onchange="filterLedgerDateRange('cash')">
      </div>
      <div id="ledger-detail-rows" style="max-height:40vh;overflow-y:auto">${rowsHTML}</div>
      ${summaryHtml}
      <div class="flex-row" style="margin-top:12px;gap:8px">
        <button class="btn btn-green-light" style="flex:1" onclick="closeModal();openLedgerModal()">＋ 現金入帳</button>
        <button class="btn btn-secondary" style="flex:1" onclick="exportLedgerPDF('cash')">📄 匯出</button>
      </div>`;
    showModal(html);

  } else if (type === 'cc') {
    // 信用卡：幣別+日期篩選
    const allCCE = getTripPersonalExpenses().filter(e=>e.paymentMethod==='信用卡'); // 含信用卡儲值
    const ccCurCodes = [...new Set(allCCE.map(e=>currCode(e.currency||lc)))];
    const ccDates    = [...new Set(allCCE.map(e=>e.date))].sort();
    const filtCC = allCCE
      .filter(e=>state.ledgerCCCurFilter==='all'||currCode(e.currency||lc)===state.ledgerCCCurFilter)
      .filter(e=>state.ledgerCCDateFilter==='all'||e.date===state.ledgerCCDateFilter);

    const ccCurChips = `<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
      <span style="font-size:12px;color:#999;align-self:center">幣別:</span>
      <button class="chip ${state.ledgerCCCurFilter==='all'?'active-purple':''}" onclick="state.ledgerCCCurFilter='all';openLedgerTabs('cc')">全部</button>
      ${ccCurCodes.map(c=>`<button class="chip ${state.ledgerCCCurFilter===c?'active-purple':''}" onclick="state.ledgerCCCurFilter='${c}';openLedgerTabs('cc')">${c}</button>`).join('')}
    </div>`;
    const ccDateChips = `<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
      <span style="font-size:12px;color:#999;align-self:center">日期:</span>
      <button class="chip ${state.ledgerCCDateFilter==='all'?'active-purple':''}" onclick="state.ledgerCCDateFilter='all';openLedgerTabs('cc')">全部</button>
      ${ccDates.map(d=>`<button class="chip ${state.ledgerCCDateFilter===d?'active-purple':''}" onclick="state.ledgerCCDateFilter='${d}';openLedgerTabs('cc')">${formatDateSimple(d)}</button>`).join('')}
    </div>`;

    const gbt = e => e.billingType||(((e.currency||lc)===hc)?'domestic':'twd');
    const fxTwd  = filtCC.filter(e=>gbt(e)==='twd'&&currCode(e.currency||lc)!==currCode(hc)).sort((a,b)=>a.date.localeCompare(b.date));
    const fxOrig = filtCC.filter(e=>gbt(e)==='original').sort((a,b)=>a.date.localeCompare(b.date));
    const dom    = filtCC.filter(e=>gbt(e)==='domestic'||currCode(e.currency||lc)===currCode(hc)).sort((a,b)=>a.date.localeCompare(b.date));
    const fmtCCR = e => {
      const bt=gbt(e), fb=bt==='twd'?parseFloat(e.twdAmount||0):parseFloat(e.amount||0);
      const fee=e.feeRate?Math.round(fb*parseFloat(e.feeRate||0)/100):0;
      const cCode=currCode(e.currency||lc);
      const isPend=bt==='twd'&&!e.twdAmount&&cCode!==currCode(hc);
      let bstr='';
      if(bt==='domestic')bstr='<span style="font-size:11px;color:var(--blue)">'+currCode(hc)+' '+fmt(e.amount||0)+(fee>0?'+'+fmt(fee)+'='+fmt(parseFloat(e.amount||0)+fee):'')+'</span>';
      else if(bt==='twd'&&e.twdAmount)bstr='<span style="font-size:11px;color:var(--blue)">'+currCode(hc)+' '+fmt(e.twdAmount)+'+'+fmt(fee)+'='+fmt(parseFloat(e.twdAmount||0)+fee)+'</span>';
      else if(bt==='original')bstr='<span style="font-size:11px;color:#6366f1">'+cCode+' '+fmt(e.amount||0)+'+'+fmt(fee)+'='+fmt(parseFloat(e.amount||0)+fee)+'</span>';
      else if(isPend)bstr='<span style="font-size:11px;color:#f97316;font-weight:600">⚠️ 待確認</span>';
      return `<div class="overview-row" style="cursor:pointer" onclick="openPersonalDetail('${e.id}',()=>openLedgerTabs('cc'))"><div style="flex:1"><div class="overview-date">${formatDateSimple(e.date)}</div><div class="overview-label">💳 ${e.item}</div>${bstr}</div>
        <div style="text-align:right"><div class="overview-amt overview-neg">${cCode} ${fmt(e.amount)}</div></div></div>`;
    };
    const fxTwdBilled=fxTwd.filter(e=>e.twdAmount).reduce((s,e)=>{const f=Math.round(parseFloat(e.twdAmount||0)*(parseFloat(e.feeRate)||0)/100);return s+parseFloat(e.twdAmount||0)+f;},0);
    const domBilled=dom.reduce((s,e)=>{const f=Math.round(parseFloat(e.amount||0)*(parseFloat(e.feeRate)||0)/100);return s+parseFloat(e.amount||0)+f;},0);
    const origBC={};fxOrig.forEach(e=>{const c2=currCode(e.currency||lc);const f=Math.round(parseFloat(e.amount||0)*(parseFloat(e.feeRate)||0)/100);origBC[c2]=(origBC[c2]||0)+parseFloat(e.amount||0)+f;});
    const totTwdB=fxTwdBilled+domBilled;
    const pend=fxTwd.filter(e=>!e.twdAmount).length;

    let ccHTML='';
    ccHTML+=`<div style="background:#f0f9ff;border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:12px;font-weight:700;color:#0369a1">海外刷卡 → 換算 ${currCode(hc)} 請款</div>`;
    ccHTML+=fxTwd.length?fxTwd.map(fmtCCR).join(''):'<div style="color:#ccc;text-align:center;padding:10px;font-size:12px">尚無記錄</div>';
    if(fxTwdBilled>0)ccHTML+=`<div style="text-align:right;font-size:11px;color:#0369a1;font-weight:600;padding:4px 0">小計 ${currCode(hc)} ${fmt(fxTwdBilled)}</div>`;
    ccHTML+=`<div style="background:#f5f3ff;border-radius:8px;padding:8px 12px;margin:10px 0 8px;font-size:12px;font-weight:700;color:#6366f1">海外刷卡 → 維持原幣請款</div>`;
    ccHTML+=fxOrig.length?fxOrig.map(fmtCCR).join(''):'<div style="color:#ccc;text-align:center;padding:10px;font-size:12px">尚無記錄</div>';
    Object.entries(origBC).forEach(([c2,v])=>{ccHTML+=`<div style="text-align:right;font-size:11px;color:#6366f1;font-weight:600;padding:2px 0">原幣請款 ${c2} ${fmt(v)}</div>`;});
    ccHTML+=`<div style="background:#f0fdf4;border-radius:8px;padding:8px 12px;margin:10px 0 8px;font-size:12px;font-weight:700;color:#15803d">國內刷卡（${currCode(hc)}）</div>`;
    ccHTML+=dom.length?dom.map(fmtCCR).join(''):'<div style="color:#ccc;text-align:center;padding:10px;font-size:12px">尚無記錄</div>';
    ccHTML+=`<div style="background:#f9fafb;border-radius:10px;padding:12px;margin-top:12px;font-size:13px">`;
    if(fxTwdBilled>0)ccHTML+=`<div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="color:#666">海外換算請款</span><span style="font-weight:600;color:var(--blue)">${currCode(hc)} ${fmt(fxTwdBilled)}</span></div>`;
    if(domBilled>0)ccHTML+=`<div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="color:#666">國內刷卡</span><span style="font-weight:600;color:var(--blue)">${currCode(hc)} ${fmt(domBilled)}</span></div>`;
    Object.entries(origBC).forEach(([c2,v])=>{ccHTML+=`<div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="color:#666">原幣請款（${c2}）</span><span style="font-weight:600;color:#6366f1">${c2} ${fmt(v)}</span></div>`;});
    ccHTML+=`<div style="border-top:1px solid #e5e7eb;margin:8px 0 5px"></div>`;
    ccHTML+=`<div style="display:flex;justify-content:space-between"><span style="font-weight:700">🏦 ${currCode(hc)} 請款總額</span><span style="font-size:15px;font-weight:800;color:var(--blue)">${currCode(hc)} ${fmt(totTwdB)}</span></div>`;
    ccHTML+=pend>0?'<div style="display:flex;justify-content:space-between;margin-top:4px"><span style="color:#f97316;font-weight:600">⚠️ 待請款</span><span style="color:#f97316;font-weight:700">'+pend+' 筆</span></div>':'<div style="font-size:11px;color:var(--green);margin-top:4px">✅ 全數已填</div>';
    // F-5：各幣別消費→請款統計
    const ccAllCurCodes = [...new Set(filtCC.map(e=>currCode(e.currency||lc)))];
    let ccByCurHtml = '';
    ccAllCurCodes.forEach(cCode=>{
      const cExps = filtCC.filter(e=>currCode(e.currency||lc)===cCode);
      const cTotal = cExps.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      if (cTotal===0) return;
      const cTwdBilled = cExps.filter(e=>gbt(e)==='twd'&&e.twdAmount).reduce((s,e)=>{
        const f=Math.round(parseFloat(e.twdAmount||0)*(parseFloat(e.feeRate)||0)/100);
        return s+parseFloat(e.twdAmount||0)+f;
      },0);
      const cTwdBase = cExps.filter(e=>gbt(e)==='twd'&&e.twdAmount).reduce((s,e)=>s+parseFloat(e.twdAmount||0),0);
      const cTwdFee  = cTwdBilled - cTwdBase;
      const cDomBilled = cExps.filter(e=>gbt(e)==='domestic').reduce((s,e)=>{
        const f=Math.round(parseFloat(e.amount||0)*(parseFloat(e.feeRate)||0)/100);
        return s+parseFloat(e.amount||0)+f;
      },0);
      const cDomBase = cExps.filter(e=>gbt(e)==='domestic').reduce((s,e)=>s+parseFloat(e.amount||0),0);
      const cDomFee  = cDomBilled - cDomBase;
      const cOrigBilled = cExps.filter(e=>gbt(e)==='original').reduce((s,e)=>{
        const f=Math.round(parseFloat(e.amount||0)*(parseFloat(e.feeRate)||0)/100);
        return s+parseFloat(e.amount||0)+f;
      },0);
      const cOrigBase = cExps.filter(e=>gbt(e)==='original').reduce((s,e)=>s+parseFloat(e.amount||0),0);
      const cOrigFee  = cOrigBilled - cOrigBase;
      const cPend = cExps.filter(e=>gbt(e)==='twd'&&!e.twdAmount).length;
      ccByCurHtml += '<div style="margin-bottom:8px;padding:8px 10px;background:#f8faff;border-radius:8px;border-left:3px solid var(--blue)">'
        +'<div style="font-size:12px;font-weight:700;color:#0369a1;margin-bottom:4px">'+cCode+' 刷卡消費</div>'
        +'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span style="color:#666">原始刷卡總額</span><span style="font-weight:600">'+cCode+' '+fmt(cTotal)+'</span></div>'
        +(cTwdBilled>0?'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span style="color:#0369a1">→ 換算 '+currCode(hc)+' 請款 '+(cTwdFee>0?'('+fmt(cTwdBase)+'+'+fmt(cTwdFee)+')':'')+'</span><span style="font-weight:600;color:#0369a1">'+currCode(hc)+' '+fmt(cTwdBilled)+'</span></div>':'')
        +(cDomBilled>0&&cCode===currCode(hc)?'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span style="color:#059669">→ 國內 '+currCode(hc)+' 請款 '+(cDomFee>0?'('+fmt(cDomBase)+'+'+fmt(cDomFee)+')':'')+'</span><span style="font-weight:600;color:#059669">'+currCode(hc)+' '+fmt(cDomBilled)+'</span></div>':'')
        +(cOrigBilled>0?'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span style="color:#6366f1">→ 原幣請款 '+(cOrigFee>0?'('+fmt(cOrigBase)+'+'+fmt(cOrigFee)+')':'')+'</span><span style="font-weight:600;color:#6366f1">'+cCode+' '+fmt(cOrigBilled)+'</span></div>':'')
        +(cPend>0?'<div style="font-size:11px;color:#f97316;font-weight:600;margin-top:2px">⚠️ 待請款 '+cPend+' 筆</div>':'')
        +'</div>';
    });

    ccHTML+=`<div style="margin-top:12px"><div style="font-size:13px;font-weight:700;color:#333;margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:4px">各幣別消費統計</div>${ccByCurHtml}</div>`;

    const html = `<div class="modal-header"><span class="modal-title">💳 信用卡消費明細</span><button class="close-btn" onclick="closeModal()">✕</button></div>`
      +ccCurChips+ccDateChips
      +`<div id="ledger-detail-rows" style="max-height:55vh;overflow-y:auto">${ccHTML}</div>`
      +`<div class="flex-row" style="margin-top:12px;gap:8px">`
      +`<button class="btn btn-purple" style="flex:1" onclick="closeModal();openPersonalForm()">＋ 新增花費</button>`
      +`<button class="btn btn-secondary" style="flex:1" onclick="exportLedgerPDF(\'cc\')">📄 匯出</button></div>`;
    showModal(html);

  } else if (type === 'epay') {
    const showEpayCurs = state.ledgerEpayCurFilter === 'all' ? allCurCodes : [state.ledgerEpayCurFilter];
    let allEpayRows=[], epayIn=0, epaySpend=0, lendOut=0, recvBack=0;

    showEpayCurs.forEach(cCode=>{
      const cLedger=(state.personalEpayLedger||[]).filter(e=>e.tripId===tripId&&currCode(e.currency||lc)===cCode);
      const cIn=cLedger.filter(e=>e.type==='儲值').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const cLend=cLedger.filter(e=>e.type==='借出').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const cRecv=cLedger.filter(e=>e.type==='收回').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const cExps=getTripPersonalExpenses().filter(e=>currCode(e.currency||lc)===cCode);
      const cSpend=cExps.filter(e=>e.paymentMethod==='電子支付'&&e.category!=='金流').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      epayIn+=cIn; lendOut+=cLend; recvBack+=cRecv; epaySpend+=cSpend;
      allEpayRows=allEpayRows.concat([
        ...cLedger.map(r=>({date:r.date,label:r.type==='儲值'?('＋儲值('+(r.source||')')+')'):(r.type==='借出'?'📤借出':'💰收回'),sub:r.note||(r.target||''),amount:r.type==='儲值'||r.type==='收回'?parseFloat(r.amount||0):-parseFloat(r.amount||0),cCode,id:r.id,action:r.type==='儲值'?'epayLedger':r.type==='收回'?'return':'personal'})),
        ...cExps.filter(e=>e.paymentMethod==='電子支付'&&e.category!=='金流').map(e=>({date:e.date,label:'-花費',sub:e.item,amount:-(parseFloat(e.amount)||0),cCode,id:e.id,action:'personal'})),
      ]);
    });
    const epayBal=epayIn-epaySpend-lendOut+recvBack;

    const epayCurChips=`<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
      <span style="font-size:12px;color:#999;align-self:center">幣別:</span>
      <button class="chip ${state.ledgerEpayCurFilter==='all'?'active-purple':''}" onclick="state.ledgerEpayCurFilter='all';openLedgerTabs('epay')">全部</button>
      ${allCurCodes.map(c=>`<button class="chip ${state.ledgerEpayCurFilter===c?'active-purple':''}" onclick="state.ledgerEpayCurFilter='${c}';openLedgerTabs('epay')">${c}</button>`).join('')}
    </div>`;

    const epayRowsHTML=allEpayRows.length?allEpayRows.map(r=>`
      <div data-row-date="${r.date}" style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5" ${getRowOnClick(r,'epay')}>
        <div>
          <div style="font-size:11px;color:#aaa">${formatDateSimple(r.date)}</div>
          <div style="font-size:13px;font-weight:600">${r.label} ${r.sub?('<span style="color:#999;font-size:11px">'+r.sub+'</span>'):''} ${r.id?'<span style="font-size:10px;color:#ccc">›</span>':''}</div>
        </div>
        <div style="font-size:13px;font-weight:700;color:${r.amount>=0?'var(--green)':'var(--red)'}">${r.amount>=0?'+':''}${fmt(Math.abs(r.amount))} ${r.cCode}</div>
      </div>`).join(''):'<div style="color:#ccc;text-align:center;padding:16px;font-size:13px">尚無記錄</div>';

    // F-4：底部統計依幣別分行
    const epaySummaryHtml = showEpayCurs.map(cCode => {
      const cLedger2  = (state.personalEpayLedger||[]).filter(e=>e.tripId===tripId&&currCode(e.currency||lc)===cCode);
      const cIn2      = cLedger2.filter(e=>e.type==='儲值').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const cLend2    = cLedger2.filter(e=>e.type==='借出').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const cRecv2    = cLedger2.filter(e=>e.type==='收回').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const cExps2    = getTripPersonalExpenses().filter(e=>currCode(e.currency||lc)===cCode);
      const cSpend2   = cExps2.filter(e=>e.paymentMethod==='電子支付'&&e.category!=='金流').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const cBal2     = cIn2 - cSpend2 - cLend2 + cRecv2;
      if (cIn2===0 && cSpend2===0 && cLend2===0) return '';
      return '<div style="background:#f9fafb;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:12px">'
        +'<div style="font-weight:700;color:#555;margin-bottom:4px">'+cCode+'</div>'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">總儲值</span><span style="font-weight:600">+'+fmt(cIn2)+'</span></div>'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">總花費</span><span style="font-weight:600;color:var(--red)">-'+fmt(cSpend2)+'</span></div>'
        +(cLend2>0?'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">借出</span><span style="font-weight:600;color:#f97316">-'+fmt(cLend2)+'</span></div>':'')
        +(cRecv2>0?'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">收回</span><span style="font-weight:600;color:var(--green)">+'+fmt(cRecv2)+'</span></div>':'')
        +'<div style="border-top:1px solid #e5e7eb;margin:5px 0 3px"></div>'
        +'<div style="display:flex;justify-content:space-between"><span style="font-weight:700">📱 電子支付餘額</span><span style="font-size:14px;font-weight:800;color:'+(cBal2>=0?'var(--green)':'var(--red)')+'">'+fmt(cBal2)+' '+cCode+'</span></div>'
        +'</div>';
    }).join('');

    const html=`<div class="modal-header"><span class="modal-title">📱 電子支付明細</span><button class="close-btn" onclick="closeModal()">✕</button></div>
      ${epayCurChips}
      <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
        <button class="chip active-purple" onclick="filterLedgerDetail('epay','all',this)">全部日期</button>
        ${ [...new Set(allEpayRows.map(r=>r.date))].map(d=>'<button class="chip" onclick="filterLedgerDetail(\'epay\',\''+d+'\',this)">'+formatDateSimple(d)+'</button>').join('') }
      </div>
      <div style="display:flex;gap:6px;margin-bottom:12px;align-items:center">
        <input type="date" id="epay-date-from" style="flex:1;font-size:12px;padding:6px" onchange="filterLedgerDateRange('epay')">
        <span style="color:#aaa;font-size:12px">～</span>
        <input type="date" id="epay-date-to" style="flex:1;font-size:12px;padding:6px" onchange="filterLedgerDateRange('epay')">
      </div>
      <div id="ledger-detail-rows" style="max-height:40vh;overflow-y:auto">${epayRowsHTML}</div>
      ${epaySummaryHtml}
      <div class="flex-row" style="margin-top:12px;gap:8px">
        <button class="btn btn-green-light" style="flex:1" onclick="closeModal();openEpayLedgerForm()">＋ 電子支付儲值</button>
        <button class="btn btn-secondary" style="flex:1" onclick="exportLedgerPDF('epay')">📄 匯出</button>
      </div>`;
    showModal(html);
  }
}

  state.modalBackFn = backFn || null;
  const lc = localCur();
  const html = `<div class="modal-header"><span class="modal-title">💰 收回借款詳情</span><button class="close-btn" onclick="closeModal()">✕</button></div>
    <div class="detail-label">類型</div><div class="detail-value"><span class="badge badge-orange">收回借出款</span></div>
    <div style="display:flex;gap:20px">
      <div style="flex:1"><div class="detail-label">日期</div><div class="detail-value">${r.date}</div></div>
      <div style="flex:1"><div class="detail-label">幣別</div><div class="detail-value">${currCode(r.currency||lc)}</div></div>
    </div>
    <div class="detail-label">收回金額</div>
    <div class="detail-value" style="font-size:20px;font-weight:800;color:var(--green)">${currCode(r.currency||lc)} ${fmt(r.amount)}</div>
    ${r.lendingTarget?`<div class="detail-label">還款人</div><div class="detail-value">${r.lendingTarget}</div>`:''}
    ${r.dest?`<div class="detail-label">存入方式</div><div class="detail-value">${r.dest}</div>`:''}
    <div class="detail-label">備註</div>
    <div style="background:#f9fafb;padding:12px;border-radius:8px;font-size:14px;margin-bottom:20px">${r.notes||'無'}</div>
    <div class="flex-row">
      ${state.modalBackFn?`<button class="btn btn-secondary" style="flex:1" onclick="state.modalBackFn&&state.modalBackFn()">← 返回</button>`:`<button class="btn btn-secondary" style="flex:1" onclick="closeModal()">關閉</button>`}
      <button class="btn btn-outline" style="flex:1" onclick="editPersonalExpense('${r.id}')">✏️ 修改</button>
      <button class="btn" style="flex:1;background:var(--red-light);color:var(--red);border:none" onclick="delPersonalExpense('${r.id}');(state.modalBackFn||closeModal)()">🗑️ 刪除</button>
    </div>`;
  showModal(html);
}

function filterLedgerDateRange(type) {
  const from = document.getElementById(type+'-date-from')?.value || '';
  const to   = document.getElementById(type+'-date-to')?.value || '';
  const container = document.getElementById('ledger-detail-rows');
  if (!container) return;
  // 清除快選按鈕的 active 狀態
  document.querySelectorAll('.chip.active-purple').forEach(b=>b.classList.remove('active-purple'));
  container.querySelectorAll('[data-row-date]').forEach(row=>{
    const d = row.dataset.rowDate || '';
    const show = (!from||d>=from) && (!to||d<=to);
    row.style.display = show ? '' : 'none';
  });
}

function filterLedgerDetail(type, date, btn) {
  // 切換日期篩選按鈕樣式
  btn.closest('div').querySelectorAll('button').forEach(b=>b.classList.remove('active-purple'));
  btn.classList.add('active-purple');
  const container = document.getElementById('ledger-detail-rows');
  if (!container) return;
  container.querySelectorAll('div[style*="border-bottom"]').forEach(row=>{
    if (date === 'all') { row.style.display=''; return; }
    const dateEl = row.querySelector('div[style*="color:#aaa"]');
    row.style.display = dateEl&&dateEl.textContent===formatDateSimple(date) ? '' : 'none';
  });
}

function showPendingBillingList() {
  const lc = localCur(), hc = habitCur(), cur = state.pfDashCurrency||lc;
  const allExps = getTripPersonalExpenses().filter(e=>(e.currency||lc)===cur);
  const pending = allExps.filter(e=>e.paymentMethod==='信用卡'&&!e.twdAmount&&e.currency!==hc);
  const rowsHTML = pending.map(e=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f5f5f5">
      <div>
        <div style="font-size:11px;color:#aaa">${formatDateSimple(e.date)}</div>
        <div style="font-size:14px;font-weight:600">${e.item}</div>
        <div style="font-size:12px;color:var(--red)">${e.currency} ${fmt(e.amount)}</div>
      </div>
      <button style="background:var(--purple);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer" onclick="closeModal();editPersonalExpense('${e.id}')">✏️ 補填</button>
    </div>`).join('');
  const html = `
    <div class="modal-header">
      <span class="modal-title">⚠️ 待確認請款（${pending.length}筆）</span>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <p style="font-size:12px;color:#aaa;margin-bottom:12px">以下為尚未填寫台幣請款金額的信用卡花費，點「補填」逐筆確認。</p>
    ${rowsHTML}`;
  showModal(html);
}

function exportLedgerPDF(type) {
  const t = state.currentTrip;
  if (!t) return;
  const lc = localCur(), hc = habitCur();
  const tripId = t.id;
  const tripCurCodes = [...new Set([...getTripCurrencies().map(c=>currCode(c)), currCode(hc)])];
  const localCCs = tripCurCodes.filter(c=>c!==currCode(hc));
  const now = new Date().toLocaleString('zh-TW');
  let printArea = document.getElementById('print-area');
  if (!printArea) { printArea=document.createElement('div'); printArea.id='print-area'; document.body.appendChild(printArea); }

  const fmtP = n => { const v=parseFloat(n)||0; return v===Math.round(v)?Math.round(v).toLocaleString():v.toFixed(1); };

  // 通用列渲染：花費項目名稱+備註分段+細項
  const fmtExpRow = (e, amtOverride) => {
    const cCode=currCode(e.currency||lc);
    const amt=amtOverride!==undefined?amtOverride:-parseFloat(e.amount||0);
    const details=(e.details||[]).filter(d=>d.desc||d.amount);
    const hasBorder=details.length===0;
    const notesLines=(e.notes||'').trim().split('\n').map(l=>l.trim()).filter(l=>l);
    const noteHtml=[e.paymentMethod||'',...notesLines].filter(l=>l).join('<br>');
    const feeAmt=e.feeRate&&e.twdAmount?Math.round(parseFloat(e.twdAmount||0)*parseFloat(e.feeRate||0)/100):0;
    let itemHtml=e.item||'';
    if(e.paymentMethod==='\u4fe1\u7528\u5361'&&e.twdAmount) itemHtml+=`<br><span style="font-size:10px;color:#9ca3af">\u8acb\u6b3e ${currCode(hc)} ${e.twdAmount}${feeAmt>0?'+'+feeAmt:''}</span>`;
    const tdS=`padding:7px 8px;${hasBorder?'border-bottom:1px solid #f0f0f0;':''}`;
    let rows=`<tr>
      <td style="${tdS}white-space:nowrap;color:#888;font-size:12px">${formatDateSimple(e.date)}</td>
      <td style="${tdS}font-size:13px">${itemHtml}</td>
      <td style="${tdS}text-align:center;font-size:12px;color:#666">${cCode}</td>
      <td style="${tdS}text-align:right;font-weight:700;color:${amt>=0?'#10b981':'#ef4444'};font-size:13px">${amt>=0?'+':''}${fmtP(Math.abs(amt))}</td>
      <td style="${tdS}font-size:11px;color:#888">${noteHtml}</td>
    </tr>`;
    details.forEach((d,idx)=>{
      const isLast=idx===details.length-1;
      const dCur=d.currency?currCode(d.currency):cCode;
      const bdr=isLast?'border-bottom:1px solid #f0f0f0;':'';
      rows+=`<tr style="background:#fafafa">
        <td style="padding:1px 8px;${bdr}"></td>
        <td style="padding:1px 8px 1px 16px;font-size:11px;color:#888;${bdr}">└ ${d.desc||''}</td>
        <td style="padding:1px 8px;font-size:11px;color:#888;text-align:center;${bdr}">${dCur}</td>
        <td style="padding:1px 8px;font-size:11px;color:#888;text-align:right;font-weight:600;${bdr}">${d.amount?fmtP(d.amount):''}</td>
        <td style="padding:1px 8px;${bdr}"></td>
      </tr>`;
    });
    return rows;
  };

  const tblHdr=(title,color)=>`<table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr style="background:${color};color:#fff"><th style="padding:7px 8px">\u65e5\u671f</th><th style="padding:7px 8px">\u9805\u76ee</th><th style="padding:7px 8px;text-align:center">\u5e63\u5225</th><th style="padding:7px 8px;text-align:right">\u91d1\u984d</th><th style="padding:7px 8px">\u5099\u8a3b</th></tr></thead><tbody>`;
  const ledgerSimpleRow=(date,label,cCode,amt,note)=>`<tr style="border-bottom:1px solid #f0f0f0"><td style="padding:7px 8px;white-space:nowrap;color:#888;font-size:12px">${formatDateSimple(date)}</td><td style="padding:7px 8px;font-size:13px">${label}</td><td style="padding:7px 8px;text-align:center;font-size:12px;color:#666">${cCode}</td><td style="padding:7px 8px;text-align:right;font-weight:700;color:${amt>=0?'#10b981':'#ef4444'};font-size:13px">${amt>=0?'+':''}${fmtP(Math.abs(amt))}</td><td style="padding:7px 8px;font-size:11px;color:#888">${note||''}</td></tr>`;

  if (type === 'cash') {
    const cashLedger = (state.personalCashLedger||[]).filter(e=>e.tripId===tripId).sort((a,b)=>a.date.localeCompare(b.date));
    const cashExps   = getTripPersonalExpenses().filter(e=>e.paymentMethod==='現金'&&e.category!=='金流');
    const lendRecs   = getTripPersonalExpenses().filter(e=>e.isLending);
    const retRecs    = getTripPersonalExpenses().filter(e=>e.isReturning);
    const epayToRecs = (state.personalEpayLedger||[]).filter(e=>e.tripId===tripId&&e.source==='現金');
    const allRows = [
      ...cashLedger.map(r=>({date:r.date,label:'💵 現金兌換',cur:currCode(r.currency||lc),amt:parseFloat(r.amount||0),note:r.note||''})),
      ...lendRecs.map(e=>({date:e.date,label:'📤 借出：'+e.lendingTarget,cur:currCode(e.currency||lc),amt:-parseFloat(e.amount||0),note:''})),
      ...retRecs.map(e=>({date:e.date,label:'💰 收回：'+(e.lendingTarget||''),cur:currCode(e.currency||lc),amt:parseFloat(e.amount||0),note:''})),
      ...epayToRecs.map(e=>({date:e.date,label:'📱 儲值電子支付',cur:currCode(e.currency||lc),amt:-parseFloat(e.amount||0),note:''})),
      ...cashExps.map(e=>({date:e.date,label:'－ '+e.item+' ('+e.category+')',cur:currCode(e.currency||lc),amt:-parseFloat(e.amount||0),note:''})),
    ].sort((a,b)=>a.date.localeCompare(b.date));

    // 帳本記錄（入帳/借出/收回/儲值）用簡單列，花費記錄用 fmtExpRow（含細項+備註分段）
    let html = PDF_CSS+'<div class="a4-page">';
    html += `<div class="report-header-all"><div class="report-title">💵 現金帳本明細</div><div style="font-size:12px;color:#888;margin-top:4px">${t.name} | ${now}</div></div>`;
    html += tblHdr('現金帳本','#10b981');
    cashLedger.forEach(r=>{ html += ledgerSimpleRow(r.date,'💵 現金兌換',currCode(r.currency||lc),parseFloat(r.amount||0),r.note||''); });
    lendRecs.forEach(e=>{ html += ledgerSimpleRow(e.date,'📤 借出：'+e.lendingTarget,currCode(e.currency||lc),-parseFloat(e.amount||0),(e.notes||'').split('\n')[0]||''); });
    retRecs.forEach(e=>{ html += ledgerSimpleRow(e.date,'💰 收回：'+(e.lendingTarget||''),currCode(e.currency||lc),parseFloat(e.amount||0),(e.notes||'').split('\n')[0]||''); });
    epayToRecs.forEach(e=>{ html += ledgerSimpleRow(e.date,'📱 儲值電子支付',currCode(e.currency||lc),-parseFloat(e.amount||0),e.note||''); });
    cashExps.sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{ html += fmtExpRow(e); });
    html += '</tbody></table>';
    html += '</tbody></table>';
    html += '<div style="margin-top:16px;padding:12px;background:#f0fdf4;border-radius:8px;font-size:13px"><div style="font-weight:700;margin-bottom:8px;color:#15803d">各幣別現金餘額匯總</div>';
    localCCs.forEach(cCode=>{
      const cIn   = cashLedger.filter(r=>currCode(r.currency||lc)===cCode&&r.type==='入帳').reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
      const cSpend= cashExps.filter(e=>currCode(e.currency||lc)===cCode).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const cLend = lendRecs.filter(e=>currCode(e.currency||lc)===cCode).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const cRet  = retRecs.filter(e=>currCode(e.currency||lc)===cCode).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const cToEp = epayToRecs.filter(e=>currCode(e.currency||lc)===cCode).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const bal = cIn-cSpend-cLend+cRet-cToEp;
      html += `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #dcfce7"><span>${cCode}</span><span style="font-weight:700;color:${bal>=0?'#15803d':'#dc2626'}">${fmtP(bal)} ${cCode}</span></div>`;
    });
    html += '</div></div>';
    printArea.innerHTML = html;
    showPrintToast(()=>window.print());

  } else if (type === 'cc') {
    const ccExps = getTripPersonalExpenses().filter(e=>e.paymentMethod==='信用卡');
    const gbt = e => e.billingType||(currCode(e.currency||lc)===currCode(hc)?'domestic':'twd');
    const fxTwd  = ccExps.filter(e=>gbt(e)==='twd'&&currCode(e.currency||lc)!==currCode(hc)).sort((a,b)=>a.date.localeCompare(b.date));
    const fxOrig = ccExps.filter(e=>gbt(e)==='original').sort((a,b)=>a.date.localeCompare(b.date));
    const dom    = ccExps.filter(e=>gbt(e)==='domestic'||currCode(e.currency||lc)===currCode(hc)).sort((a,b)=>a.date.localeCompare(b.date));

    const ccTable = (exps) => exps.length ? exps.map(e=>fmtExpRow(e)).join('') : `<tr><td colspan="5" style="text-align:center;color:#aaa;padding:12px">尚無記錄</td></tr>`;

    // 統計
    const fxTwdBilled = fxTwd.filter(e=>e.twdAmount).reduce((s,e)=>{const f=Math.round(parseFloat(e.twdAmount||0)*(parseFloat(e.feeRate)||0)/100);return s+parseFloat(e.twdAmount||0)+f;},0);
    const domBilled   = dom.reduce((s,e)=>{const f=Math.round(parseFloat(e.amount||0)*(parseFloat(e.feeRate)||0)/100);return s+parseFloat(e.amount||0)+f;},0);
    const origBC = {}; fxOrig.forEach(e=>{const c2=currCode(e.currency||lc),f=Math.round(parseFloat(e.amount||0)*(parseFloat(e.feeRate)||0)/100);origBC[c2]=(origBC[c2]||0)+parseFloat(e.amount||0)+f;});
    const pend = fxTwd.filter(e=>!e.twdAmount).length;

    const sectionHdr = (title, color) => `<div style="margin:12px 0 6px;padding:6px 10px;font-size:13px;font-weight:700;color:${color};border-left:4px solid ${color};background:#fafafa">${title}</div>`;
    const tblWrap = (rows, color) => tblHdr('',color||'#4b5563')+rows+'</tbody></table>';

    let html = PDF_CSS+'<div class="a4-page">';
    html += `<div class="report-header-all"><div class="report-title">💳 信用卡消費明細</div><div style="font-size:12px;color:#888;margin-top:4px">${t.name} | ${now}</div></div>`;
    html += sectionHdr('🌍 海外刷卡 → 換算 '+currCode(hc)+' 請款','#3b82f6');
    html += tblWrap(ccTable(fxTwd),'#3b82f6');
    html += sectionHdr('💱 海外刷卡 → 維持原幣請款','#a855f7');
    html += tblWrap(ccTable(fxOrig),'#a855f7');
    html += sectionHdr('🇹🇼 國內刷卡 ('+currCode(hc)+')','#10b981');
    html += tblWrap(ccTable(dom),'#10b981');

    // 各幣別消費統計
    html += '<div style="margin-top:16px;padding:12px;background:#f8faff;border-radius:8px;font-size:12px"><div style="font-weight:700;margin-bottom:8px;color:#1d4ed8">各幣別消費統計</div>';
    const ccAllCurs = [...new Set(ccExps.map(e=>currCode(e.currency||lc)))];
    ccAllCurs.forEach(cCode=>{
      const cExps=ccExps.filter(e=>currCode(e.currency||lc)===cCode);
      const cTotal=cExps.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const cTwdB=cExps.filter(e=>gbt(e)==='twd'&&e.twdAmount).reduce((s,e)=>{const f=Math.round(parseFloat(e.twdAmount||0)*(parseFloat(e.feeRate)||0)/100);return s+parseFloat(e.twdAmount||0)+f;},0);
      const cDomB=cCode===currCode(hc)?cExps.filter(e=>gbt(e)==='domestic').reduce((s,e)=>{const f=Math.round(parseFloat(e.amount||0)*(parseFloat(e.feeRate)||0)/100);return s+parseFloat(e.amount||0)+f;},0):0;
      const cOrigB=Object.entries(origBC).filter(([c])=>c===cCode).reduce((s,[,v])=>s+v,0);
      const cPend=cExps.filter(e=>gbt(e)==='twd'&&!e.twdAmount).length;
      html+=`<div style="border:1px solid #dbeafe;border-radius:6px;padding:8px 10px;margin-bottom:6px">`;
      html+=`<div style="font-weight:700;color:#1d4ed8;margin-bottom:4px">${cCode}</div>`;
      html+=`<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">原始刷卡總額</span><span>${cCode} ${fmtP(cTotal)}</span></div>`;
      if(cTwdB>0)html+=`<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#3b82f6">→ 換算${currCode(hc)}請款</span><span style="color:#3b82f6">${currCode(hc)} ${fmtP(cTwdB)}</span></div>`;
      if(cDomB>0)html+=`<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#10b981">→ 國內刷卡</span><span style="color:#10b981">${currCode(hc)} ${fmtP(cDomB)}</span></div>`;
      if(cOrigB>0)html+=`<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:var(--purple)">→ 原幣請款</span><span style="color:var(--purple)">${cCode} ${fmtP(cOrigB)}</span></div>`;
      if(cPend>0)html+=`<div style="color:#f97316;font-size:11px">⚠️ 待請款 ${cPend} 筆</div>`;
      html+=`</div>`;
    });
    html += `<div style="display:flex;justify-content:space-between;font-weight:700;font-size:13px;padding-top:8px;border-top:1px solid #bfdbfe;margin-top:4px"><span>🏦 ${currCode(hc)} 請款總額</span><span style="color:#1d4ed8">${currCode(hc)} ${fmtP(fxTwdBilled+domBilled)}</span></div>`;
    html += pend>0?`<div style="color:#f97316;font-size:12px;margin-top:4px">⚠️ 待請款 ${pend} 筆尚未填入</div>`:'<div style="color:#10b981;font-size:12px;margin-top:4px">✅ 全數已填</div>';
    html += '</div></div>';
    printArea.innerHTML = html;
    showPrintToast(()=>window.print());

  } else if (type === 'epay') {
    const epayLedger = (state.personalEpayLedger||[]).filter(e=>e.tripId===tripId).sort((a,b)=>a.date.localeCompare(b.date));
    const epayExps   = getTripPersonalExpenses().filter(e=>e.paymentMethod==='電子支付'&&e.category!=='金流');
    const allRows = [
      ...epayLedger.map(r=>{
        const typeLabel = r.type==='儲值'?('📱 儲值（'+(r.source||'')+'）'):r.type==='借出'?'📤 借出':'💰 收回';
        const amt = r.type==='儲值'||r.type==='收回'?parseFloat(r.amount||0):-parseFloat(r.amount||0);
        const note = r.type==='儲值'&&r.source==='信用卡'&&r.twdAmount?(function(){var f=Math.round(parseFloat(r.twdAmount||0)*(parseFloat(r.feeRate||0))/100);return '請款 '+currCode(hc)+' '+r.twdAmount+(f>0?'+'+f+'='+(parseFloat(r.twdAmount)+f):'');})():r.note||'';
        return {date:r.date,label:typeLabel,cur:currCode(r.currency||lc),amt,note};
      }),
      ...epayExps.map(e=>({date:e.date,label:'－ '+e.item+' ('+e.category+')',cur:currCode(e.currency||lc),amt:-parseFloat(e.amount||0),note:''})),
    ].sort((a,b)=>a.date.localeCompare(b.date));

    let html = PDF_CSS+'<div class="a4-page">';
    html += `<div class="report-header-all"><div class="report-title">📱 電子支付明細</div><div style="font-size:12px;color:#888;margin-top:4px">${t.name} | ${now}</div></div>`;
    html += tblHdr('電子支付帳本','#8b5cf6');
    epayLedger.forEach(r=>{
      const typeLabel = r.type==='儲值'?('📱 儲值（'+(r.source||'')+'）'):r.type==='借出'?'📤 借出':'💰 收回';
      const amt = r.type==='儲值'||r.type==='收回'?parseFloat(r.amount||0):-parseFloat(r.amount||0);
        const note = r.type==='儲值'&&r.source==='信用卡'&&r.twdAmount?(function(){var f=Math.round(parseFloat(r.twdAmount||0)*(parseFloat(r.feeRate||0))/100);return '請款 '+currCode(hc)+' '+r.twdAmount+(f>0?'+'+f+'='+(parseFloat(r.twdAmount)+f):'');})():r.note||'';
      html += ledgerSimpleRow(r.date,typeLabel,currCode(r.currency||lc),amt,note);
    });
    epayExps.sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{ html += fmtExpRow(e); });
    html += '</tbody></table>';
    html += '<div style="margin-top:16px;padding:12px;background:#f5f3ff;border-radius:8px;font-size:13px"><div style="font-weight:700;margin-bottom:8px;color:var(--purple-dark)">各幣別電子支付餘額</div>';
    localCCs.forEach(cCode=>{
      const eIn   = epayLedger.filter(r=>currCode(r.currency||lc)===cCode&&r.type==='儲值').reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
      const eSpend= epayExps.filter(e=>currCode(e.currency||lc)===cCode).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const eLend = epayLedger.filter(r=>currCode(r.currency||lc)===cCode&&r.type==='借出').reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
      const eRet  = epayLedger.filter(r=>currCode(r.currency||lc)===cCode&&r.type==='收回').reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
      const bal = eIn-eSpend-eLend+eRet;
      html += `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #ede9fe"><span>${cCode}</span><span style="font-weight:700;color:${bal>=0?'#7c3aed':'#dc2626'}">${fmtP(bal)} ${cCode}</span></div>`;
    });
    html += '</div></div>';
    printArea.innerHTML = html;
    showPrintToast(()=>window.print());
  }
}

// ── 三合一帳本明細 Tab ──
function openLedgerTabs(type) {
  if (type) state.ledgerActiveTab = type;
  var t = state.currentTrip; if (!t) return;
  var lc = localCur(), hc = habitCur(), tripId = t.id;
  var at = state.ledgerActiveTab || 'cash';
  var allCurCodes = Array.from(new Set(getTripCurrencies().map(function(c){return currCode(c);}).concat([currCode(hc)])));

  function chip(label, isActive, onclick) {
    return '<button class="chip '+(isActive?'active-purple':'')+'" onclick="'+onclick+'">'+label+'</button>';
  }
  function row(date, label, sub, amt, cCode2, clickAttr) {
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5" '+clickAttr+'>'
      +'<div><div style="font-size:11px;color:#aaa">'+formatDateSimple(date)+'</div>'
      +'<div style="font-size:13px;font-weight:600">'+label+' <span style="color:#999;font-size:11px">'+(sub||'')+'</span>'+(clickAttr?' <span style="font-size:10px;color:#ccc">›</span>':'')+'</div></div>'
      +'<div style="font-size:13px;font-weight:700;color:'+(amt>=0?'var(--green)':'var(--red)')+'">'+( amt>=0?'+':'')+fmt(Math.abs(amt))+' '+cCode2+'</div>'
      +'</div>';
  }

  // ── Tab 標題 ──
  var tabBar = '<div style="display:flex;border-bottom:2px solid var(--border);margin-bottom:12px">';
  [['cash','💵 現金'],['cc','💳 刷卡'],['epay','📱 電子']].forEach(function(item){
    var k=item[0],lb=item[1],active=at===k;
    tabBar += '<button onclick="state.ledgerActiveTab=\''+k+'\';openLedgerTabs()" style="flex:1;padding:10px 4px;border:none;background:'+(active?'#fff':'#f9fafb')+';font-size:13px;font-weight:'+(active?700:500)+';color:'+(active?'var(--purple)':'#888')+';cursor:pointer;border-bottom:'+(active?'2px solid var(--purple)':'2px solid transparent')+';margin-bottom:-2px;white-space:nowrap">'+lb+'</button>';
  });
  tabBar += '</div>';

  var content = '';

  // ━━ 現金 Tab ━━
  if (at === 'cash') {
    var showCurs = state.ledgerCashCurFilter==='all' ? allCurCodes : [state.ledgerCashCurFilter];
    var allRows = [];
    showCurs.forEach(function(cCode2){
      var cLedger = (state.personalCashLedger||[]).filter(function(e){return e.tripId===tripId&&currCode(e.currency||lc)===cCode2;});
      var cExps   = getTripPersonalExpenses().filter(function(e){return currCode(e.currency||lc)===cCode2;});
      var cLend   = getAllLendRecords(tripId,cCode2).filter(function(e){return e.lendingSource==='現金'||!e.lendingSource;});
      var cRet    = getAllReturnRecords(tripId,cCode2).filter(function(r){return r.dest==='現金';});
      var cToEp   = (state.personalEpayLedger||[]).filter(function(e){return e.tripId===tripId&&e.source==='現金'&&currCode(e.currency||lc)===cCode2;});
      allRows = allRows.concat(
        cLedger.filter(function(e){return e.type==='入帳';}).map(function(r){return {date:r.date,label:'＋入帳',sub:r.note||'',amt:parseFloat(r.amount||0),cCode:cCode2,id:r.id,ac:'cashLedger'};}),
        cLend.map(function(e){return {date:e.date,label:'📤借出',sub:e.lendingTarget||'',amt:-parseFloat(e.amount||0),cCode:cCode2,id:e.id,ac:'personal'};}),
        cRet.map(function(r){return {date:r.date,label:'💰收回',sub:r.lendingTarget||'',amt:parseFloat(r.amount||0),cCode:cCode2,id:r.id,ac:'return'};}),
        cToEp.map(function(e){return {date:e.date,label:'📱儲值',sub:'電子支付',amt:-parseFloat(e.amount||0),cCode:cCode2,id:e.id,ac:'toEpay'};}),
        cExps.filter(function(e){return e.paymentMethod==='現金'&&e.category!=='金流';}).map(function(e){return {date:e.date,label:'－花費',sub:e.item,amt:-parseFloat(e.amount||0),cCode:cCode2,id:e.id,ac:'personal'};})
      );
    });
    allRows.sort(function(a,b){return a.date.localeCompare(b.date);});

    function getCashClick(r) {
      if (!r.id) return '';
      var bf = "()=>openLedgerTabs('cash')";
      if (r.ac==='cashLedger') return 'onclick="openCashLedgerDetail(\''+r.id+'\','+bf+')" style="cursor:pointer"';
      if (r.ac==='personal')   return 'onclick="openPersonalDetail(\''+r.id+'\','+bf+')" style="cursor:pointer"';
      if (r.ac==='return')     return 'onclick="openReturnDetail(\''+r.id+'\','+bf+')" style="cursor:pointer"';
      if (r.ac==='toEpay')     return 'onclick="state.ledgerActiveTab=\'epay\';openLedgerTabs()" style="cursor:pointer"';
      return '';
    }

    var curChips = '<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap"><span style="font-size:12px;color:#999;align-self:center">幣別:</span>';
    curChips += chip('全部',state.ledgerCashCurFilter==='all',"state.ledgerCashCurFilter='all';openLedgerTabs()");
    allCurCodes.forEach(function(c){curChips+=chip(c,state.ledgerCashCurFilter===c,"state.ledgerCashCurFilter='"+c+"';openLedgerTabs()");});
    curChips += '</div>';

    var dateChips = '<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap"><button class="chip active-purple" onclick="filterLedgerDetail(\'cash\',\'all\',this)">全部日期</button>';
    Array.from(new Set(allRows.map(function(r){return r.date;}))).forEach(function(d){dateChips+='<button class="chip" onclick="filterLedgerDetail(\'cash\',\''+d+'\',this)">'+formatDateSimple(d)+'</button>';});
    dateChips += '</div>';

    var rowsHTML = allRows.length ? allRows.map(function(r){return row(r.date,r.label,r.sub,r.amt,r.cCode,getCashClick(r));}).join('') : '<div style="color:#ccc;text-align:center;padding:16px;font-size:13px">尚無記錄</div>';

    var sumHTML = showCurs.map(function(cCode2){
      var cl=(state.personalCashLedger||[]).filter(function(e){return e.tripId===tripId&&currCode(e.currency||lc)===cCode2;});
      var cIn=cl.filter(function(e){return e.type==='入帳';}).reduce(function(s,e){return s+(parseFloat(e.amount)||0);},0);
      var cL=getDashLendOut(tripId,cCode2,'現金');
      var cR=getAllReturnRecords(tripId,cCode2).filter(function(r){return r.dest==='現金';}).reduce(function(s,r){return s+(parseFloat(r.amount)||0);},0);
      var cE=(state.personalEpayLedger||[]).filter(function(e){return e.tripId===tripId&&e.source==='現金'&&currCode(e.currency||lc)===cCode2;}).reduce(function(s,e){return s+(parseFloat(e.amount)||0);},0);
      var cS=getTripPersonalExpenses().filter(function(e){return e.paymentMethod==='現金'&&e.category!=='金流'&&currCode(e.currency||lc)===cCode2;}).reduce(function(s,e){return s+(parseFloat(e.amount)||0);},0);
      if(cIn===0&&cS===0&&cL===0) return '';
      var bal=cIn-cS-cE-cL+cR;
      return '<div style="background:#f9fafb;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:12px">'
        +'<div style="font-weight:700;color:#555;margin-bottom:4px">'+cCode2+'</div>'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">總入帳</span><span>+'+fmt(cIn)+'</span></div>'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">總花費</span><span style="color:var(--red)">-'+fmt(cS)+'</span></div>'
        +(cE>0?'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">儲值電子支付</span><span style="color:var(--red)">-'+fmt(cE)+'</span></div>':'')
        +(cL>0?'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">借出</span><span style="color:#f97316">-'+fmt(cL)+'</span></div>':'')
        +(cR>0?'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">收回</span><span style="color:var(--green)">+'+fmt(cR)+'</span></div>':'')
        +'<div style="border-top:1px solid #e5e7eb;margin:5px 0 3px"></div>'
        +'<div style="display:flex;justify-content:space-between"><span style="font-weight:700">💰 現金餘額</span><span style="font-size:14px;font-weight:800;color:'+(bal>=0?'var(--green)':'var(--red)')+'">'+fmt(bal)+' '+cCode2+'</span></div>'
        +'</div>';
    }).join('');

    content = curChips+dateChips
      +'<div id="ledger-detail-rows" style="max-height:40vh;overflow-y:auto">'+rowsHTML+'</div>'
      +sumHTML
      +'<div class="flex-row" style="margin-top:12px;gap:8px">'
      +'<button class="btn btn-green-light" style="flex:1" onclick="closeModal();openLedgerModal()">＋ 現金入帳</button>'
      +'<button class="btn btn-secondary" style="flex:1" onclick="exportLedgerPDF(\'cash\')">📄 匯出PDF</button>'
      +'</div>';

  // ━━ 刷卡 Tab ━━
  } else if (at === 'cc') {
    var allCCE = getTripPersonalExpenses().filter(function(e){return e.paymentMethod==='信用卡';});
    var ccCodes = Array.from(new Set(allCCE.map(function(e){return currCode(e.currency||lc);})));
    var ccDates = Array.from(new Set(allCCE.map(function(e){return e.date;}))).sort();
    var filtCC  = allCCE
      .filter(function(e){return state.ledgerCCCurFilter==='all'||currCode(e.currency||lc)===state.ledgerCCCurFilter;})
      .filter(function(e){return state.ledgerCCDateFilter==='all'||e.date===state.ledgerCCDateFilter;});

    var ccChips = '<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap"><span style="font-size:12px;color:#999;align-self:center">幣別:</span>';
    ccChips += chip('全部',state.ledgerCCCurFilter==='all',"state.ledgerCCCurFilter='all';openLedgerTabs()");
    ccCodes.forEach(function(c){ccChips+=chip(c,state.ledgerCCCurFilter===c,"state.ledgerCCCurFilter='"+c+"';openLedgerTabs()");});
    ccChips += '</div><div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:10px"><span style="font-size:12px;color:#999;align-self:center">日期:</span>';
    ccChips += chip('全部',state.ledgerCCDateFilter==='all',"state.ledgerCCDateFilter='all';openLedgerTabs()");
    ccDates.forEach(function(d){ccChips+=chip(formatDateSimple(d),state.ledgerCCDateFilter===d,"state.ledgerCCDateFilter='"+d+"';openLedgerTabs()");});
    ccChips += '</div>';

    function gbt(e){return e.billingType||(((e.currency||lc)===hc)?'domestic':'twd');}
    var fxTwd  = filtCC.filter(function(e){return gbt(e)==='twd'&&currCode(e.currency||lc)!==currCode(hc);}).sort(function(a,b){return a.date.localeCompare(b.date);});
    var fxOrig = filtCC.filter(function(e){return gbt(e)==='original';}).sort(function(a,b){return a.date.localeCompare(b.date);});
    var dom    = filtCC.filter(function(e){return gbt(e)==='domestic'||currCode(e.currency||lc)===currCode(hc);}).sort(function(a,b){return a.date.localeCompare(b.date);});

    function fmtCCR(e){
      var bt=gbt(e),fb=bt==='twd'?parseFloat(e.twdAmount||0):parseFloat(e.amount||0);
      var fee=e.feeRate?Math.round(fb*parseFloat(e.feeRate||0)/100):0;
      var cc2=currCode(e.currency||lc),isPend=bt==='twd'&&!e.twdAmount&&cc2!==currCode(hc);
      var bstr='';
      if(bt==='domestic')bstr='<span style="font-size:11px;color:var(--blue)">'+currCode(hc)+' '+fmt(e.amount||0)+(fee>0?'+'+fmt(fee)+'='+fmt(parseFloat(e.amount||0)+fee):'')+'</span>';
      else if(bt==='twd'&&e.twdAmount)bstr='<span style="font-size:11px;color:var(--blue)">'+currCode(hc)+' '+fmt(e.twdAmount)+'+'+fmt(fee)+'='+fmt(parseFloat(e.twdAmount||0)+fee)+'</span>';
      else if(bt==='original')bstr='<span style="font-size:11px;color:#6366f1">'+cc2+' '+fmt(e.amount||0)+'+'+fmt(fee)+'='+fmt(parseFloat(e.amount||0)+fee)+'</span>';
      else if(isPend)bstr='<span style="font-size:11px;color:#f97316;font-weight:600">⚠️ 待確認</span>';
      return '<div class="overview-row" style="cursor:pointer" onclick="openPersonalDetail(\''+e.id+'\',()=>openLedgerTabs(\'cc\'))">'
        +'<div style="flex:1"><div class="overview-date">'+formatDateSimple(e.date)+'</div><div class="overview-label">💳 '+e.item+'</div>'+bstr+'</div>'
        +'<div style="text-align:right"><div class="overview-amt overview-neg">'+cc2+' '+fmt(e.amount)+'</div></div></div>';
    }

    var secDiv=function(bg,col,title){return '<div style="background:'+bg+';border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:12px;font-weight:700;color:'+col+'">'+title+'</div>';};
    var fxTwdB=fxTwd.filter(function(e){return e.twdAmount;}).reduce(function(s,e){var f=Math.round(parseFloat(e.twdAmount||0)*(parseFloat(e.feeRate)||0)/100);return s+parseFloat(e.twdAmount||0)+f;},0);
    var domB=dom.reduce(function(s,e){var f=Math.round(parseFloat(e.amount||0)*(parseFloat(e.feeRate)||0)/100);return s+parseFloat(e.amount||0)+f;},0);
    var origBC={};fxOrig.forEach(function(e){var c2=currCode(e.currency||lc),f=Math.round(parseFloat(e.amount||0)*(parseFloat(e.feeRate)||0)/100);origBC[c2]=(origBC[c2]||0)+parseFloat(e.amount||0)+f;});
    var pend=fxTwd.filter(function(e){return !e.twdAmount;}).length;

    var ccHTML='';
    ccHTML+=secDiv('#f0f9ff','#0369a1','海外刷卡 → 換算 '+currCode(hc)+' 請款');
    ccHTML+=fxTwd.length?fxTwd.map(fmtCCR).join(''):'<div style="color:#ccc;text-align:center;padding:10px;font-size:12px">尚無記錄</div>';
    if(fxTwdB>0)ccHTML+='<div style="text-align:right;font-size:11px;color:#0369a1;font-weight:600;padding:4px 0">小計 '+currCode(hc)+' '+fmt(fxTwdB)+'</div>';
    ccHTML+=secDiv('#f5f3ff','#6366f1','海外刷卡 → 維持原幣請款');
    ccHTML+=fxOrig.length?fxOrig.map(fmtCCR).join(''):'<div style="color:#ccc;text-align:center;padding:10px;font-size:12px">尚無記錄</div>';
    Object.entries(origBC).forEach(function(kv){ccHTML+='<div style="text-align:right;font-size:11px;color:#6366f1;font-weight:600;padding:2px 0">原幣請款 '+kv[0]+' '+fmt(kv[1])+'</div>';});
    ccHTML+=secDiv('#f0fdf4','#15803d','國內刷卡（'+currCode(hc)+'）');
    ccHTML+=dom.length?dom.map(fmtCCR).join(''):'<div style="color:#ccc;text-align:center;padding:10px;font-size:12px">尚無記錄</div>';

    var ccByCurHtml='';
    Array.from(new Set(filtCC.map(function(e){return currCode(e.currency||lc);}))).forEach(function(cc2){
      var cEx=filtCC.filter(function(e){return currCode(e.currency||lc)===cc2;});
      var tot=cEx.reduce(function(s,e){return s+(parseFloat(e.amount)||0);},0); if(!tot) return;
      var twdB=cEx.filter(function(e){return gbt(e)==='twd'&&e.twdAmount;}).reduce(function(s,e){var f=Math.round(parseFloat(e.twdAmount||0)*(parseFloat(e.feeRate)||0)/100);return s+parseFloat(e.twdAmount||0)+f;},0);
      var twdBase=cEx.filter(function(e){return gbt(e)==='twd'&&e.twdAmount;}).reduce(function(s,e){return s+parseFloat(e.twdAmount||0);},0);
      var domB2=cEx.filter(function(e){return gbt(e)==='domestic';}).reduce(function(s,e){var f=Math.round(parseFloat(e.amount||0)*(parseFloat(e.feeRate)||0)/100);return s+parseFloat(e.amount||0)+f;},0);
      var origB=cEx.filter(function(e){return gbt(e)==='original';}).reduce(function(s,e){var f=Math.round(parseFloat(e.amount||0)*(parseFloat(e.feeRate)||0)/100);return s+parseFloat(e.amount||0)+f;},0);
      var origBase=cEx.filter(function(e){return gbt(e)==='original';}).reduce(function(s,e){return s+parseFloat(e.amount||0);},0);
      var pd2=cEx.filter(function(e){return gbt(e)==='twd'&&!e.twdAmount;}).length;
      ccByCurHtml+='<div style="margin-bottom:8px;padding:8px 10px;background:#f8faff;border-radius:8px;border-left:3px solid var(--blue)">'
        +'<div style="font-size:12px;font-weight:700;color:#0369a1;margin-bottom:4px">'+cc2+' 刷卡消費</div>'
        +'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span style="color:#666">原始刷卡總額</span><span style="font-weight:600">'+cc2+' '+fmt(tot)+'</span></div>'
        +(twdB>0?'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span style="color:#0369a1">→ 換算'+currCode(hc)+'請款'+(twdB-twdBase>0?' ('+fmt(twdBase)+'+'+fmt(twdB-twdBase)+')':'')+'</span><span style="font-weight:600;color:#0369a1">'+currCode(hc)+' '+fmt(twdB)+'</span></div>':'')
        +(domB2>0?'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span style="color:#059669">→ 國內'+currCode(hc)+'請款</span><span style="font-weight:600;color:#059669">'+currCode(hc)+' '+fmt(domB2)+'</span></div>':'')
        +(origB>0?'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span style="color:#6366f1">→ 原幣請款'+(origB-origBase>0?' ('+fmt(origBase)+'+'+fmt(origB-origBase)+')':'')+'</span><span style="font-weight:600;color:#6366f1">'+cc2+' '+fmt(origB)+'</span></div>':'')
        +(pd2>0?'<div style="font-size:11px;color:#f97316;font-weight:600;margin-top:2px">⚠️ 待請款 '+pd2+' 筆</div>':'')
        +'</div>';
    });

    var ccSum='<div style="background:#f9fafb;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:12px">'
      +'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">海外換算請款</span><span style="font-weight:600;color:var(--blue)">'+currCode(hc)+' '+fmt(fxTwdB)+'</span></div>'
      +'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">國內刷卡</span><span style="font-weight:600;color:var(--blue)">'+currCode(hc)+' '+fmt(domB)+'</span></div>';
    Object.entries(origBC).forEach(function(kv){ccSum+='<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">原幣請款（'+kv[0]+'）</span><span style="font-weight:600;color:#6366f1">'+kv[0]+' '+fmt(kv[1])+'</span></div>';});
    ccSum+='<div style="border-top:1px solid #e5e7eb;margin:5px 0 3px"></div>'
      +'<div style="display:flex;justify-content:space-between"><span style="font-weight:700">🏦 '+currCode(hc)+' 請款總額</span><span style="font-size:14px;font-weight:800;color:var(--blue)">'+currCode(hc)+' '+fmt(fxTwdB+domB)+'</span></div>'
      +(pend>0?'<div style="display:flex;justify-content:space-between;margin-top:4px"><span style="color:#f97316;font-weight:600">⚠️ 待請款</span><span style="color:#f97316;font-weight:700">'+pend+' 筆</span></div>':'<div style="font-size:11px;color:var(--green);margin-top:4px">✅ 全數已填</div>')
      +'</div>';

    content = ccChips
      +'<div id="ledger-detail-rows" style="max-height:50vh;overflow-y:auto">'+ccHTML+'</div>'
      +(ccByCurHtml?'<div style="margin-top:12px"><div style="font-size:13px;font-weight:700;color:#333;margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:4px">各幣別消費統計</div>'+ccByCurHtml+'</div>':'')
      +ccSum
      +'<div class="flex-row" style="margin-top:12px;gap:8px">'
      +'<button class="btn btn-purple" style="flex:1" onclick="closeModal();openPersonalForm()">＋ 新增花費</button>'
      +'<button class="btn btn-secondary" style="flex:1" onclick="exportLedgerPDF(\'cc\')">📄 匯出PDF</button>'
      +'</div>';

  // ━━ 電子支付 Tab ━━
  } else if (at === 'epay') {
    var showEp = state.ledgerEpayCurFilter==='all' ? allCurCodes : [state.ledgerEpayCurFilter];
    var epRows = [];
    showEp.forEach(function(cCode2){
      var cL=(state.personalEpayLedger||[]).filter(function(e){return e.tripId===tripId&&currCode(e.currency||lc)===cCode2;});
      var cEx=getTripPersonalExpenses().filter(function(e){return currCode(e.currency||lc)===cCode2;});
      epRows=epRows.concat(
        cL.map(function(r){
          var lbl=r.type==='儲值'?('＋儲值('+(r.source||')')+')'):(r.type==='借出'?'📤借出':'💰收回');
          var am=r.type==='儲值'||r.type==='收回'?parseFloat(r.amount||0):-parseFloat(r.amount||0);
          var ac=r.type==='儲值'?'epayLedger':r.type==='收回'?'return':'personal';
          return {date:r.date,label:lbl,sub:r.note||(r.target||''),amt:am,cCode:cCode2,id:r.id,ac:ac};
        }),
        cEx.filter(function(e){return e.paymentMethod==='電子支付'&&e.category!=='金流';}).map(function(e){return {date:e.date,label:'－花費',sub:e.item,amt:-parseFloat(e.amount||0),cCode:cCode2,id:e.id,ac:'personal'};})
      );
    });
    epRows.sort(function(a,b){return a.date.localeCompare(b.date);});

    function getEpClick(r){
      if(!r.id) return '';
      var bf="()=>openLedgerTabs('epay')";
      if(r.ac==='epayLedger') return 'onclick="openEpayLedgerDetail(\''+r.id+'\','+bf+')" style="cursor:pointer"';
      if(r.ac==='personal')   return 'onclick="openPersonalDetail(\''+r.id+'\','+bf+')" style="cursor:pointer"';
      if(r.ac==='return')     return 'onclick="openReturnDetail(\''+r.id+'\','+bf+')" style="cursor:pointer"';
      return '';
    }

    var epChips='<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap"><span style="font-size:12px;color:#999;align-self:center">幣別:</span>';
    epChips+=chip('全部',state.ledgerEpayCurFilter==='all',"state.ledgerEpayCurFilter='all';openLedgerTabs()");
    allCurCodes.forEach(function(c){epChips+=chip(c,state.ledgerEpayCurFilter===c,"state.ledgerEpayCurFilter='"+c+"';openLedgerTabs()");});
    epChips+='</div>';
    var epDateChips='<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap"><button class="chip active-purple" onclick="filterLedgerDetail(\'epay\',\'all\',this)">全部日期</button>';
    Array.from(new Set(epRows.map(function(r){return r.date;}))).forEach(function(d){epDateChips+='<button class="chip" onclick="filterLedgerDetail(\'epay\',\''+d+'\',this)">'+formatDateSimple(d)+'</button>';});
    epDateChips+='</div>';

    var epRowsHTML=epRows.length?epRows.map(function(r){return row(r.date,r.label,r.sub,r.amt,r.cCode,getEpClick(r));}).join(''):'<div style="color:#ccc;text-align:center;padding:16px;font-size:13px">尚無記錄</div>';

    var epSum=showEp.map(function(cCode2){
      var cl2=(state.personalEpayLedger||[]).filter(function(e){return e.tripId===tripId&&currCode(e.currency||lc)===cCode2;});
      var eIn=cl2.filter(function(e){return e.type==='儲值';}).reduce(function(s,e){return s+(parseFloat(e.amount)||0);},0);
      var eLend=cl2.filter(function(e){return e.type==='借出';}).reduce(function(s,e){return s+(parseFloat(e.amount)||0);},0);
      var eRet=cl2.filter(function(e){return e.type==='收回';}).reduce(function(s,e){return s+(parseFloat(e.amount)||0);},0);
      var eSp=getTripPersonalExpenses().filter(function(e){return e.paymentMethod==='電子支付'&&e.category!=='金流'&&currCode(e.currency||lc)===cCode2;}).reduce(function(s,e){return s+(parseFloat(e.amount)||0);},0);
      if(eIn===0&&eSp===0&&eLend===0) return '';
      var bal=eIn-eSp-eLend+eRet;
      return '<div style="background:#f9fafb;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:12px">'
        +'<div style="font-weight:700;color:#555;margin-bottom:4px">'+cCode2+'</div>'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">總儲值</span><span>+'+fmt(eIn)+'</span></div>'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">總花費</span><span style="color:var(--red)">-'+fmt(eSp)+'</span></div>'
        +(eLend>0?'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">借出</span><span style="color:#f97316">-'+fmt(eLend)+'</span></div>':'')
        +(eRet>0?'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:#666">收回</span><span style="color:var(--green)">+'+fmt(eRet)+'</span></div>':'')
        +'<div style="border-top:1px solid #e5e7eb;margin:5px 0 3px"></div>'
        +'<div style="display:flex;justify-content:space-between"><span style="font-weight:700">📱 電子支付餘額</span><span style="font-size:14px;font-weight:800;color:'+(bal>=0?'var(--green)':'var(--red)')+'">'+fmt(bal)+' '+cCode2+'</span></div>'
        +'</div>';
    }).join('');

    content=epChips+epDateChips
      +'<div id="ledger-detail-rows" style="max-height:40vh;overflow-y:auto">'+epRowsHTML+'</div>'
      +epSum
      +'<div class="flex-row" style="margin-top:12px;gap:8px">'
      +'<button class="btn btn-green-light" style="flex:1" onclick="closeModal();openEpayLedgerForm()">＋ 電子支付儲值</button>'
      +'<button class="btn btn-secondary" style="flex:1" onclick="exportLedgerPDF(\'epay\')">📄 匯出PDF</button>'
      +'</div>';
  }

  showModal('<div class="modal-header"><span class="modal-title">📒 花費帳本明細</span><button class="close-btn" onclick="closeModal()">✕</button></div>'+tabBar+content);
}

function epayUpdateFee() {
  const b = parseFloat(document.getElementById('ledger-twd')?.value||0);
  const r = parseFloat(document.getElementById('ledger-feerate')?.value||0);
  const fee = Math.round(b * r / 100);
  const el = document.getElementById('epay-fee-display');
  if (el) el.textContent = habitCur() + ' ' + fmt(b) + ' + ' + fmt(fee) + ' = ' + fmt(b+fee);
}

function saveEpayLedger(source) {
  const t = state.currentTrip;
  if (!t) return;
  const amount = parseFloat(document.getElementById('ledger-amount').value);

  const currency = document.getElementById('ledger-currency').value;

  const note = document.getElementById('ledger-note').value;

  // 電子支付帳本記錄
  const epayRecord = {

    feeRate: source==='信用卡' ? (parseFloat(document.getElementById('ledger-feerate')?.value)||0) : 0,

    state.personalExpenses.unshift({
      id: 'pe-epcc-'+Date.now(), tripId: t.id, date,
      item: '電子支付儲值（信用卡）'+(note?'（'+note+'）':''),
      category: '金流', paymentMethod: '信用卡',
      amount, currency, twdAmount: twd, feeRate: epayRecord.feeRate,

      isLending: false, lendingTarget: '', lendingSource: '現金',
      ledgerType: 'epayIn', ledgerRef: epayRecord.id,

    const srcLabel = source==='上次剩餘'?'初始餘額':source+'儲值';

      id: 'pe-epay-'+epayRecord.id, tripId: t.id, date,

      isLending: false, lendingTarget: '', lendingSource: '',

    });

  saveToStorage();
  closeModal();
  renderTab();
}

function saveReturnLedger() {
  const t = state.currentTrip;
  if (!t) return;
  const amount = parseFloat(document.getElementById('ledger-amount').value);
  if (!amount || amount <= 0) return alert('請輸入收回金額');
  const memberEl = document.getElementById('ledger-ret-member');
  const customEl = document.getElementById('ledger-ret-custom');
  const target = (customEl?.value.trim()) || (memberEl?.value) || '';
  if (!target) return alert('請填寫還款人');
  const currency = document.getElementById('ledger-currency').value;
  const dest = document.querySelector('input[name="ret-dest"]:checked')?.value || '現金';
  const bal = calcPersonLendBalance(target, t.id, currency);
  if (bal.totalLend === 0) return alert('找不到「'+target+'」的借出記錄，無法收回。');
  if (bal.remaining <= 0) return alert('「'+target+'」已全數還清，無需收回。');
  if (amount > bal.remaining) return alert('金額超過借款餘額！\n「'+target+'」尚欠 '+currency+' '+fmt(bal.remaining)+'，不可超額收回。');
  const record = {
    id: 'ret-'+Date.now(), tripId: t.id,
    date: document.getElementById('ledger-date').value,
    type: '收回', amount, currency, target, dest,
    note: document.getElementById('ledger-note').value,
  };
  if (dest === '現金') {
    state.personalCashLedger = state.personalCashLedger||[];
    state.personalCashLedger.push(record);
  } else {
    state.personalEpayLedger = state.personalEpayLedger||[];
    state.personalEpayLedger.push(record);
  }
  state.personalExpenses = state.personalExpenses||[];
  state.personalExpenses.unshift({
    id: 'pe-ret-'+record.id, tripId: t.id,
    date: record.date, item: '收回借出款（'+target+'）',
    category: '金流', paymentMethod: dest==='現金'?'現金':'電子支付',
    amount: record.amount, currency: record.currency,
    notes: record.note||'', attachments: [], details: [],
    isGift: false, giftTargets: [], isLending: false,
    ledgerType: 'return', ledgerRef: record.id, returnTarget: target,
  });
  saveToStorage();
  closeModal();
  renderTab();
}

// ===== B4: 借出/收回 統一計算輔助函式 =====
function getAllLendRecords(tripId, currency) {
  const lc = localCur();
  return (state.personalExpenses||[]).filter(e =>
    e.tripId===tripId && e.isLending===true && e.lendingTarget && (e.currency||lc)===currency
  );
}
function getAllReturnRecords(tripId, currency) {
  const lc = localCur();
  return [...(state.personalCashLedger||[]),...(state.personalEpayLedger||[])]
    .filter(r=>r.tripId===tripId && r.type==='收回' && (r.currency||lc)===currency);
}
function calcPersonLendBalance(target, tripId, currency) {
  const lends   = getAllLendRecords(tripId, currency).filter(e=>e.lendingTarget===target);
  const returns = getAllReturnRecords(tripId, currency).filter(r=>r.target===target);
  const totalLend   = lends.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const totalReturn = returns.reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
  return { totalLend, totalReturn, remaining: totalLend-totalReturn };
}
function getDashLendOut(tripId, currency, paySource) {
  const lc = localCur();
  return (state.personalExpenses||[]).filter(e=>
    e.tripId===tripId && e.isLending===true && (e.currency||lc)===currency &&
    (paySource ? e.lendingSource===paySource : true)
  ).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
}

function calcReturnBalance() {
  const t = state.currentTrip;
  if (!t) return;
  const memberEl = document.getElementById('ledger-ret-member');
  const customEl = document.getElementById('ledger-ret-custom');
  const target = customEl?.value.trim() || memberEl?.value || '';
  const display = document.getElementById('return-balance-display');
  if (!display) return;
  if (!target) { display.style.display='none'; return; }

  const cur = document.getElementById('ledger-currency')?.value || localCur();
  const bal = calcPersonLendBalance(target, t.id, cur);
  display.style.display = 'block';
  if (bal.totalLend === 0) {
    display.style.background='#fff3cd'; display.style.borderColor='#f97316';
    display.innerHTML = '⚠️ 找不到「'+target+'」的借出記錄';
  } else if (bal.remaining <= 0) {
    display.style.background='#f0fdf4'; display.style.borderColor='#bbf7d0';
    display.innerHTML = '✅ 「'+target+'」已全數還清';
  } else {
    display.style.background='#f0fdf4'; display.style.borderColor='#bbf7d0';
    display.innerHTML = '💰 「'+target+'」尚欠 <strong>'+cur+' '+fmt(bal.remaining)+'</strong>，已還 '+fmt(bal.totalReturn)+'，借出合計 '+fmt(bal.totalLend);
  }
}

function adjLedgerDate(type, delta) {
  const el = document.getElementById('ledger-date');
  if (!el) return;
  const d = new Date(el.value);
  d.setDate(d.getDate() + delta);
  el.value = d.toISOString().split('T')[0];
}

      e.paymentMethod||'現金', twd||'', twd>0?fr:'', twd>0?fee:'', twd>0?(twd+fee):'', e.notes||'', '', '']);
    s1Props.push({level:0});
