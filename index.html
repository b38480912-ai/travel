<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<title>旅遊公費管理 travel-expense-app_78_13</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap');
  :root{
    /* ── Warm Minimalism Palette ── */
    --purple:#7c5c3e;--purple-light:#f0e8de;--purple-dark:#5a3e28;
    --green:#4a7c59;--green-light:#e4efe8;
    --red:#b85c50;--red-light:#f9eded;
    --blue:#4a6580;--blue-light:#e4ecf3;
    --yellow:#c8963a;--orange:#b87040;
    --gray:#8a8075;--gray-light:#f7f4f0;
    --border:#e2d9cf;--text:#2d2420;--text-sub:#8a7d74;
    --bg:#f5f0ea;--white:#fdfaf6;
    --shadow:0 4px 16px rgba(80,50,30,0.08);--radius:14px;
    --accent:#7c5c3e;--accent-light:#f0e8de;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang TC","Noto Serif TC",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);overflow-x:hidden}
  .header{background:var(--white);border-bottom:1px solid var(--border);box-shadow:0 1px 8px rgba(80,50,30,0.06);padding:12px 16px;position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px}
  .header h1{font-size:18px;font-weight:700;color:var(--text)}
  .header h2{font-size:18px;font-weight:700;color:var(--text)}
  .header .sub{font-size:12px;color:var(--text-sub);margin-top:2px}
  .back-btn{background:none;border:none;cursor:pointer;padding:2px;display:flex}
  .content{padding:20px;padding-bottom:100px}
  .content.map-mode{padding:0;padding-bottom:0;height:calc(100vh - 120px);overflow:hidden;display:flex;flex-direction:column}
  .btn{border:none;border-radius:var(--radius);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;transition:opacity 0.2s}
  .btn:active{opacity:0.8}
  .btn-primary{background:var(--purple);color:#fff;padding:12px 16px;width:100%}
  .btn-purple{background:var(--purple);color:#fff;padding:14px;flex:2;}
  .btn-green-light{background:var(--green-light);color:#15803d;padding:14px;flex:1}
  .btn-secondary{background:#ede7de;color:#4a3728;padding:14px;width:100%}
  .btn-outline{background:var(--white);color:#4a3728;border:1px solid #ddd!important;padding:14px;width:100%}
  .btn-icon{background:none;border:none;cursor:pointer;padding:4px;display:inline-flex;color:var(--text-sub)}
  .btn-save{background:var(--purple-light);color:var(--purple);padding:8px 16px;border-radius:20px;border:none;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn-cancel{background:#ede7de;color:#6b5748;padding:8px 16px;border-radius:20px;border:none;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .flex-row{display:flex;gap:10px}
  .flex-row .btn{flex:1}
  .form-card{background:var(--white);padding:20px;border-radius:var(--radius);margin-top:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
  .input-group{margin-bottom:15px}
  label.lbl{display:block;margin-bottom:8px;font-size:14px;font-weight:700;color:#374151}
  input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{width:100%;padding:12px 16px;border-radius:8px;border:1px solid var(--border);font-size:15px;background:#faf7f3;color:var(--text);outline:none;font-family:inherit;appearance:none;-webkit-appearance:none}
  input[readonly],select[disabled]{background:#f0f0f0;color:#888;cursor:not-allowed}
  textarea{resize:vertical;min-height:80px}
  .select-wrap{position:relative}
  .select-wrap::after{content:"▾";position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--gray);font-size:14px}
  .trip-card{background:var(--white);padding:15px;border-radius:var(--radius);margin-top:15px;border:1px solid var(--border);cursor:pointer;transition:box-shadow 0.2s}
  .trip-card:active{box-shadow:var(--shadow)}
  .trip-card h3{font-size:16px;color:var(--text)}
  .trip-meta{display:flex;gap:15px;margin-top:8px;color:var(--text-sub);font-size:13px}
  .tag-blue{background:var(--blue-light);color:#0369a1;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
  .tag-cat{color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--white);border-top:1px solid var(--border);box-shadow:0 -4px 20px rgba(80,50,30,0.07);display:flex;justify-content:space-around;padding:10px 0 20px;z-index:20}
  .nav-item{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--text-sub);cursor:pointer;gap:4px;min-width:60px;position:relative}
  .nav-item.active{color:var(--purple);font-weight:600}
  .nav-item.active::after{content:'';display:block;width:4px;height:4px;border-radius:50%;background:var(--purple);margin-top:1px}
  .nav-svg{width:22px;height:22px;stroke:var(--text-sub);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke 0.2s}
  .nav-item.active .nav-svg{stroke:var(--purple)}
  .summary-row{display:flex;margin-bottom:20px}
  .summary-item{flex:1;text-align:center;cursor:pointer;padding:10px 0}
  .summary-label{font-size:13px;color:var(--text-sub);margin-bottom:4px}
  .summary-value{font-size:16px;font-weight:700}
  .summary-divider{width:1px;background:var(--border)}
  .balance-card{background:var(--white);border-radius:20px;padding:24px 20px;text-align:center;box-shadow:0 10px 25px -5px rgba(100,60,20,0.08);border:1px solid var(--border);margin-top:16px}
  .action-links{display:flex;justify-content:center;gap:40px;margin-bottom:20px}
  .action-link{color:var(--purple);font-size:14px;font-weight:600;cursor:pointer;background:none;border:none}
  .balance-amount{display:flex;align-items:baseline;justify-content:center;margin:16px 0}
  .balance-currency{font-size:22px;color:#64748b;margin-right:6px;font-weight:500}
  .balance-number{font-size:48px;font-weight:800;color:var(--text)}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;margin-top:4px}
  .badge-green{color:#059669;background:#ecfdf5}
  .badge-orange{color:#b45309;background:#fffbeb}
  .badge-blue{color:#be123c;background:#fff1f2}
  .expense-list{margin-top:20px}
  .expense-item{background:var(--white);padding:14px 15px;border-radius:var(--radius);border:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;cursor:pointer;position:relative}
  .expense-left{display:flex;flex-direction:column;gap:4px;flex:1}
  .expense-title{font-size:15px;font-weight:700;color:var(--text)}
  .expense-meta{display:flex;gap:8px;align-items:center}
  .expense-date{font-size:12px;color:var(--text-sub)}
  .expense-right{text-align:right;min-width:80px}
  .expense-amount-red{font-size:16px;font-weight:700;color:var(--red)}
  .expense-amount-green{font-size:16px;font-weight:700;color:var(--green)}
  .expense-payer{font-size:11px;color:var(--text-sub);margin-top:2px}
  .billed-text{font-size:11px;color:var(--blue);font-weight:700;margin-top:2px}
  .pending-text{font-size:11px;color:#9ca3af;font-style:italic;margin-top:2px}
  .subsidy-text{font-size:11px;color:var(--green);font-weight:700;margin-top:2px}
  .search-wrap{position:relative;margin:10px 0 15px}
  .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-sub);font-size:16px}
  .search-wrap input{padding-left:42px;padding-right:72px;background:var(--white);border-radius:var(--radius)}
  .search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:#e2d8cc;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px}
  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:50;display:flex;align-items:center;justify-content:center}
  .modal{background:var(--white);border-radius:var(--radius);width:90%;max-width:440px;max-height:90vh;overflow-y:auto;padding:20px;position:relative;box-shadow:0 20px 60px rgba(80,50,30,0.15)}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border)}
  .modal-title{font-size:18px;font-weight:700}
  .close-btn{background:none;border:none;cursor:pointer;color:var(--text-sub);font-size:22px;line-height:1}
  .tab-header{display:flex;border-bottom:1px solid var(--border);margin-bottom:15px}
  .tab-btn{flex:1;padding:12px 0;border:none;background:none;font-size:13px;font-weight:500;color:var(--text-sub);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s}
  .tab-btn.active{font-weight:700;color:var(--purple);border-bottom-color:var(--purple)}
  /* ===== 個人花費儀表板 ===== */
  .pf-dashboard{background:var(--white);border-radius:20px;padding:20px;box-shadow:0 10px 25px -5px rgba(0,0,0,0.05);margin-bottom:16px}
  .pf-cur-tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:10px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .pf-cur-tabs::-webkit-scrollbar{display:none}
  .pf-cur-tab{padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);background:#f9fafb;font-size:12px;font-weight:600;color:#666;cursor:pointer;transition:all 0.15s;white-space:nowrap;flex-shrink:0}
  .pf-cur-tab.active{background:var(--purple);border-color:var(--purple);color:#fdfaf6}
  .pf-twin-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .pf-twin-card{background:#f7f3ee;border-radius:14px;padding:12px;text-align:center}
  .pf-twin-label{font-size:11px;color:#aaa;font-weight:600;margin-bottom:4px}
  .pf-twin-amount{font-size:20px;font-weight:800;color:var(--text)}
  .pf-twin-sub{font-size:10px;color:#aaa;margin-top:2px}
  .pf-stacked-bar{height:10px;border-radius:6px;overflow:hidden;display:flex;margin-bottom:16px;background:#f0f0f0}
  .pf-stacked-seg{height:100%;transition:width 0.4s}
  .pf-bar-row{margin-bottom:10px}
  .pf-bar-meta{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
  .pf-bar-track{background:#f0f0f0;border-radius:4px;height:8px;overflow:hidden}
  .pf-bar-fill{height:100%;border-radius:4px;transition:width 0.4s}
  /* 篩選面板 */
  .pf-filter-panel{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:10px;overflow:hidden}
  .pf-filter-inner{padding:14px}
  .pf-filter-label{font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;margin-top:10px}
  .pf-filter-label:first-child{margin-top:0}
  .pf-filter-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
  .pf-filter-chip{padding:5px 11px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:#f7f3ee;color:#555;transition:all 0.15s;white-space:nowrap}
  .pf-filter-chip.on{border-color:var(--purple);background:var(--purple);color:#fff}
  .pf-filter-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
  .pf-filter-count{font-size:12px;color:#666}
  .pf-filter-clear{font-size:12px;color:var(--red);background:none;border:none;cursor:pointer;font-weight:600}
  .pf-search-filter-btn{position:absolute;right:38px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:15px;padding:4px 6px;border-radius:8px;transition:background 0.15s}
  .pf-search-filter-btn.has-filter{background:var(--purple);color:#fff;border-radius:12px;padding:3px 8px;font-size:11px;font-weight:700}
  /* 轉換按鈕 */
  .pf-convert-btn{font-size:11px;background:#f0f7ff;color:var(--blue);border:1px solid #bfdbfe;border-radius:8px;padding:3px 8px;cursor:pointer;font-weight:600;white-space:nowrap;flex-shrink:0}
  /* PDF 匯出按鈕 */
  .pf-export-row{display:flex;gap:8px;margin-bottom:12px}
  .pf-export-btn{flex:1;padding:10px;border-radius:12px;border:1.5px solid var(--border);background:#f7f3ee;font-size:13px;font-weight:600;color:#555;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
  .pf-export-btn:active{background:var(--purple-light);border-color:var(--purple);color:var(--purple)}
  .pf-card-section{background:#f7f3ee;border-radius:10px;padding:12px;margin-bottom:4px}
  .pf-detail-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .pf-detail-row:last-child{margin-bottom:0}
  .pf-detail-desc{flex:2;padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:14px;background:#fff;color:var(--text);font-family:inherit}
  .pf-detail-amt{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:14px;background:#fff;color:var(--text);text-align:right}
  .pf-detail-del{background:none;border:none;color:#ccc;font-size:18px;cursor:pointer;padding:4px;flex-shrink:0}
  .pf-detail-del:active{color:var(--red)}
  .pf-subtotal{font-size:12px;color:var(--purple);font-weight:700;text-align:right;margin-top:6px}
  .pf-add-detail-btn{background:none;border:1.5px dashed #ddd;border-radius:8px;color:#aaa;font-size:13px;cursor:pointer;padding:7px;width:100%;margin-top:6px;transition:all 0.15s}
  .pf-add-detail-btn:active{background:var(--purple-light);border-color:var(--purple);color:var(--purple)}
  .pf-attach-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
  .pf-attach-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#f0f0f0;cursor:pointer}
  .pf-attach-thumb img{width:100%;height:100%;object-fit:cover}
  .pf-attach-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.5);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .pf-attach-add{aspect-ratio:1;border-radius:8px;border:2px dashed #ddd;background:#fafafa;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:10px;color:#aaa;gap:2px}
  .pf-attach-add span{font-size:20px}
  .pf-cc-section{background:#eff6ff;border-radius:10px;padding:12px;margin-bottom:4px;border:1px solid #bfdbfe}
  .pf-cc-label{font-size:12px;font-weight:700;color:#1d4ed8;margin-bottom:8px}
  .pf-gift-section{background:#fff7ed;border-radius:10px;padding:12px;margin-bottom:4px;border:1px solid #fed7aa}
  .pf-gift-label{font-size:12px;font-weight:700;color:#c2410c;margin-bottom:8px}
  .pf-gift-tag{display:inline-flex;align-items:center;gap:6px;background:#ffedd5;border:1px solid #fed7aa;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:600;color:#c2410c;margin:3px}
  .pf-gift-tag button{background:none;border:none;color:#c2410c;cursor:pointer;font-size:13px;padding:0;line-height:1}
  .pf-gift-badge{font-size:10px;background:#ffedd5;color:#c2410c;border-radius:6px;padding:2px 6px;font-weight:700}
  /* ===== 帳本總覽 Modal ===== */
  .overview-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:14px}
  .overview-tab{flex:1;padding:10px 4px;font-size:13px;font-weight:600;color:#999;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.15s}
  .overview-tab.active{color:var(--purple);border-bottom-color:var(--purple)}
  .overview-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f5f5f5}
  .overview-row:last-child{border-bottom:none}
  .overview-date{font-size:11px;color:#aaa}
  .overview-label{font-size:13px;font-weight:600;color:var(--text)}
  .overview-sub{font-size:11px;color:#999}
  .overview-amt{font-size:13px;font-weight:700}
  .overview-pos{color:var(--green)}
  .overview-neg{color:var(--red)}
  .pending-card{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .pending-name{font-size:14px;font-weight:700;color:#c2410c}
  .pending-detail{font-size:12px;color:#666;margin-top:2px}
  .pending-amt{font-size:15px;font-weight:800;color:#f97316}
  .pending-btns{display:flex;gap:6px;margin-top:8px}
  .pending-collect-btn{flex:1;padding:7px;border-radius:8px;border:none;background:var(--purple);color:#fff;font-size:12px;font-weight:700;cursor:pointer}
  .pending-remind-btn{flex:1;padding:7px;border-radius:8px;border:1px solid var(--purple);background:#fff;color:var(--purple);font-size:12px;font-weight:700;cursor:pointer}
  /* ===== 幣別設定 Chip Panel ===== */
  .cur-chip-panel{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
  .cur-chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);background:#f7f3ee;font-size:13px;font-weight:600;color:#555;cursor:pointer;transition:all 0.15s;user-select:none}
  .cur-chip.selected{background:var(--purple-light);border-color:var(--purple);color:var(--purple)}
  .cur-chip-check{font-size:12px}
  .cur-sort-list{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:8px}
  .cur-sort-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid #f0f0f0;font-size:13px;font-weight:600}
  .cur-sort-item:last-child{border-bottom:none}
  .cur-sort-item.locked{background:#f9fafb;color:#aaa}
  .cur-sort-handle{color:#ccc;font-size:16px;cursor:grab}
  .cur-sort-name{flex:1}
  .cur-sort-btns{display:flex;gap:4px}
  .cur-sort-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#666}
  .cur-sort-btn:disabled{opacity:0.3;cursor:not-allowed}
  .cur-custom-row{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
  .cur-custom-code{width:80px;text-align:center;font-weight:700;letter-spacing:1px;text-transform:uppercase}
  .cur-custom-name{flex:1}
  /* ===== end 幣別設定 ===== */
  .ledger-type-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:#fff;cursor:pointer;margin-bottom:10px;text-align:left;transition:all 0.15s}
  .ledger-type-btn:active{background:var(--purple-light);border-color:var(--purple)}
  .ledger-type-icon{font-size:24px;width:36px;text-align:center;flex-shrink:0}
  .ledger-type-info{display:flex;flex-direction:column;gap:2px}
  .ledger-type-title{font-size:15px;font-weight:700;color:var(--text)}
  .ledger-type-desc{font-size:12px;color:var(--text-sub)}
  .ledger-source-row{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .ledger-source-opt{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all 0.15s}
  .ledger-source-opt.selected{border-color:var(--purple);background:var(--purple-light)}
  .ledger-source-opt input[type=radio]{accent-color:var(--purple);width:16px;height:16px;flex-shrink:0}
  .ledger-source-label{font-size:14px;font-weight:600;color:var(--text)}
  .ledger-source-sub{font-size:11px;color:var(--text-sub)}
  /* ===== 地圖頁面 ===== */
  .map-page{display:flex;flex-direction:column;height:100%;overflow:hidden}
  .map-container{flex:0 0 60%;position:relative;background:#e8e8e8;min-height:200px}
  #leaflet-map{position:absolute;top:0;left:0;width:100%;height:100%}
  .map-list-container{flex:1;overflow-y:auto;background:var(--bg);min-height:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

<script>
let state = {
  trips: [], expenses: [], personalExpenses: [], schedule: {},
  currentTrip: null, activeTab: 'itinerary', activeFormType: null, editingExpenseId: null,
  isLending: false, isReturning: false, filterDates: [], filterPaymentMethods: [], filterCurrencies: [], searchTerm: '',
  filterPanelOpen: false, filterMembers: [], filterCategories: [], filterDateFrom: '', filterDateTo: '',
  dayCollapsed: {}, // 行程折疊狀態 {tripId-dayIdx: true/false}
  photoFullscreen: null, // {photos:[], idx:0}
  mapNavOrigin: null,  // {id, title, coord}
  mapNavDest: null,    // {id, title, coord}
  incomeModalTab: 'general', expenseModalTab: 'general', activeCheckoutTab: 'overview', checkoutMemberFilter: '',
  newExpense: null, personalForm: null, personalEditId: null, personalFilterCat: '', personalFilterDate: '', personalSearchTerm: '',
  pfDashCurrency: '',   // 花費頁面目前選擇的幣別
  poolDashCurrency: '',  // 公費頁面目前選擇的幣別
  poolDashAll: true,     // 公費頁面是否顯示全部
  pfFilterOpen: false,  // 篩選面板開關
  incomeModalCurFilter: 'all',  // 收入明細幣別篩選
  modalBackFn: null,            // 費用詳情「← 返回」的回呼函式
  expCardCurFilter: 'all',      // 公費刷卡請款幣別篩選
  expCardDateFilter: 'all',     // 公費刷卡請款日期篩選
  expLendCurFilter: 'all',      // 公費借出幣別篩選
  expLendDateFilter: 'all',     // 公費借出日期篩選
  ledgerCashCurFilter: 'all',   // 現金明細幣別篩選
  ledgerEpayCurFilter: 'all',   // 電子支付明細幣別篩選
  ledgerCCCurFilter: 'all',     // 信用卡明細幣別篩選
  ledgerCCDateFilter: 'all',    // 信用卡明細日期篩選
  ledgerActiveTab: 'cash',      // 三合一明細 Tab：cash/cc/epay
  pfFilterCats: [],     // 篩選類別（多選）
  pfFilterDateFrom: '', pfFilterDateTo: '',
  personalCashLedger: [],  // 現金帳本 [{id,date,type,amount,currency,note,target}]
  personalEpayLedger: [],  // 電子支付帳本 [{id,date,type,amount,currency,source,twdAmount,feeRate,note,target}]
  isBatchMode: false, batchSelectedItems: [],
  dayMemos: {}
};

const INT_CURRENCIES = ['JPY','KRW','THB','TWD'];
function isIntCur(cur) { return INT_CURRENCIES.includes(cur || localCur()); }
function fmt(n, cur) {
  if (n === '' || n == null) return '';
  const x = parseFloat(String(n).replace(/,/g, ''));
  if (isNaN(x)) return n;
  return isIntCur(cur) ? Math.round(x).toLocaleString(undefined, { maximumFractionDigits: 0 }) : x.toLocaleString(undefined, { maximumFractionDigits: 2 });
}
function fmtCeil(n) { return isNaN(Math.ceil(parseFloat(n))) ? 0 : Math.ceil(parseFloat(n)).toLocaleString(undefined, { maximumFractionDigits: 0 }); }
function fmtN(n) { var v=parseFloat(n)||0; return v===Math.round(v)?Math.round(v).toLocaleString():v.toFixed(1); }
function updateFeeDisplay() {
  const e = state.newExpense;
  const lc = localCur(), hc = habitCur();
  const isDom = (e.currency||lc) === hc;
  const base = isDom ? parseFloat(e.amount||0) : parseFloat(e.billingAmount||0);
  const baseCur = hc;
  const fee = Math.round(base * (parseFloat(e.feeRate)||0) / 100);
  const el = document.getElementById('fee-calc-display');
  if (!el) return;
  el.innerHTML = base > 0 ? (parseFloat(e.feeRate) > 0
    ? '<span style="color:#0369a1">'+baseCur+' '+fmt(base)+' + '+fmt(fee)+' = <strong>'+fmt(base+fee)+'</strong></span>'
    : '<strong>'+baseCur+' '+fmt(base+fee)+'</strong>') : baseCur+' 0';
}
function getCatColor(cat) {
  const c = {
    '吃喝': '#f59e0b',
    '交通': '#0ea5e9',
    '住宿': '#3b82f6',
    '購物': '#ec4899',
    '娛樂': '#14b8a6',
    
    '其他': '#64748b',
    '金流': '#10b981',
    '公費收回': '#10b981',
    '公費借出': '#f97316'
  };
  return c[cat] || '#64748b';
}
function formatDateSimple(s) { const d = new Date(s); return `${d.getMonth()+1}/${d.getDate()}`; }
function getRawDayDate(startDate, idx) {
  const d = new Date(startDate);
  d.setDate(d.getDate() + idx);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function getDayDate(startDate, idx) {
  const d = new Date(startDate); d.setDate(d.getDate() + idx);
  return `${d.getMonth()+1}/${d.getDate()} (${['週日','週一','週二','週三','週四','週五','週六'][d.getDay()]})`;
}
function getTripDates() {
  if (!state.currentTrip) return [];
  const dates = [];
  for (let i = 0; i < parseInt(state.currentTrip.days); i++) {
    const d = new Date(state.currentTrip.startDate); d.setDate(d.getDate() + i);
    dates.push(d.toISOString().split('T')[0]);
  }
  return dates;
}
function getAllFilterDates() {
  if (!state.currentTrip) return [];
  const expDates = state.expenses.filter(e=>e.tripId===state.currentTrip.id).map(e=>e.date);
  return Array.from(new Set([...getTripDates(),...expDates])).sort();
}
function localCur() {
  const t = state.currentTrip;
  if (!t) return 'JPY';
  // 多幣別：取 currencies[0]，向下相容舊資料
  if (t.currencies && t.currencies.length > 0) return t.currencies[0];
  return t.localCurrency || 'JPY';
}
function habitCur() { return state.currentTrip?.baseCurrency || 'TWD'; }
function curOptions() {
  const t = state.currentTrip;
  const hc = habitCur();
  if (t && t.currencies && t.currencies.length > 0) {
    // 多幣別：依序排列，去掉和 hc 重複的，最後加 hc
    const list = t.currencies.filter(c => currCode(c) !== currCode(hc));
    return [...list, hc];
  }
  const lc = localCur();
  return lc === hc ? [lc] : [lc, hc];
}
// 從完整幣別名稱截取前3碼英文：'RON (羅馬尼亞)' → 'RON'
function currCode(c) {
  if (!c) return '';
  const m = c.match(/^([A-Z]{3})/);
  return m ? m[1] : c.substring(0, 3).toUpperCase();
}
// 取得所有當地幣別清單（不含習慣幣別）
function getTripCurrencies() {
  const t = state.currentTrip;
  if (!t) return [];
  if (t.currencies && t.currencies.length > 0) return t.currencies;
  return [t.localCurrency || 'JPY'];
}
function defaultExpense() {
  const lc = localCur();
  return {
    date: new Date().toISOString().split('T')[0], item: '', amount: '', currency: lc, category: '吃喝',
    paymentMethod: '現金', billingAmount: '', feeRate: 1.5, billingType: '', accountType: '支出', borrower: '', payer: '',
    cardPayer: state.currentTrip?.members?.[0] || '',
    subsidies: [{ id: Date.now(), member: '', amount: '', currency: lc }],
    details: [{ id: 1, desc: '', amount: '' }, { id: 2, desc: '', amount: '' }, { id: 3, desc: '', amount: '' }],
    attachments: [], notes: '', splitMembers: state.currentTrip?.members || []
  };
}

// ── 全域輔助計算函數 (解決報表無法匯出的問題) ──
function getCardTotal(e) {
  const cur = e.currency || localCur();
  if (cur === habitCur()) return (parseFloat(e.amount)||0) + Math.round((parseFloat(e.amount)||0)*(parseFloat(e.feeRate)||0)/100);
  const bill = parseFloat(e.billingAmount)||0;
  return bill <= 0 ? 0 : bill + Math.round(bill*(parseFloat(e.feeRate)||0)/100);
}
function getCardCost(e, sc) { const t = getCardTotal(e); return t > 0 ? Math.ceil(t / sc) : 0; }
function getCardPayer(e, members) { const raw = e.cardPayer||''; return (raw==='我'||raw==='') ? (members[0]||'') : raw; }

function calcPairNet(memberA, groupExps, members) {
  const owes = {}, receives = {};
  members.forEach(B => { if (B !== memberA) { owes[B] = 0; receives[B] = 0; } });
  groupExps.forEach(e => {
    const sm  = (e.splitMembers||[]).filter(x => members.includes(x));
    const sc  = sm.length || members.length;
    const targets = sm.length ? sm : members;
    const payer = getCardPayer(e, members);
    const total = getCardTotal(e);
    if (total <= 0) return;
    const cost = getCardCost(e, sc);
    if (targets.includes(memberA) && payer !== memberA && members.includes(payer)) {
      if (owes[payer] !== undefined) owes[payer] += cost;
    }
    if (payer === memberA && targets.includes(memberA)) {
      targets.forEach(B => {
        if (B !== memberA && receives[B] !== undefined) receives[B] += cost;
      });
    }
  });
  const result = [];
  members.forEach(B => {
    if (B === memberA) return;
    const net = (receives[B] || 0) - (owes[B] || 0); 
    if (Math.abs(net) > 0.01) result.push({ other: B, net });
  });
  return result;
}

// ===== Toast 列印提示 =====
function showPrintToast(callback) {
  var existing = document.getElementById('print-toast');
  if (existing) existing.remove();

  var toast = document.createElement('div');
  toast.id = 'print-toast';
  toast.innerHTML = '📄 即將開啟列印預覽，請選擇「儲存為 PDF」';
  toast.style.cssText = [
    'position:fixed',
    'top:18px',
    'left:50%',
    'transform:translateX(-50%) translateY(-80px)',
    'background:#7c3aed',
    'color:#fff',
    'padding:12px 22px',
    'border-radius:30px',
    'font-size:14px',
    'font-weight:600',
    'box-shadow:0 4px 18px rgba(124,58,237,0.35)',
    'z-index:99999',
    'white-space:nowrap',
    'transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1)',
    'pointer-events:none'
  ].join(';');
  document.body.appendChild(toast);

  // 滑入
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      toast.style.transform = 'translateX(-50%) translateY(0)';
    });
  });

  // 1.5秒後滑出，然後執行列印
  setTimeout(function() {
    toast.style.transition = 'transform 0.25s ease-in, opacity 0.25s ease-in';
    toast.style.transform = 'translateX(-50%) translateY(-80px)';
    toast.style.opacity = '0';
    setTimeout(function() {
      if (toast.parentNode) toast.remove();
    }, 280);
  }, 1500);

  // 300ms 後觸發列印（Toast 還在畫面上時就開始）
  setTimeout(callback, 300);
}

// ===== 匯出 PDF：最近花費清單版 =====
function exportExpensesToPDF() {
  var t = state.currentTrip;
  if (!t) return;
  var lc = t.localCurrency, hc = t.baseCurrency;
  var exps = state.expenses.filter(function(e){return e.tripId===t.id;}).sort(function(a,b){return a.date.localeCompare(b.date);});
  if (exps.length===0) return alert('目前沒有可匯出的帳目資料');

  let printArea = document.getElementById('print-area');

  let totalIncomeByCur = {}, totalCashOutByCur = {};
  let cardOutGroups = {};

  exps.forEach(e => {
    const amt = parseFloat(e.amount) || 0;
    const c = currCode(e.currency || lc);
    if (e.accountType === '收入') {
      totalIncomeByCur[c] = (totalIncomeByCur[c]||0) + amt;
    } else if (e.paymentMethod === '現金') {
      totalCashOutByCur[c] = (totalCashOutByCur[c]||0) + amt;
    } else if (e.paymentMethod === '信用卡') {
      if (!cardOutGroups[c]) cardOutGroups[c] = { amt: 0, billed: 0, fee: 0 };
      cardOutGroups[c].amt += amt;
      const b = parseFloat(e.billingAmount) || 0;
      const fr = parseFloat(e.feeRate) || 0;
      cardOutGroups[c].billed += b;
      cardOutGroups[c].fee += Math.round(b * fr / 100);
    }
  });

  // 各幣別收入/現金支出各自一行
  const incomeHtml = Object.entries(totalIncomeByCur).map(([c,v])=>
    `<div style="font-weight:bold;color:#10b981">📥 公費收入 (${c}): ${fmt(v)}</div>`).join('') || '<div style="color:#10b981">📥 公費收入: 0</div>';
  const cashOutHtml = Object.entries(totalCashOutByCur).map(([c,v])=>
    `<div style="font-weight:bold;color:#ef4444">💸 現金支出 (${c}): ${fmt(v)}</div>`).join('') || '<div style="color:#ef4444">💸 現金支出: 0</div>';

  let cardHtml = '';
  const cardKeys = Object.keys(cardOutGroups);
  if (cardKeys.length > 0) {
      cardHtml = cardKeys.map(c => {
          let grp = cardOutGroups[c];
          if (c === hc) {
              return `<div style="font-weight:bold; color:#0369a1;">💳 刷卡支出 (${c}): ${fmt(grp.amt)}</div>`;
          } else {
              return `<div style="font-weight:bold; color:#0369a1;">💳 刷卡支出 (${c}): ${fmt(grp.amt)} <span style="font-size: 11.5px; color: #6b7280; font-weight: normal; margin-left: 6px;">( 對應 ${hc} 請款 ${fmt(grp.billed)} + 手續費 ${fmt(grp.fee)} )</span></div>`;
          }
      }).join('');
  } else {
      cardHtml = `<div style="font-weight:bold; color:#0369a1;">💳 刷卡支出: 0</div>`;
  }

  let html = `
    <div style="padding: 20px; font-family: sans-serif; background: white; color: #333;">
      <h2 style="font-size: 24px; font-weight: bold; border-bottom: 2px solid #a855f7; padding-bottom: 10px; margin-bottom: 15px;">✈️ ${t.name} - 花費明細清單</h2>
      <div style="font-size: 14px; color: #555; margin-bottom: 5px;"><strong>匯出日期：</strong> ${new Date().toLocaleDateString('zh-TW')}</div>
      <div style="font-size: 14px; color: #555; margin-bottom: 15px;"><strong>參與成員：</strong> ${(t.members || []).join(', ')}</div>
      
      <div style="margin-bottom: 15px; padding: 12px 15px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; color: #374151; font-size: 14px; display:flex; flex-direction:column; gap:8px;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; gap:16px">
            <div style="display:flex;flex-direction:column;gap:2px">${incomeHtml}</div>
            <div style="display:flex;flex-direction:column;gap:2px">${cashOutHtml}</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:4px;">
            ${cardHtml}
        </div>
      </div>

      <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
        <thead>
          <tr style="background: #a855f7; color: white; text-align: left;">
            <th style="padding: 10px; border: 1px solid #ddd;">日期</th>
            <th style="padding: 10px; border: 1px solid #ddd;">項目</th>
            <th style="padding: 10px; border: 1px solid #ddd;">類別</th>
            <th style="padding: 10px; border: 1px solid #ddd;">類型</th>
            <th style="padding: 10px; border: 1px solid #ddd;">幣別</th>
            <th style="padding: 10px; border: 1px solid #ddd; text-align: right;">金額</th>
            <th style="padding: 10px; border: 1px solid #ddd;">付款方式</th>
            <th style="padding: 10px; border: 1px solid #ddd;">備註</th>
          </tr>
        </thead>
        <tbody>
  `;

  exps.forEach(e => {
    let sourceText = '';
    if (e.accountType === '收入') {
       if (e.item === '公費收回' && e.payer) sourceText = '📥 收回: ' + e.payer;
       else sourceText = '💰 公費入帳';
    } else {
       if (e.category === '公費借出' && e.borrower) {
           sourceText = '📤 借出: ' + e.borrower;
       } else if (e.paymentMethod === '信用卡') {
           const payerName = e.cardPayer || (t.members && t.members.length > 0 ? t.members[0] : '我');
           sourceText = '💳 ' + payerName + ' 代墊';
       } else {
           sourceText = '🏦 公費支付';
       }
    }
    if (e.notes && e.notes.trim() !== '') {
        const notesLines = e.notes.trim().split('\n').map(l=>l.trim()).filter(l=>l);
        sourceText = sourceText + '<br>' + notesLines.join('<br>');
    }

    const validDetails = (e.details || []).filter(d => d.desc || d.amount);
    const hasBorderBottom = validDetails.length === 0;

    let itemName = e.item || '';
    if (e.paymentMethod === '信用卡' && e.accountType === '支出') {
      const b = parseFloat(e.billingAmount) || 0;
      if (b > 0 && (e.currency || lc) !== hc) {
        const fr = parseFloat(e.feeRate) || 0;
        const f = Math.round(b * fr / 100);
        itemName += `<br><span style="color:#6b7280;font-size:10.5px;display:inline-block;margin-top:2px;font-weight:normal;">( 對應 ${hc} 請款 ${fmt(b)} + 手續費 ${fmt(f)} )</span>`;
      }
    }

    html += `
      <tr>
        <td style="padding: 10px; ${hasBorderBottom ? 'border-bottom: 1px solid #ddd;' : ''}">${e.date || ''}</td>
        <td style="padding: 10px; ${hasBorderBottom ? 'border-bottom: 1px solid #ddd;' : ''}">${itemName}</td>
        <td style="padding: 10px; ${hasBorderBottom ? 'border-bottom: 1px solid #ddd;' : ''}">${e.category || ''}</td>
        <td style="padding: 10px; ${hasBorderBottom ? 'border-bottom: 1px solid #ddd;' : ''} color:${e.accountType === '收入' ? '#10b981' : '#ef4444'}">${e.accountType === '收入' ? '收入' : '支出'}</td>
        <td style="padding: 10px; ${hasBorderBottom ? 'border-bottom: 1px solid #ddd;' : ''}">${e.currency || lc}</td>
        <td style="padding: 10px; ${hasBorderBottom ? 'border-bottom: 1px solid #ddd;' : ''} text-align: right; font-weight: bold;">${fmt(e.amount)}</td>
        <td style="padding: 10px; ${hasBorderBottom ? 'border-bottom: 1px solid #ddd;' : ''}">${e.paymentMethod === '信用卡' ? '刷卡' : '現金'}</td>
        <td style="padding: 10px; ${hasBorderBottom ? 'border-bottom: 1px solid #ddd;' : ''}">${sourceText}</td>
      </tr>
    `;

    validDetails.forEach((d, idx) => {
      const isLast = idx === validDetails.length - 1;
      html += `
        <tr style="background: #fafafa;">
          <td style="padding: 2px 10px; ${isLast ? 'border-bottom: 1px solid #ddd;' : ''}"></td>
          <td colspan="4" style="padding: 2px 10px 2px 20px; font-size: 12px; color: #666; ${isLast ? 'border-bottom: 1px solid #ddd;' : ''}">
            <span style="color: #cbd5e1; margin-right: 4px;">└</span>${d.desc || ''}
          </td>
          <td style="padding: 2px 10px; font-size: 12px; color: #666; text-align: right; ${isLast ? 'border-bottom: 1px solid #ddd;' : ''}">${d.amount ? fmt(d.amount) : ''}</td>
          <td style="padding: 2px 10px; ${isLast ? 'border-bottom: 1px solid #ddd;' : ''}"></td>
          <td style="padding: 2px 10px; ${isLast ? 'border-bottom: 1px solid #ddd;' : ''}"></td>
        </tr>
      `;
    });
  });

  html += `</tbody></table></div>`;
  printArea.innerHTML = html;
  showPrintToast(function() { window.print(); });
}

// ===== EXPORT PDF FUNCTION (結算中心：V6 全員總表 / V7 單一成員明細) =====
var PDF_CSS = '<style>:root{--purple:#a855f7;--purple-light:#f3e8ff;--green:#10b981;--green-light:#ecfdf5;--red:#ef4444;--red-light:#fef2f2;--blue:#3b82f6;--text:#1f2937;--text-sub:#6b7280;--border:#e5e7eb;}body{font-family:sans-serif;color:var(--text);background:#fff;padding:0;line-height:1.5;margin:0;}.a4-page{width:100%;max-width:210mm;background:#fff;padding:15mm;box-sizing:border-box;page-break-after:always;break-after:page;}.a4-page:last-child{page-break-after:avoid;break-after:avoid;}.report-header-all{border-bottom:3px solid var(--purple);padding-bottom:12px;margin-bottom:20px;text-align:center;}.report-header-member{border-bottom:3px solid var(--blue);padding-bottom:12px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;}.report-title{font-size:26px;font-weight:800;color:#111827;}.member-badge{background:var(--blue);color:#fff;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:bold;}.sec-p{font-size:15px;font-weight:700;margin:18px 0 8px;padding:5px 10px;border-left:5px solid var(--purple);background:#fdfbff;}.sec-b{font-size:15px;font-weight:700;margin:18px 0 8px;padding:5px 10px;border-left:5px solid var(--blue);background:#f0f7ff;}.info-table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:13px;}.info-table td{padding:7px 10px;border:1px solid var(--border);}.info-label{background:#f9fafb;font-weight:700;width:30%;}.settle-row{display:flex;justify-content:space-between;padding:10px 14px;border-radius:8px;margin-bottom:7px;border-left:5px solid;}.settle-green{background:var(--green-light);border-left-color:var(--green);}.settle-red{background:var(--red-light);border-left-color:var(--red);}.result-container{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}.result-card{border:1px solid #ddd;border-radius:10px;padding:16px;text-align:center;}.result-card.positive{border-color:var(--green);background:var(--green-light);}.result-card.negative{border-color:var(--red);background:var(--red-light);}.result-card.neutral{border-color:#d1d5db;background:#f9fafb;}.result-amount{font-size:26px;font-weight:900;margin-bottom:4px;}.formula-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}.formula-card{border:1px solid var(--border);border-radius:9px;padding:13px;}.formula-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}.formula-total{border-top:2px dashed #ddd;margin-top:8px;padding-top:7px;font-weight:800;}.spending-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px;}.spending-table th{background:#4b5563;color:#fff;padding:8px 6px;text-align:left;}.spending-table td{padding:7px 6px;border-bottom:1px solid #eee;}.main-row:nth-child(even){background:#fafafa;}.sub-row td{padding:1px 0;border:none;color:#888;font-size:10.5px;}.sub-desc{padding-left:14px;}.sub-amt{text-align:right;padding-right:6px;}.text-green{color:var(--green);font-weight:bold;}.text-red{color:var(--red);font-weight:bold;}.text-blue{color:var(--blue);font-weight:bold;}@media print{@page{margin:10mm;size:A4 portrait;}html,body{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;background:#fff;}thead{display:table-header-group;}tr{page-break-inside:avoid!important;break-inside:avoid!important;}tbody tr{page-break-inside:avoid!important;break-inside:avoid!important;}td:first-child,th:first-child{white-space:nowrap;}.a4-page{page-break-after:always;break-after:page;}.a4-page:last-child{page-break-after:avoid!important;break-after:avoid!important;}.sec-p,.sec-b{page-break-after:avoid;break-after:avoid;page-break-inside:avoid;break-inside:avoid;}div[style*="margin-bottom:16px"]{page-break-inside:avoid;break-inside:avoid;}}</style>';

function exportCheckoutPDF(filterMember) {
  var t = state.currentTrip;
  if (!t) return;
  var lc = t.localCurrency, hc = t.baseCurrency;
  var exps = state.expenses.filter(function(e){return e.tripId===t.id;}).sort(function(a,b){return a.date.localeCompare(b.date);});
  
  var mf = filterMember || '';
  var isMember = !!mf;
  var calc = calcAll();
  var members = t.members || [];
  var cashSettlement = calc.cashSettlement;
  var cardSettlement = calc.cardSettlement;
  var memberBreakdown = calc.memberBreakdown;
  var twdCardExps = calc.twdCardExps;
  var foreignCardExps = calc.foreignCardExps;
  var twdGroup = calc.twdGroup;
  var foreignGroup = calc.foreignGroup;
  var now = new Date().toLocaleString('zh-TW');

  function fmtN(n) { var v=parseFloat(n)||0; return v===Math.round(v)?Math.round(v).toLocaleString():v.toFixed(1); }

  function buildSpendingRows(member) {
    var rows='';
    var persExps=exps.filter(function(e){return e.accountType==='支出'&&e.category!=='公費借出';}).map(function(e){
      var sm=(e.splitMembers||[]).filter(function(m){return members.includes(m);});
      var sc=sm.length||members.length;
      var b=parseFloat(e.billingAmount)||0,f=Math.round(b*(parseFloat(e.feeRate)||0)/100),tot=b+f;
      return Object.assign({},e,{sm:sm,sc:sc,costPerPersonTWD:e.paymentMethod==='信用卡'&&b?Math.ceil(tot/sc):0,costPerPersonLocal:(parseFloat(e.amount)||0)/sc,isParticipant:(sm.length?sm:members).includes(member)});
    }).filter(function(e){return e.isParticipant;}).sort(function(a,b){return a.date.localeCompare(b.date);});
    if (!persExps.length) return '<tr><td colspan="6" style="text-align:center;color:#999;padding:8px;">無花費紀錄</td></tr>';
    persExps.forEach(function(e){
      var isCard=e.paymentMethod==='信用卡';
      var payer=getCardPayer(e,members);
      var payerStr=isCard?(parseFloat(e.billingAmount||0)>0?'💳 '+payer+' 信用卡':'💳 '+payer+' (待請款)'):'💵 現金支付';
      
      var b=parseFloat(e.billingAmount)||0, f=Math.round(b*(parseFloat(e.feeRate)||0)/100), tot=b+f;
      var amtStr=isCard&&b>0?('TWD '+fmtN(tot)):((e.currency||lc)+' '+fmtN(e.amount));
      var perStr=isCard&&e.costPerPersonTWD?('TWD '+fmtN(e.costPerPersonTWD)):((e.currency||lc)+' '+fmtN(e.costPerPersonLocal));
      var perCol=isCard?'color:var(--blue);font-weight:bold':'color:var(--red);font-weight:bold';
      var smStr=(e.sm.length?e.sm:members).join('、')+'（'+e.sc+'人）';
      
      var itemName = (e.item||'(未命名)');
      if (isCard && b > 0 && (e.currency||lc) !== hc) {
        itemName += '<br><span style="color:#6b7280;font-size:10.5px;display:inline-block;margin-top:2px;font-weight:normal;">( '+(e.currency||lc)+' '+fmtN(e.amount)+' ｜ 台幣 '+fmtN(b)+' + 手續費 '+fmtN(f)+' )</span>';
      }
      
      rows+='<tr class="main-row"><td>'+e.date+'</td><td>'+itemName+'</td><td>'+payerStr+'</td><td style="text-align:right">'+amtStr+'</td><td>'+smStr+'</td><td style="text-align:right;'+perCol+'">'+perStr+'</td></tr>';
      (e.details||[]).filter(function(d){return d.desc||d.amount;}).forEach(function(d){
        rows+='<tr class="sub-row"><td></td><td colspan="2" class="sub-desc"><span style="color:#cbd5e1;margin-right:4px">└</span>'+d.desc+'</td><td class="sub-amt" style="text-align:right;">'+fmtN(d.amount)+'</td><td></td><td></td></tr>';
      });
    });
    return rows;
  }

  function buildCardGroupHtml(groupExps, groupLabel, hdrBg, hdrCol) {
    if (!groupExps.length) return '';
    var s='<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:700;padding:4px 8px;border-radius:4px;background:'+hdrBg+';color:'+hdrCol+';margin-bottom:6px">'+groupLabel+'</div>';
    members.forEach(function(m){
      var smP=groupExps.filter(function(e){return getCardPayer(e,members)===m;});
      var smO=groupExps.filter(function(e){var sm=(e.splitMembers||[]).filter(function(x){return members.includes(x);});return (sm.length?sm:members).includes(m);});
      var tP=smP.reduce(function(a,e){return a+getCardTotal(e);},0);
      var tO=smO.reduce(function(a,e){var sc=(e.splitMembers||[]).filter(function(x){return members.includes(x);}).length||members.length;return a+getCardCost(e,sc);},0);
      if(tP===0&&tO===0) return;
      var gN=tP-tO, isC=gN>0.01, isD=gN<-0.01;
      var nc=isC?'var(--green)':isD?'var(--red)':'#666';
      var nl=isC?'收回':isD?'應付':'結清';
      s+='<div style="padding:4px 8px;margin-bottom:4px;border-left:3px solid '+nc+';background:'+(isC?'#f0fdf4':isD?'#fef2f2':'#f9fafb')+'">';
      s+='<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700"><span>'+m+'</span><span style="color:'+nc+'">'+nl+' '+hc+' '+fmtN(Math.abs(gN))+'</span></div>';
      var pairs=calcPairNet(m,groupExps,members);
      pairs.forEach(function(p){

      });
      s+='</div>';
    });
    return s+'</div>';
  }

  function buildMemberCardHtml(member, groupExps, groupLabel, hdrBg, hdrCol) {
    var smP=groupExps.filter(function(e){return getCardPayer(e,members)===member;});
    var smO=groupExps.filter(function(e){var sm=(e.splitMembers||[]).filter(function(x){return members.includes(x);});return (sm.length?sm:members).includes(member);});
    var tP=smP.reduce(function(a,e){return a+getCardTotal(e);},0);

    s+='<div style="padding:4px 8px;border-left:3px solid '+nc+';background:'+(isC?'#f0fdf4':isD?'#fef2f2':'#f9fafb')+'">';
    s+='<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700"><span>'+member+'</span><span style="color:'+nc+'">'+nl+' '+hc+' '+fmtN(Math.abs(gN))+'</span></div>';
    var pairs=calcPairNet(member,groupExps,members);

    });
    return s+'</div></div>';
  }

  function buildFinalHtml(filterMember) {
    var filtered=filterMember?cardSettlement.filter(function(s){return s.member===filterMember||s.target===filterMember;}):cardSettlement;
    if(!filtered.length) return '<div style="color:#999;font-size:12px;text-align:center;padding:6px">無刷卡代墊往來</div>';

      s+='<span>'+d.currency+' '+fmtN(d.amount)+'</span></div>';
    });
    return s;
  }

  var printArea = document.getElementById('print-area');
  if (!printArea) { printArea=document.createElement('div'); printArea.id='print-area'; document.body.appendChild(printArea); }

  var html = PDF_CSS;

  if (!isMember) {
    // ── V6 全員總表 ─────────────────────────────
    html += '<div class="a4-page">';
    html += '<div class="report-header-all"><div class="report-title">✈️ 旅遊公費結算報告</div><div style="font-size:12px;color:#888;margin-top:4px">所有成員總表 | '+now+'</div></div>';
    html += '<div class="sec-p">① 旅程資訊</div>';
    html += '<table class="info-table"><tr><td class="info-label">旅程名稱</td><td>'+t.name+'</td></tr><tr><td class="info-label">出發日期</td><td>'+t.startDate+'</td></tr><tr><td class="info-label">成員名單</td><td>'+members.join('、')+' (共 '+members.length+' 人)</td></tr><tr><td class="info-label">當地 / 習慣幣別</td><td>'+lc+' / '+hc+'</td></tr></table>';
    // 多幣別收支已在下方直接從 calc.incomeByCur 取

    var totalBilled=calc.totalBilledTWD||0, pending=calc.pendingCard||0, rounding=calc.splitRoundingError||0;

    html += '<div class="formula-card"><div class="formula-header">💳 刷卡代墊流向 ('+hc+')</div><div class="formula-row"><span>我幫別人代墊</span><span class="text-green">+ '+fmtN(totalCardPaid>0?totalCardPaid:0)+'</span></div><div class="formula-row"><span>別人幫我代墊</span><span class="text-red">- '+fmtN(totalCardPaid<0?-totalCardPaid:0)+'</span></div><div style="height:16px"></div><div class="formula-row formula-total"><span>刷卡淨結算</span><span class="'+(cardNeutral?'':'text-'+(cardNetAmt>0?'green':'red'))+'">'+(cardNeutral?'結清 0':cardNetAmt>0?'應收 '+fmtN(cardNetAmt):'應付 '+fmtN(-cardNetAmt))+'</span></div></div></div>';

// ===== EXCEL =====
function exportExpensesToExcel() {
  const t = state.currentTrip;
  if (!t) return;
  const lc = t.localCurrency;
  const hc = t.baseCurrency;
  const exps = state.expenses.filter(e => e.tripId === t.id).sort((a,b) => a.date.localeCompare(b.date));

  if (exps.length === 0) return alert('目前沒有可匯出的帳目資料');

  const wb = XLSX.utils.book_new();

  const sheet1Header = [
    '日期','項目','類別','收支類型','幣別','金額',
    '付款方式','代墊人',
    '請款金額(TWD)','手續費率(%)','手續費(TWD)','實際請款總額(TWD)',
    '分攤成員','分攤人數',
    '小額支援成員','小額支援金額',
    '借款人','還款人',
    '細項描述','細項金額','備註'
  ];

  const sheet1Rows = [];
  const rowProps = [{ level: 0 }];

  exps.forEach(e => {
    const isIncome = e.accountType === '收入';
    const bill = parseFloat(e.billingAmount) || 0;
    const rate = parseFloat(e.feeRate) || 0;
    const fee  = Math.round(bill * rate / 100);
    const splitMembers = (e.splitMembers || []);
    const subsidies = (e.subsidies || []).filter(s => s.member && parseFloat(s.amount) > 0);
    const details = (e.details || []).filter(d => d.desc || d.amount);

    sheet1Rows.push([
      e.date, e.item || '', e.category || '', e.accountType || '支出', e.currency || lc, parseFloat(e.amount) || 0,
      e.paymentMethod || '現金',
      isIncome ? '' : (e.paymentMethod === '信用卡' ? (e.cardPayer && e.cardPayer !== '我' ? e.cardPayer : (t.members?.[0]||'')) : ''),
      bill > 0 ? bill : '', bill > 0 ? rate : '', bill > 0 ? fee : '', bill > 0 ? (bill + fee) : '',
      splitMembers.join('、'), splitMembers.length || '', 
      subsidies.map(s => s.member).join('、'), subsidies.map(s => `${s.amount}${s.currency||lc}`).join('、'),
      e.borrower || '', e.payer || '', '', '', e.notes || ''
    ]);
    rowProps.push({ level: 0 });

    if (details.length > 0 && !isIncome && e.category !== '公費借出') {
      details.forEach(d => {
        sheet1Rows.push(['', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', d.desc || '', d.amount ? parseFloat(d.amount) : '', '']);
        rowProps.push({ level: 1, hidden: true });
      });
    }
  });

  const ws1 = XLSX.utils.aoa_to_sheet([sheet1Header, ...sheet1Rows]);
  ws1['!cols'] = [10,20,8,8,6,10,8,12,14,10,10,16,20,8,16,16,8,8,24,10,20].map(w=>({wch:w}));
  ws1['!rows'] = rowProps;
  ws1['!outline'] = { summaryBelow: false };
  ws1['!freeze'] = { xSplit: 0, ySplit: 1 };
  XLSX.utils.book_append_sheet(wb, ws1, '花費明細');

  const catMap = {}, pmMap = {};
  exps.filter(e => e.accountType === '支出' && e.category !== '公費借出').forEach(e => {
    const cat = e.category || '其他', cur = e.currency || lc, pm = e.paymentMethod || '現金';
    if (!catMap[cat]) catMap[cat] = {}; catMap[cat][cur] = (catMap[cat][cur] || 0) + (parseFloat(e.amount) || 0);
    if (!pmMap[pm]) pmMap[pm] = {}; pmMap[pm][cur] = (pmMap[pm][cur] || 0) + (parseFloat(e.amount) || 0);
  });

  const sheet2Rows = [['【分類統計】', '', '', ''], [`類別`, `${lc} 金額`, `${hc} 金額`, '佔比(依'+lc+')']];
  const totalLocalExp = Object.values(catMap).reduce((s, c) => s + (c[lc] || 0), 0);
  Object.entries(catMap).sort((a,b) => (b[1][lc]||0) - (a[1][lc]||0)).forEach(([cat, curMap]) => {
    sheet2Rows.push([cat, curMap[lc] || 0, curMap[hc] || 0, totalLocalExp > 0 ? (curMap[lc] || 0) / totalLocalExp * 100 + '%' : '0%']);
  });
  sheet2Rows.push(['小計', totalLocalExp, '', '100%'], ['', '', '', ''], ['【付款方式統計】', '', '', ''], ['付款方式', `${lc} 金額`, `${hc} 金額`, '']);
  Object.entries(pmMap).forEach(([pm, curMap]) => { sheet2Rows.push([pm, curMap[lc] || 0, curMap[hc] || 0, '']); });
  // Sheet2：多幣別成員分攤統計（方案A：每幣別各自一欄，依行程設定順序）
  const allTripCurCodes = [...new Set([...getTripCurrencies().map(c=>currCode(c)), currCode(hc)])];
  const localCurCodes = allTripCurCodes.filter(c=>c!==currCode(hc));
  const memberMapMC = {};
  (t.members||[]).forEach(m=>{
    memberMapMC[m]={card:0, subsidy:0};
    localCurCodes.forEach(c=>{memberMapMC[m]['cash_'+c]=0;});
  });
  exps.filter(e=>e.accountType==='支出'&&e.category!=='公費借出').forEach(e=>{
    const sm=(e.splitMembers||[]).filter(m=>t.members.includes(m)), sc=sm.length||t.members.length;
    const bill=parseFloat(e.billingAmount)||0, twdTotal=bill+Math.round(bill*(parseFloat(e.feeRate)||0)/100);
    const eCurCode=currCode(e.currency||lc);
    (sm.length?sm:t.members).forEach(m=>{
      if(e.paymentMethod==='現金') memberMapMC[m]['cash_'+eCurCode]=(memberMapMC[m]['cash_'+eCurCode]||0)+(parseFloat(e.amount)||0)/sc;
      else if(e.paymentMethod==='信用卡'&&bill>0) memberMapMC[m].card+=Math.ceil(twdTotal/sc);
    });
    (e.subsidies||[]).filter(s=>s.member).forEach(s=>{if(memberMapMC[s.member])memberMapMC[s.member].subsidy+=(parseFloat(s.amount)||0);});
  });
  const cashHeaders = localCurCodes.map(c=>'現金分攤('+c+')');
  const memberHeader = ['成員', ...cashHeaders, '刷卡分攤('+currCode(hc)+')', '小額支援'];
  sheet2Rows.push(['', ...Array(memberHeader.length-1).fill('')], ['【成員分攤統計】', ...Array(memberHeader.length-1).fill('')], memberHeader);
  Object.entries(memberMapMC).forEach(([m,v])=>{
    const cashVals=localCurCodes.map(c=>Math.round((v['cash_'+c]||0)*100)/100);
    sheet2Rows.push([m, ...cashVals, Math.ceil(v.card)||0, v.subsidy||'']);
  });
  const ws2 = XLSX.utils.aoa_to_sheet(sheet2Rows);
  ws2['!cols'] = [{wch:16}, ...Array(memberHeader.length-1).fill({wch:14})];
  XLSX.utils.book_append_sheet(wb, ws2, '分類統計');

  const cardExps = exps.filter(e => e.accountType === '支出' && e.paymentMethod === '信用卡');
  const sheet3Header = ['日期','項目','類別','幣別','刷卡金額','請款金額(TWD)','手續費率(%)','手續費(TWD)','總請款(TWD)','狀態','代墊人','分攤成員'];
  const sheet3Rows = cardExps.map(e => {
    const bill = parseFloat(e.billingAmount) || 0, rate = parseFloat(e.feeRate) || 0, fee = Math.round(bill * rate / 100);
    return [e.date, e.item || '', e.category || '', e.currency || lc, parseFloat(e.amount) || 0, bill || '', rate || '', bill > 0 ? fee : '', bill > 0 ? (bill + fee) : '', bill > 0 ? '✅ 已請款' : '⏳ 待請款', (e.cardPayer && e.cardPayer !== '我' ? e.cardPayer : (t.members?.[0]||'')), (e.splitMembers || []).join('、')];
  });
  const pendingCount = cardExps.filter(e => !e.billingAmount || parseFloat(e.billingAmount) === 0).length;
  const totalBilled = cardExps.reduce((s, e) => { const b = parseFloat(e.billingAmount) || 0; return s + b + Math.round(b * (parseFloat(e.feeRate) || 0) / 100); }, 0);
  sheet3Rows.push([], ['待請款筆數：', pendingCount + ' 筆', '', '', '', '', '', '', '', '', '', ''], ['已請款總額(TWD)：', totalBilled, '', '', '', '', '', '', '', '', '', '']);
  const ws3 = XLSX.utils.aoa_to_sheet([sheet3Header, ...sheet3Rows]);
  ws3['!cols'] = [10,20,8,6,10,14,10,10,12,10,8,20].map(w=>({wch:w}));
  ws3['!freeze'] = { xSplit: 0, ySplit: 1 };
  XLSX.utils.book_append_sheet(wb, ws3, '信用卡請款');

  const totalIncome = exps.filter(e => e.accountType === '收入' && e.item !== '公費收回').reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);
  const totalSubsidy = exps.filter(e => e.accountType === '支出').reduce((s, e) => s + (e.subsidies || []).filter(sub => (sub.currency || lc) === lc).reduce((s2, sub) => s2 + (parseFloat(sub.amount) || 0), 0), 0);
  const totalCashOut = exps.filter(e => e.accountType === '支出' && e.paymentMethod === '現金' && (e.currency || lc) === lc && e.category !== '公費借出').reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);
  const totalCardLocal = exps.filter(e => e.accountType === '支出' && e.paymentMethod === '信用卡' && (e.currency || lc) === lc && e.category !== '公費借出').reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);
  const totalLending = exps.filter(e => e.category === '公費借出').reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);
  const totalReturn  = exps.filter(e => e.category === '公費收回').reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);
  const cashBalance  = totalIncome + totalSubsidy - totalCashOut;
  const dayMap = {};
  exps.filter(e => e.accountType === '支出' && e.category !== '公費借出').forEach(e => { dayMap[e.date] = (dayMap[e.date] || 0) + (parseFloat(e.amount) || 0); });

  const sheet4Rows = [
    ['【旅程資訊】', '', ''], ['旅程名稱', t.name, ''], ['出發日期', t.startDate, ''], ['天數', t.days, '天'], ['成員', (t.members || []).join('、'), ''], ['當地幣別', lc, ''], ['習慣幣別', hc, ''], ['匯出時間', new Date().toLocaleString('zh-TW'), ''], ['', '', ''],
    ['【公費收支摘要】', '', ''], ['項目', '金額', '幣別'], ['公費收入', totalIncome, lc], ['小額支援收入', totalSubsidy, lc], ['現金支出', totalCashOut, lc], ['現金餘額', cashBalance, lc], ['', '', ''], ['信用卡支出', totalCardLocal, lc], ['已請款總額', totalBilled, hc], ['待請款筆數', pendingCount, '筆'], ['', '', ''], ['公費借出', totalLending, lc], ['公費收回', totalReturn, lc], ['未收回餘額', Math.max(0, totalLending - totalReturn), lc], ['', '', ''],
    ['【每日消費統計】', '', ''], ['日期', `消費金額(${lc})`, ''],
    ...Object.entries(dayMap).sort().map(([d, v]) => [d, v, '']),
    ['合計', totalCashOut + totalCardLocal, ''],
  ];
  const ws4 = XLSX.utils.aoa_to_sheet(sheet4Rows);
  ws4['!cols'] = [{wch:18},{wch:18},{wch:8}];
  XLSX.utils.book_append_sheet(wb, ws4, '公費摘要');

  XLSX.writeFile(wb, `${t.name}_公費明細_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function calcAll() {
  const t = state.currentTrip;
  if (!t) return {};
  const exps = state.expenses.filter(e => e.tripId === t.id);
  const members = t.members;
  // 多幣別支援：取行程幣別庫，向下相容
  const allCurs = getTripCurrencies();
  const lc = allCurs[0] || t.localCurrency || 'JPY';
  const hc = t.baseCurrency || 'TWD';
  // 非習慣幣別清單（當地幣別）
  const localCurs = allCurs.filter(c => c !== hc);

  const lendMap = {}, retMap = {};
  members.forEach(m => { lendMap[m] = 0; retMap[m] = 0; });
  exps.filter(e=>e.category==='公費借出').forEach(e => { if (e.borrower) lendMap[e.borrower] = (lendMap[e.borrower]||0) + (parseFloat(e.amount)||0); });
  exps.filter(e=>e.category==='公費收回').forEach(e => { if (e.payer) retMap[e.payer] = (retMap[e.payer]||0) + (parseFloat(e.amount)||0); });
  const outstandingDebts = members.map(m => ({ member: m, amount: (lendMap[m]||0)-(retMap[m]||0) })).filter(d=>d.amount>0);

  // ── 多幣別統計：每種幣別各自計算 ──
  // incomeByCur / expCashByCur / expCardByCur / fundTotalByCur / subsidyByCur
  const incomeByCur = {}, expCashByCur = {}, expCardByCur = {}, fundTotalByCur = {}, subsidyByCur = {};
  const allExpCurs = [...new Set(exps.map(e=>currCode(e.currency||lc)))];
  allExpCurs.forEach(cCode => {
    incomeByCur[cCode]   = exps.filter(e=>e.accountType==='收入'&&e.item!=='公費收回'&&currCode(e.currency||lc)===cCode).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    expCashByCur[cCode]  = exps.filter(e=>e.accountType==='支出'&&e.paymentMethod==='現金'&&currCode(e.currency||lc)===cCode&&e.category!=='公費借出').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    expCardByCur[cCode]  = exps.filter(e=>e.accountType==='支出'&&e.paymentMethod==='信用卡'&&currCode(e.currency||lc)===cCode&&e.category!=='公費借出').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    subsidyByCur[cCode]  = exps.filter(e=>e.accountType==='支出').reduce((t2,e)=>t2+(e.subsidies||[]).filter(s=>currCode(s.currency||lc)===cCode).reduce((s2,s)=>s2+(parseFloat(s.amount)||0),0),0);
    fundTotalByCur[cCode]= incomeByCur[cCode] + subsidyByCur[cCode] - expCashByCur[cCode];
  });

  // 向下相容：以第一幣別為主的單一值
  const totalIncomeDirect = incomeByCur[currCode(lc)] || 0;
  const totalSubsidyReceived = subsidyByCur[currCode(lc)] || 0;
  const totalLendingRaw = exps.filter(e=>e.category==='公費借出').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const totalReturningRaw = exps.filter(e=>e.category==='公費收回').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const totalLendingNet = Math.max(0, totalLendingRaw - totalReturningRaw);
  const totalExpenseCashLocal = expCashByCur[currCode(lc)] || 0;
  const totalExpenseCardLocal = expCardByCur[currCode(lc)] || 0;
  const publicFundTotal = fundTotalByCur[currCode(lc)] || 0;

  // ── 現金結算：多幣別分開計算（memberBreakdownByCur）──
  const memberBreakdownByCur = {}; // { 'JPY': { TT:{initialFee,expenseShare,...}, ... }, 'EUR': {...} }
  localCurs.forEach(c => {
    const cCode = currCode(c);
    const bd = {};
    members.forEach(m => { bd[m] = { initialFee:0, expenseShare:0, memberSubsidy:0, netLoan:0 }; });
    const cInitFees = exps.filter(e=>e.accountType==='收入'&&e.item!=='公費收回'&&currCode(e.currency||lc)===cCode);
    cInitFees.forEach(e => {
      (e.subsidies||[]).filter(s=>currCode(s.currency||lc)===cCode&&s.member&&parseFloat(s.amount)>0).forEach(s => {
        if (bd[s.member]!==undefined) bd[s.member].initialFee += parseFloat(s.amount)||0;
      });
    });
    cInitFees.forEach(e => {
      if (!(e.subsidies||[]).some(s=>s.member&&parseFloat(s.amount)>0)) {
        const amt=(parseFloat(e.amount)||0)/(members.length||1);
        members.forEach(m=>{bd[m].initialFee+=amt;});
      }
    });
    exps.filter(e=>e.accountType==='支出'&&currCode(e.currency||lc)===cCode&&e.category!=='公費借出'&&e.paymentMethod==='現金').forEach(e=>{
      const sm=(e.splitMembers||[]).filter(m=>members.includes(m)); const sc=sm.length||members.length;
      const cost=INT_CURRENCIES.includes(cCode)?Math.round((parseFloat(e.amount)||0)/sc):(parseFloat(e.amount)||0)/sc;
      (sm.length?sm:members).forEach(m=>{bd[m].expenseShare+=cost;});
    });
    exps.forEach(e=>{
      if(currCode(e.currency||lc)!==cCode) return;
      const amt=parseFloat(e.amount)||0;
      if(e.category==='公費借出'&&e.borrower&&members.includes(e.borrower)) bd[e.borrower].netLoan+=amt;
      else if(e.category==='公費收回'&&e.payer&&members.includes(e.payer)) bd[e.payer].netLoan-=amt;
    });
    members.forEach(m=>{
      bd[m].memberSubsidy=exps.filter(e=>e.accountType==='支出'&&e.subsidies).flatMap(e=>e.subsidies).filter(s=>currCode(s.currency||lc)===cCode&&s.member===m).reduce((s,x)=>s+(parseFloat(x.amount)||0),0);
    });
    memberBreakdownByCur[cCode]=bd;
  });

  // 向下相容：memberBreakdown 以第一幣別為主
  const memberBreakdown = memberBreakdownByCur[currCode(lc)] || {};
  if (!Object.keys(memberBreakdown).length) members.forEach(m=>{memberBreakdown[m]={initialFee:0,expenseShare:0,memberSubsidy:0,netLoan:0};});

  // 向下相容：cashSettlement 以第一幣別為主
  const memberSubsidyTotals = {};
  members.forEach(m => { memberSubsidyTotals[m] = memberBreakdown[m]?.memberSubsidy || 0; });
  let splitRoundingError = 0;
  exps.filter(e=>e.accountType==='支出'&&currCode(e.currency||lc)===currCode(lc)&&e.category!=='公費借出'&&e.paymentMethod==='現金').forEach(e=>{
    const sm=(e.splitMembers||[]).filter(m=>members.includes(m)); const sc=sm.length||members.length;
    if(INT_CURRENCIES.includes(currCode(lc))) splitRoundingError+=((parseFloat(e.amount)||0)-Math.round((parseFloat(e.amount)||0)/sc)*sc);
  });

  // 多幣別現金結算：每種當地幣別各自結算
  const cashSettlementByCur = {}; // { 'JPY': [{member,amount,currency,type}], 'EUR': [...] }
  localCurs.forEach(c => {
    const cCode = currCode(c);
    const cMemberBreakdown = {};
    members.forEach(m => { cMemberBreakdown[m] = { initialFee:0, expenseShare:0, memberSubsidy:0, netLoan:0 }; });
    const cInitFees = exps.filter(e=>e.accountType==='收入'&&e.item!=='公費收回'&&currCode(e.currency||lc)===cCode);
    cInitFees.forEach(e => {
      (e.subsidies||[]).filter(s=>currCode(s.currency||lc)===cCode&&s.member&&parseFloat(s.amount)>0).forEach(s => {
        if (cMemberBreakdown[s.member]!==undefined) cMemberBreakdown[s.member].initialFee += parseFloat(s.amount)||0;
      });
    });
    cInitFees.forEach(e => {
      const hasSubs=(e.subsidies||[]).some(s=>s.member&&parseFloat(s.amount)>0);
      if (!hasSubs) { const amt=(parseFloat(e.amount)||0)/(members.length||1); members.forEach(m=>{cMemberBreakdown[m].initialFee+=amt;}); }
    });
    exps.filter(e=>e.accountType==='支出'&&currCode(e.currency||lc)===cCode&&e.category!=='公費借出'&&e.paymentMethod==='現金').forEach(e=>{
      const sm=(e.splitMembers||[]).filter(m=>members.includes(m)); const sc=sm.length||members.length;
      const cost=INT_CURRENCIES.includes(cCode)?Math.round((parseFloat(e.amount)||0)/sc):(parseFloat(e.amount)||0)/sc;
      (sm.length?sm:members).forEach(m=>{cMemberBreakdown[m].expenseShare+=cost;});
    });
    exps.forEach(e=>{
      const amt=parseFloat(e.amount)||0;
      if (currCode(e.currency||lc)!==cCode) return;
      if (e.category==='公費借出'&&e.borrower&&members.includes(e.borrower)) cMemberBreakdown[e.borrower].netLoan+=amt;
      else if (e.category==='公費收回'&&e.payer&&members.includes(e.payer)) cMemberBreakdown[e.payer].netLoan-=amt;
    });
    members.forEach(m=>{
      const ms=exps.filter(e=>e.accountType==='支出'&&e.subsidies).flatMap(e=>e.subsidies).filter(s=>currCode(s.currency||lc)===cCode&&s.member===m).reduce((s,x)=>s+(parseFloat(x.amount)||0),0);
      cMemberBreakdown[m].memberSubsidy=ms;
    });
    cashSettlementByCur[c] = members.map(m=>{
      const {initialFee,expenseShare,memberSubsidy,netLoan}=cMemberBreakdown[m];
      const amt=initialFee-expenseShare+memberSubsidy-netLoan;
      return {member:m,amount:amt,currency:c,type:amt>0?'應退給成員':amt<0?'應補進公費':'結清'};
    }).filter(s=>Math.abs(s.amount)>0.01);
  });

  // 向下相容：cashSettlement 仍以第一幣別為準
  let totalRefund=0, totalCollect=0;
  const cashSettlement = members.map(m => {
    const { initialFee,expenseShare,memberSubsidy,netLoan } = memberBreakdown[m];
    const amt = initialFee - expenseShare + memberSubsidy - netLoan;
    if (amt>0) totalRefund+=amt; else if (amt<0) totalCollect+=Math.abs(amt);
    return { member:m, amount:amt, currency:lc, type: amt>0?'應退給成員':amt<0?'應補進公費':'結清' };
  }).filter(s=>Math.abs(s.amount)>0.01);
  const publicFundRemainder = publicFundTotal - (totalRefund - totalCollect);

  // ── 刷卡結算：依 billingType 決定結算幣別 ──
  const cardExps = exps.filter(e=>e.accountType==='支出'&&e.paymentMethod==='信用卡'&&e.category!=='公費借出');
  const twdCardExps     = cardExps.filter(e=>currCode(e.currency||lc)===currCode(hc));
  const foreignCardExps = cardExps.filter(e=>currCode(e.currency||lc)!==currCode(hc));
  // 依請款幣別進一步分組（TWD請款 vs 原幣請款）
  const foreignTwdCards  = foreignCardExps.filter(e=>!e.billingType||e.billingType==='twd');  // 換算TWD
  const foreignOrigCards = foreignCardExps.filter(e=>e.billingType==='original');               // 維持原幣

  function calcCardGroup(group) {
    const owed={}, paid={};
    members.forEach(m=>{ owed[m]=0; paid[m]=0; });
    group.forEach(e=>{
      const sm=(e.splitMembers||[]).filter(m=>members.includes(m)); const sc=sm.length||members.length;
      const total=getCardTotal(e); if(total<=0) return;
      const cost=Math.ceil(total/sc);
      (sm.length?sm:members).forEach(m=>{ owed[m]+=cost; });
      const payer=getCardPayer(e,members);
      if(payer&&members.includes(payer)) paid[payer]+=total;
    });
    return {owed, paid};
  }
  const twdGroup     = calcCardGroup(twdCardExps);
  const foreignGroup = calcCardGroup(foreignTwdCards); // 只計換算TWD的外幣

  // 原幣請款：每種幣別各自計算
  const origCardByCur = {};
  foreignOrigCards.forEach(e=>{
    const c=e.currency||lc;
    if(!origCardByCur[c]) origCardByCur[c]={exps:[]};
    origCardByCur[c].exps.push(e);
  });
  const origCardGroups = {};
  Object.entries(origCardByCur).forEach(([c,{exps:cExps}])=>{
    origCardGroups[c] = calcCardGroup(cExps);
  });

  const memberOwed={}, memberPaid={};
  members.forEach(m=>{
    memberOwed[m] = twdGroup.owed[m]+foreignGroup.owed[m];
    memberPaid[m] = twdGroup.paid[m]+foreignGroup.paid[m];
  });
  const cardNet={};
  members.forEach(m=>{ cardNet[m]=memberPaid[m]-memberOwed[m]; });
  const creditors=members.filter(m=>cardNet[m]>0.01).map(m=>({member:m,net:cardNet[m]}));
  const debtors=members.filter(m=>cardNet[m]<-0.01).map(m=>({member:m,net:Math.abs(cardNet[m])}));
  function buildMemberSrc(debtorMember, creditorMember, group, label) {
    return group.filter(e=>{
      const sm=(e.splitMembers||[]).filter(m=>members.includes(m));
      return (sm.length?sm:members).includes(debtorMember)&&getCardPayer(e,members)===creditorMember;
    }).map(e=>{
      const sm2=(e.splitMembers||[]).filter(m=>members.includes(m)); const sc2=sm2.length||members.length;
      const cost=getCardCost(e,sc2);
      return cost>0?{item:e.item,date:e.date,cost,label}:null;
    }).filter(Boolean);
  }
  const cardSettlement=[];
  let ci=0,di=0;
  const crCopy=creditors.map(x=>({...x})), deCopy=debtors.map(x=>({...x}));
  while(ci<crCopy.length&&di<deCopy.length){
    const cr=crCopy[ci],de=deCopy[di];
    const amt=Math.min(cr.net,de.net);
    if(amt>0.01){
      const srcTWD     = buildMemberSrc(de.member,cr.member,twdCardExps,'TWD刷卡');
      const srcForeign = buildMemberSrc(de.member,cr.member,foreignTwdCards,'換算TWD刷卡');
      cardSettlement.push({
        member:de.member, target:cr.member, amount:amt, currency:hc, type:'應付代墊',
        source:[...srcTWD,...srcForeign],
        srcTWD, srcForeign
      });
      cr.net-=amt; de.net-=amt;
    }
    if(cr.net<0.01)ci++; if(de.net<0.01)di++;
  }

  // 原幣刷卡結算（每種幣別各自）
  const origCardSettlementByCur = {};
  Object.entries(origCardGroups).forEach(([c,grp])=>{
    const cNet={};
    members.forEach(m=>{ cNet[m]=grp.paid[m]-grp.owed[m]; });
    const cCred=members.filter(m=>cNet[m]>0.01).map(m=>({member:m,net:cNet[m]}));
    const cDebt=members.filter(m=>cNet[m]<-0.01).map(m=>({member:m,net:Math.abs(cNet[m])}));
    const cSettle=[];
    let ci2=0,di2=0;
    const crC=cCred.map(x=>({...x})), deC=cDebt.map(x=>({...x}));
    while(ci2<crC.length&&di2<deC.length){
      const cr=crC[ci2],de=deC[di2];
      const amt=Math.min(cr.net,de.net);
      if(amt>0.01){ cSettle.push({member:de.member,target:cr.member,amount:amt,currency:c,type:'應付原幣代墊'}); cr.net-=amt; de.net-=amt; }
      if(cr.net<0.01)ci2++; if(de.net<0.01)di2++;
    }
    origCardSettlementByCur[c]=cSettle;
  });

  const cardCreditorDetail={};
  members.filter(m=>cardNet[m]>0.01).forEach(m=>{
    const twdPaid   = twdCardExps.filter(e=>getCardPayer(e,members)===m).map(e=>{const sc=(e.splitMembers||[]).filter(x=>members.includes(x)).length||members.length;return{item:e.item,date:e.date,total:getCardTotal(e),cost:getCardCost(e,sc),label:'TWD刷卡'};});
    const forPaid   = foreignTwdCards.filter(e=>getCardPayer(e,members)===m).map(e=>{const sc=(e.splitMembers||[]).filter(x=>members.includes(x)).length||members.length;return{item:e.item,date:e.date,total:getCardTotal(e),cost:getCardCost(e,sc),label:'換算TWD刷卡'};});
    cardCreditorDetail[m]={twdPaid,forPaid,net:cardNet[m]};
  });
  const twdCardTotal     = members.reduce((s,m)=>s+Math.max(0,twdGroup.paid[m]-twdGroup.owed[m]),0);
  const foreignCardTotal = members.reduce((s,m)=>s+Math.max(0,foreignGroup.paid[m]-foreignGroup.owed[m]),0);

  const cardBilling=exps.filter(e=>e.accountType==='支出'&&e.paymentMethod==='信用卡');
  const domesticCards=cardBilling.filter(e=>currCode(e.currency||lc)===currCode(hc));
  const overseasCards=cardBilling.filter(e=>currCode(e.currency||lc)!==currCode(hc));
  const totalBilledLocal=overseasCards.filter(e=>e.billingAmount).reduce((s,e)=>{ const b=parseFloat(e.billingAmount)||0,f=Math.round(b*(parseFloat(e.feeRate)||0)/100); return s+b+f; },0);
  const totalTWDCardDirect=domesticCards.reduce((s,e)=>{ const a=parseFloat(e.amount)||0,f=Math.round(a*(parseFloat(e.feeRate)||0)/100); return s+a+f; },0);
  const totalBilledOverseasTWD=totalBilledLocal;
  const totalDomesticCard=totalTWDCardDirect;
  const totalBilledTWD=totalBilledLocal+totalTWDCardDirect;
  const totalOverseasLocalCard=overseasCards.filter(e=>e.category!=='公費借出').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const pendingCard=overseasCards.filter(e=>!e.billingAmount||parseFloat(e.billingAmount)===0).length;

  return {
    exps, members, lc, hc, allCurs, localCurs, outstandingDebts,
    totalLendingRaw, totalReturningRaw, totalLendingNet,
    totalIncomeDirect, totalSubsidyReceived, totalExpenseCashLocal, totalExpenseCardLocal,
    publicFundTotal, publicFundRemainder, totalRefund, totalCollect,
    incomeByCur, expCashByCur, expCardByCur, subsidyByCur, fundTotalByCur,

function getFilteredExpenses() {
  const t = state.currentTrip;
  if (!t) return [];
  const { filterDates, filterPaymentMethods, filterCurrencies, searchTerm, filterMembers, filterCategories, filterDateFrom, filterDateTo } = state;
  const lc = t.localCurrency;
  return state.expenses.filter(e => {
    if (e.tripId !== t.id) return false;
    if (filterDates.length && !filterDates.includes(e.date)) return false;
    if (filterPaymentMethods.length && e.accountType !== '收入' && !filterPaymentMethods.includes(e.paymentMethod)) return false;
    if (filterCurrencies.length && !filterCurrencies.includes(e.currency||lc)) return false;
    // 日期範圍篩選
    if (filterDateFrom && e.date < filterDateFrom) return false;
    if (filterDateTo && e.date > filterDateTo) return false;
    // 成員篩選
    if (filterMembers.length) {
      const members = t.members || [];
      const sm = (e.splitMembers||[]).filter(m => members.includes(m));
      const participants = sm.length ? sm : members;
      const payerMatch = filterMembers.includes(e.cardPayer) || filterMembers.includes(e.payer);
      const participantMatch = filterMembers.some(m => participants.includes(m));
      if (!payerMatch && !participantMatch) return false;
    }
    // 類別篩選
    if (filterCategories.length && !filterCategories.includes(e.category)) return false;
    if (searchTerm) {
      const q = searchTerm.toLowerCase();
      const fields = [e.item,e.amount,e.category,e.notes,e.payer,e.borrower,e.cardPayer];
      const detMatch = (e.details||[]).some(d=>d.desc?.toLowerCase().includes(q)||d.amount?.toString().includes(q));
      const subMatch = (e.subsidies||[]).some(s=>s.member?.toLowerCase().includes(q));
      if (!fields.some(f=>f?.toString().toLowerCase().includes(q)) && !detMatch && !subMatch) return false;
    }
    return true;
  });
}

const DEFAULT_CURRENCIES = [
  {code:'JPY',name:'JPY (日圓)'},
  {code:'KRW',name:'KRW (韓元)'},
  {code:'THB',name:'THB (泰銖)'},

function initEditTripCurrencyPanel() {

function getCurState(mode) {
  return mode==='new'
    ? {curs:_newTripCurs, custom:_newTripCustom}
    : {curs:_editTripCurs, custom:_editTripCustom};
}

function getAllChipOptions(mode) {
  const {custom} = getCurState(mode);
  const all = [...DEFAULT_CURRENCIES];
  Object.entries(custom).forEach(([code, name]) => {
    if (!all.find(x=>x.code===code)) all.push({code, name});
  });
  return all;
}

function renderCurrencyChips(mode) {
  const el = document.getElementById(mode+'-trip-chips');
  if (!el) return;
  const {curs} = getCurState(mode);
  const options = getAllChipOptions(mode);
  el.innerHTML = options.map(opt => {
    const selected = curs.includes(opt.code);
    return '<span class="cur-chip '+(selected?'selected':'')+'" onclick="toggleCurrencyChip(\''+mode+'\',\''+opt.code+'\')"><span class="cur-chip-check">'+(selected?'✓':'○')+'</span>'+opt.name+'</span>';
  }).join('');
}

function toggleCurrencyChip(mode, code) {
  const {curs} = getCurState(mode);
  // 防呆：有歷史記錄的幣別不可取消（編輯模式）
  if (mode==='edit' && curs.includes(code)) {
    const t = state.currentTrip;
    if (t) {
      const hasData = [...(state.expenses||[]),...(state.personalExpenses||[])]
        .some(e=>e.tripId===t.id && currCode(e.currency||localCur())===code);
      if (hasData) {
        alert('「'+code+'」已有花費記錄，無法取消勾選。\n可將其移到清單最下方。');
        return;
      }
    }
  }
  const idx = curs.indexOf(code);
  if (idx>=0) { curs.splice(idx,1); }
  else { curs.push(code); }
  renderCurrencyChips(mode);
  renderCurrencySortList(mode);
}

function renderCurrencySortList(mode) {
  const el = document.getElementById(mode+'-trip-sort-list');
  if (!el) return;
  const {curs, custom} = getCurState(mode);
  const getAllName = code => {
    if (custom[code]) return custom[code];
    const found = DEFAULT_CURRENCIES.find(x=>x.code===code);
    return found ? found.name : code;
  };
  if (curs.length===0) {
    el.innerHTML = '<div style="padding:12px;color:#aaa;text-align:center;font-size:13px">請先勾選幣別</div>';
    return;
  }
  el.innerHTML = curs.map((code,i)=>`
    <div class="cur-sort-item">
      <span class="cur-sort-handle">☰</span>
      <span class="cur-sort-name">${i+1}. ${getAllName(code)}</span>
      <div class="cur-sort-btns">
        <button class="cur-sort-btn" ${i===0?'disabled':''} onclick="moveCurrency('${mode}',${i},-1)">↑</button>
        <button class="cur-sort-btn" ${i===curs.length-1?'disabled':''} onclick="moveCurrency('${mode}',${i},1)">↓</button>
      </div>
    </div>`).join('')+`
    <div class="cur-sort-item locked">
      <span class="cur-sort-handle" style="opacity:0">☰</span>
      <span class="cur-sort-name">${curs.length+1}. TWD (習慣幣別) 🔒</span>
    </div>`;
}

function moveCurrency(mode, idx, dir) {
  const {curs} = getCurState(mode);
  const newIdx = idx + dir;
  if (newIdx<0 || newIdx>=curs.length) return;
  [curs[idx], curs[newIdx]] = [curs[newIdx], curs[idx]];
  renderCurrencySortList(mode);
}

function addCustomCurrency(mode) {
  const codeEl = document.getElementById(mode+'-cur-code');
  const nameEl = document.getElementById(mode+'-cur-name');
  if (!codeEl || !nameEl) return;
  const code = codeEl.value.trim().toUpperCase();
  const namePart = nameEl.value.trim();
  if (!/^[A-Z]{3}$/.test(code)) return alert('幣別代碼請輸入 3 個英文字母，例如：SEK');
  if (namePart && !/^\([^\)]{1,5}\)$/.test(namePart)) return alert('幣別名稱格式：(最多5個中文字)，例如：(瑞典克朗)');
  const fullName = namePart ? code+' '+namePart : code;
  const {curs, custom} = getCurState(mode);
  custom[code] = fullName;
  if (!curs.includes(code)) curs.push(code);
  codeEl.value = ''; nameEl.value = '';
  renderCurrencyChips(mode);
  renderCurrencySortList(mode);
}

// 從 Google Maps 完整連結解析經緯度
function parseLatLngFromUrl(url) {
  if (!url) return null;
  // 格式1: @lat,lng,zoom  例如 @35.6654,139.7707,17z
  let m = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  // 格式2: /maps?q=lat,lng
  m = url.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  // 格式3: ll=lat,lng
  m = url.match(/ll=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  return null;
}

// 取得所有行程（含座標資訊）
function getAllItinItems() {
  const t = state.currentTrip;
  if (!t) return [];
  const days = parseInt(t.days)||1;
  const result = [];
  for (let i=0;i<days;i++) {
    const key = `${t.id}-${i}`;
    const dayDate = getDayDate(t.startDate, i);
    const rawDate = getRawDayDate(t.startDate, i);
    (state.schedule[key]||[]).forEach(item => {
      const coord = parseLatLngFromUrl(item.mapsUrl);
      result.push({ ...item, key, dayIdx:i, dayDate, rawDate, coord });
    });
  }
  return result;
}
